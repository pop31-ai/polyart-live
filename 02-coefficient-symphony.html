<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coefficient Symphony</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0612;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#title{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:20px;letter-spacing:6px;text-transform:uppercase;text-shadow:0 0 20px #f0a,0 0 40px #a0f;z-index:10}
#sliders{position:absolute;right:20px;top:60px;z-index:10;display:flex;flex-direction:column;gap:6px}
.sl{display:flex;align-items:center;gap:8px}
.sl label{color:#fa0;font-size:10px;text-transform:uppercase;letter-spacing:1px;width:22px;text-align:right;text-shadow:0 0 6px #f80}
.sl input[type=range]{width:140px;accent-color:#fa0;cursor:pointer}
.sl .sv{color:#ff0;font-size:11px;width:40px;text-shadow:0 0 6px #ff0}
#info{position:absolute;top:16px;left:16px;color:#886644;font-size:11px;z-index:10;letter-spacing:1px}
#presets{position:absolute;top:16px;right:20px;z-index:10;display:flex;gap:6px}
.pb{padding:4px 10px;background:rgba(255,170,0,0.06);border:1px solid #fa03;color:#fa0;font-size:9px;cursor:pointer;border-radius:3px;text-transform:uppercase;letter-spacing:1px;transition:all .2s}
.pb:hover{background:rgba(255,170,0,0.2);text-shadow:0 0 6px #fa0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Coefficient Symphony</div>
<div id="info">P(x) = a₀ + a₁x + a₂x² + ... — каждый слайдер меняет форму ландшафта</div>
<div id="presets">
<button class="pb" onclick="lp(0)">Горы</button>
<button class="pb" onclick="lp(1)">Волны</button>
<button class="pb" onclick="lp(2)">Каньон</button>
<button class="pb" onclick="lp(3)">Пещера</button>
</div>
<div id="sliders"></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

const N=9;
const container=document.getElementById('sliders');
const vals=[];
for(let i=0;i<N;i++){
  vals.push((Math.random()-0.5)*4);
  const d=document.createElement('div');d.className='sl';
  d.innerHTML=`<label>a${i}</label><input type="range" id="c${i}" min="-5" max="5" value="${vals[i].toFixed(1)}" step="0.05"><span class="sv" id="v${i}">${vals[i].toFixed(2)}</span>`;
  container.appendChild(d);
  d.querySelector('input').addEventListener('input',e=>{
    vals[i]=parseFloat(e.target.value);
    document.getElementById('v'+i).textContent=vals[i].toFixed(2);
  });
}

const presets=[
  [0,-2,0,3,-1,0.5,0,-0.1,0.02],
  [1,0,-3,0,2,0,-1,0,0.3],
  [2,-1,4,-3,1,-0.3,0.05,0,-0.01],
  [-1,3,-2,0.5,0.1,-0.05,0.01,0,0],
];
function lp(i){presets[i].forEach((v,j)=>{vals[j]=v;document.getElementById('c'+j).value=v;document.getElementById('v'+j).textContent=v.toFixed(2);});}

function poly(x){
  let s=0;
  for(let i=0;i<N;i++)s+=vals[i]*Math.pow(x,i);
  return s;
}

let t=0;
const layers=8;
const layerColors=[
  [255,100,50],[255,150,30],[255,200,0],[100,255,100],
  [50,200,255],[100,100,255],[200,50,255],[255,50,200]
];

function draw(){
  t+=0.008;
  X.fillStyle='rgba(10,6,18,0.15)';
  X.fillRect(0,0,W,H);

  for(let l=0;l<layers;l++){
    const ly=H*0.3+l*H*0.09;
    const alpha=0.15+l*0.04;
    const sc=0.5+l*0.12;
    const c=layerColors[l];
    const phase=t*(0.3+l*0.1);

    X.beginPath();
    X.moveTo(0,H);
    for(let px=0;px<=W;px+=2){
      const x=(px/W-0.5)*10;
      let y=poly(x+Math.sin(phase+l)*0.5)*sc;
      y+=Math.sin(x*3+phase*2+l)*0.2;
      const screenY=ly-y*H*0.08;
      X.lineTo(px,screenY);
    }
    X.lineTo(W,H);X.closePath();

    const grad=X.createLinearGradient(0,ly-H*0.3,0,H);
    grad.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${alpha})`);
    grad.addColorStop(0.6,`rgba(${c[0]*0.5|0},${c[1]*0.5|0},${c[2]*0.5|0},${alpha*0.6})`);
    grad.addColorStop(1,`rgba(${c[0]*0.2|0},${c[1]*0.2|0},${c[2]*0.2|0},${alpha*0.2})`);
    X.fillStyle=grad;
    X.fill();

    X.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${alpha*1.5})`;
    X.lineWidth=1.5;
    X.beginPath();
    for(let px=0;px<=W;px+=2){
      const x=(px/W-0.5)*10;
      let y=poly(x+Math.sin(phase+l)*0.5)*sc;
      y+=Math.sin(x*3+phase*2+l)*0.2;
      const screenY=ly-y*H*0.08;
      px===0?X.moveTo(px,screenY):X.lineTo(px,screenY);
    }
    X.stroke();
  }

  const topHue=(t*20)%360;
  for(let i=0;i<30;i++){
    const px=(Math.sin(t*0.3+i*2.1)*0.3+0.5)*W;
    const py=(Math.cos(t*0.2+i*1.7)*0.15+0.15)*H;
    const s=1+Math.sin(t+i)*0.5;
    const grad=X.createRadialGradient(px,py,0,px,py,s*15);
    grad.addColorStop(0,`hsla(${(topHue+i*12)%360},90%,70%,0.15)`);
    grad.addColorStop(1,`hsla(${(topHue+i*12)%360},80%,40%,0)`);
    X.fillStyle=grad;X.beginPath();X.arc(px,py,s*15,0,Math.PI*2);X.fill();
  }

  requestAnimationFrame(draw);
}

lp(0);draw();
</script>
</body>
</html>
