<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>36 — Сстройка Крепости — PolyArt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060608;overflow:hidden;font-family:sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10;flex-wrap:wrap;justify-content:center}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#aaa;font-size:9px;text-transform:uppercase;letter-spacing:1.5px}
.ctrl .val{color:#ddd;font-size:11px;font-weight:bold}
button.tog{background:none;border:1px solid #fc0;color:#fc0;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px;letter-spacing:1px}
button.tog:hover{background:rgba(255,200,0,0.1)}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 20px #fc05;z-index:10;opacity:0.4}
#part-label{position:absolute;top:50px;left:50%;transform:translateX(-50%);color:#fc0;font-size:11px;letter-spacing:3px;z-index:10;opacity:0.6;text-align:center;max-width:550px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Стройка Крепости</div>
<div id="part-label"></div>
<div id="ui">
<div class="ctrl"><label>Этап</label><button class="tog" id="prevBtn">&#9664;</button><span class="val" id="stageV">0/12</span><button class="tog" id="nextBtn">&#9654;</button></div>
<div class="ctrl"><label>Автосборка</label><button class="tog" id="autoBtn">СТАРТ</button></div>
<div class="ctrl"><label>Скорость</label><input type="range" id="speed" min="0" max="100" value="0" style="width:70px;accent-color:#fc0"><span class="val" id="speedV">0</span></div>
</div>
<script>
var C=document.getElementById('c'),X=C.getContext('2d'),W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);
var stage=0,autoMode=false,autoTimer=0,maxStage=12,t=0;
document.getElementById('prevBtn').onclick=function(){if(stage>0){stage--;document.getElementById('stageV').textContent=stage+'/'+maxStage}};
document.getElementById('nextBtn').onclick=function(){if(stage<maxStage){stage++;document.getElementById('stageV').textContent=stage+'/'+maxStage}};
document.getElementById('autoBtn').onclick=function(){autoMode=!autoMode;this.textContent=autoMode?'СТОП':'СТАРТ'};
document.getElementById('speed').oninput=function(){document.getElementById('speedV').textContent=this.value};

var pts=['Рельеф — скала на берегу · обзор 360° · естественная защита','Фундамент — валуны · известь · песок · глубина 3м','Стены — камень 1.2м · зубцы · бойницы · высота 12м','Башни — 4 угловые · круглые · внутри лестницы','Ворота — подъёмный мост · решётка · барбакан','Внутренний двор — колодец · кузница · казармы','Подземелье — тайные ходы · тюрьма · запасы','Стены замка — донжон · столовая · личные покои','Система водоснабжения — колодец · цистерна · рвы','Оборона — баллисты · камнемёты · засеки','Окружение — ров · палисад · колючая проволока','Украшения — герб · флаг · витражи · свет в окнах','Крепость жива — стража на стенах · костры · сигналы'];

function lbl(t2,x,y,c,sz){X.globalAlpha=0.6;X.font=(sz||7)+'px monospace';X.fillStyle=c||'rgba(255,220,180,0.8)';X.textAlign='center';X.fillText(t2,x,y);X.textAlign='left';X.globalAlpha=1}

function draw(){
  var spd=parseInt(document.getElementById('speed').value);
  if(autoMode){autoTimer+=0.016;if(autoTimer>2){autoTimer=0;if(stage<maxStage){stage++;document.getElementById('stageV').textContent=stage+'/'+maxStage}else{autoMode=false;document.getElementById('autoBtn').textContent='СТАРТ'}}}
  t+=0.016;
  X.fillStyle='#060608';X.fillRect(0,0,W,H);
  var cx=W/2,gy=H*0.72,s=Math.min(W,H)/650;
  var fs=W*0.12,fe=W*0.88;

  // Sky gradient
  var sg=X.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'rgba(15,20,40,0.03)');sg.addColorStop(1,'rgba(30,35,25,0.02)');
  X.fillStyle=sg;X.fillRect(0,0,W,gy);

  // Moon
  X.fillStyle='rgba(220,220,240,0.03)';X.beginPath();X.arc(W*0.8,H*0.12,20*s,0,Math.PI*2);X.fill();
  X.fillStyle='#060608';X.beginPath();X.arc(W*0.8+7*s,H*0.12-3*s,18*s,0,Math.PI*2);X.fill();

  // Stars
  for(var st2=0;st2<20;st2++){
    X.fillStyle='rgba(255,255,255,'+(0.02+0.01*Math.sin(t*2+st2))+')';
    X.beginPath();X.arc((Math.sin(st2*7.3)*0.4+0.5)*W,(Math.cos(st2*4.7)*0.3+0.1)*H,0.5,0,Math.PI*2);X.fill();
  }

  // Ground / cliff
  X.fillStyle='rgba(50,45,35,0.06)';X.fillRect(0,gy,W,H-gy);
  // Cliff face
  X.fillStyle='rgba(70,60,45,0.05)';X.beginPath();X.moveTo(W*0.3,gy);X.lineTo(W*0.2,gy+30*s);X.lineTo(W*0.15,gy+60*s);X.lineTo(W*0.15,H);X.lineTo(W*0.85,H);X.lineTo(W*0.85,gy+60*s);X.lineTo(W*0.8,gy+30*s);X.lineTo(W*0.7,gy);X.closePath();X.fill();
  X.strokeStyle='rgba(90,80,60,0.08)';X.lineWidth=0.5;
  X.beginPath();X.moveTo(W*0.3,gy);X.quadraticCurveTo(W*0.25,gy+15*s,W*0.2,gy+30*s);X.quadraticCurveTo(W*0.17,gy+45*s,W*0.15,gy+60*s);X.stroke();
  X.beginPath();X.moveTo(W*0.7,gy);X.quadraticCurveTo(W*0.75,gy+15*s,W*0.8,gy+30*s);X.quadraticCurveTo(W*0.83,gy+45*s,W*0.85,gy+60*s);X.stroke();

  // Cliff texture
  for(var cl=0;cl<8;cl++){
    var clx=W*0.2+cl*(W*0.6/8);
    var cly=gy+10*s+Math.sin(cl*2)*15*s;
    X.strokeStyle='rgba(80,70,50,0.04)';X.lineWidth=0.3;
    X.beginPath();X.moveTo(clx,cly);X.lineTo(clx+15*s,cly+20*s);X.stroke();
  }

  // === STAGE 0: Relief ===
  if(stage>=0){
    lbl('скала · обзор 360° · естественная защита',cx,gy-15*s,'rgba(200,190,170,0.5)',6);
  }

  // === STAGE 1: Foundation ===
  if(stage>=1){
    var fW=W*0.4,fH=15*s;
    X.fillStyle='rgba(100,90,70,0.06)';X.fillRect(cx-fW/2,gy-fH,fW,fH);
    X.strokeStyle='rgba(120,110,90,0.12)';X.lineWidth=0.6;X.strokeRect(cx-fW/2,gy-fH,fW,fH);
    // Stone texture
    for(var st3=0;st3<8;st3++){
      var stx=cx-fW/2+st3*(fW/8);
      X.strokeStyle='rgba(110,100,80,0.06)';X.lineWidth=0.3;
      X.beginPath();X.moveTo(stx,gy-fH);X.lineTo(stx,gy);X.stroke();
    }
    // Mortar
    X.strokeStyle='rgba(160,150,120,0.04)';X.lineWidth=0.3;
    X.beginPath();X.moveTo(cx-fW/2,gy-fH*0.5);X.lineTo(cx+fW/2,gy-fH*0.5);X.stroke();
    lbl('валуны · известь · песок · глубина 3м',cx,gy-fH-10*s,'rgba(180,170,150,0.5)',6);
  }

  // === STAGE 2: Walls ===
  if(stage>=2){
    var wW=W*0.4,wH=60*s;
    // Main walls
    X.fillStyle='rgba(90,85,70,0.06)';X.fillRect(cx-wW/2,gy-15*s-wH,wW,wH);
    X.strokeStyle='rgba(110,105,90,0.12)';X.lineWidth=0.7;X.strokeRect(cx-wW/2,gy-15*s-wH,wW,wH);
    // Stone courses
    for(var sc=0;sc<8;sc++){
      var scy=gy-15*s-wH+sc*(wH/8);
      X.strokeStyle='rgba(100,95,80,0.06)';X.lineWidth=0.3;
      X.beginPath();X.moveTo(cx-wW/2,scy);X.lineTo(cx+wW/2,scy);X.stroke();
    }
    // Vertical joints
    for(var vj=0;vj<12;vj++){
      var vjx=cx-wW/2+vj*(wW/12);
      var row=vj%2;
      X.strokeStyle='rgba(100,95,80,0.04)';X.lineWidth=0.2;
      X.beginPath();X.moveTo(vjx,gy-15*s-wH+row*5*s);X.lineTo(vjx,gy-15*s);X.stroke();
    }
    // Battlements
    for(var bt=0;bt<10;bt++){
      var bx=cx-wW/2+bt*(wW/9);
      if(bt%2===0){
        X.fillStyle='rgba(90,85,70,0.06)';X.fillRect(bx-4*s,gy-15*s-wH-8*s,8*s,8*s);
        X.strokeStyle='rgba(110,105,90,0.1)';X.lineWidth=0.4;X.strokeRect(bx-4*s,gy-15*s-wH-8*s,8*s,8*s);
      }
    }
    // Arrow slits
    for(var as2=0;as2<4;as2++){
      var asx=cx-wW/4+as2*(wW/4);
      var asy=gy-15*s-wH*0.6;
      X.fillStyle='rgba(20,15,10,0.06)';X.fillRect(asx-1*s,asy-8*s,2*s,16*s);
      X.strokeStyle='rgba(110,105,90,0.08)';X.lineWidth=0.3;X.strokeRect(asx-1*s,asy-8*s,2*s,16*s);
    }
    lbl('камень 1.2м · зубцы · бойницы · 12м',cx,gy-15*s-wH-15*s,'rgba(180,170,150,0.5)',6);
  }

  // === STAGE 3: Towers ===
  if(stage>=3){
    var tH=80*s,tR=18*s;
    // 4 corner towers
    var towerPos=[[cx-wW/2,gy-15*s],[cx+wW/2,gy-15*s],[cx-wW/2,gy-15*s-wH],[cx+wW/2,gy-15*s-wH]];
    for(var tw=0;tw<4;tw++){
      var twx=towerPos[tw][0],twy=towerPos[tw][1];
      // Tower body
      X.fillStyle='rgba(85,80,65,0.07)';X.fillRect(twx-tR,twy-tH,tR*2,tH);
      X.strokeStyle='rgba(105,100,85,0.12)';X.lineWidth=0.6;X.strokeRect(twx-tR,twy-tH,tR*2,tH);
      // Tower top (conical)
      X.strokeStyle='rgba(105,100,85,0.1)';X.lineWidth=0.6;
      X.beginPath();X.moveTo(twx-tR-3*s,twy-tH);X.lineTo(twx,twy-tH-15*s);X.lineTo(twx+tR+3*s,twy-tH);X.stroke();
      // Stone texture on tower
      for(var ts=0;ts<4;ts++){
        var tsy=twy-tH+ts*(tH/4);
        X.strokeStyle='rgba(100,95,80,0.05)';X.lineWidth=0.2;
        X.beginPath();X.moveTo(twx-tR,tsy);X.lineTo(twx+tR,tsy);X.stroke();
      }
      // Tower battlements
      for(var tb=0;tb<3;tb++){
        var tbx=twx-tR+tb*tR*0.66;
        X.fillStyle='rgba(85,80,65,0.06)';X.fillRect(tbx-3*s,twy-tH-6*s,6*s,6*s);
      }
      // Arrow slit on tower
      X.fillStyle='rgba(20,15,10,0.06)';X.fillRect(twx-1*s,twy-tH*0.6,2*s,12*s);
    }
    lbl('4 угловые · круглые · внутри лестницы',cx,gy-15*s-tH-25*s,'rgba(180,170,150,0.5)',6);
  }

  // === STAGE 4: Gates ===
  if(stage>=4){
    var gateX=cx,gateY=gy-15*s;
    var gateW=25*s,gateH=35*s;
    // Gatehouse
    X.fillStyle='rgba(80,75,60,0.07)';X.fillRect(gateX-gateW*0.7,gateY-gateH*1.2,gateW*1.4,gateH*1.2);
    X.strokeStyle='rgba(100,95,80,0.12)';X.lineWidth=0.5;X.strokeRect(gateX-gateW*0.7,gateY-gateH*1.2,gateW*1.4,gateH*1.2);
    // Gate arch
    X.strokeStyle='rgba(100,95,80,0.1)';X.lineWidth=0.6;
    X.beginPath();X.arc(gateX,gateY-gateH*0.4,gateW*0.5,Math.PI,0);X.stroke();
    // Gate door
    X.fillStyle='rgba(70,50,30,0.06)';X.fillRect(gateX-gateW*0.4,gateY-gateH*0.4,gateW*0.8,gateH*0.4);
    X.strokeStyle='rgba(90,70,40,0.08)';X.lineWidth=0.4;X.strokeRect(gateX-gateW*0.4,gateY-gateH*0.4,gateW*0.8,gateH*0.4);
    // Door planks
    for(var dp=0;dp<3;dp++){
      var dpx=gateX-gateW*0.3+dp*gateW*0.25;
      X.strokeStyle='rgba(80,60,35,0.05)';X.lineWidth=0.3;
      X.beginPath();X.moveTo(dpx,gateY-gateH*0.4);X.lineTo(dpx,gateY);X.stroke();
    }
    // Portcullis hint
    X.strokeStyle='rgba(100,100,110,0.06)';X.lineWidth=0.4;
    for(var pc=0;pc<4;pc++){
      var pcx=gateX-gateW*0.35+pc*gateW*0.23;
      X.beginPath();X.moveTo(pcx,gateY-gateH*0.5);X.lineTo(pcx,gateY);X.stroke();
    }
    // Drawbridge
    X.strokeStyle='rgba(120,90,50,0.08)';X.lineWidth=0.6;
    X.beginPath();X.moveTo(gateX-gateW*0.4,gateY);X.lineTo(gateX-gateW*0.4-30*s,gateY+15*s);X.stroke();
    X.beginPath();X.moveTo(gateX+gateW*0.4,gateY);X.lineTo(gateX+gateW*0.4+30*s,gateY+15*s);X.stroke();
    // Bridge planks
    for(var bp=0;bp<5;bp++){
      var bpx=gateX-gateW*0.4-6*s*bp;
      var bpy=gateY+3*s*bp;
      X.strokeStyle='rgba(120,90,50,0.05)';X.lineWidth=0.3;
      X.beginPath();X.moveTo(bpx,bpy);X.lineTo(bpx+gateW*0.8+12*s*bp,bpy);X.stroke();
    }
    // Chains
    X.strokeStyle='rgba(100,100,110,0.06)';X.lineWidth=0.3;
    X.beginPath();X.moveTo(gateX-gateW*0.5,gateY-gateH*0.8);X.lineTo(gateX-gateW*0.4-30*s,gateY+15*s);X.stroke();
    X.beginPath();X.moveTo(gateX+gateW*0.5,gateY-gateH*0.8);X.lineTo(gateX+gateW*0.4+30*s,gateY+15*s);X.stroke();
    lbl('подъёмный мост · решётка · барбакан',cx,gateY-gateH*1.2-15*s,'rgba(180,170,150,0.5)',6);
  }

  // === STAGE 5: Inner courtyard ===
  if(stage>=5){
    var cW2=W*0.25,cH2=20*s;
    var cX=cx,cY=gy-15*s-wH*0.5;
    // Courtyard ground
    X.fillStyle='rgba(80,75,60,0.04)';X.fillRect(cX-cW2/2,cY-cH2/2,cW2,cH2);
    // Well
    X.strokeStyle='rgba(100,100,110,0.08)';X.lineWidth=0.5;
    X.beginPath();X.arc(cX-20*s,cY,5*s,0,Math.PI*2);X.stroke();
    X.fillStyle='rgba(30,40,50,0.04)';X.beginPath();X.arc(cX-20*s,cY,4*s,0,Math.PI*2);X.fill();
    // Well roof
    X.strokeStyle='rgba(100,80,50,0.06)';X.lineWidth=0.4;
    X.beginPath();X.moveTo(cX-25*s,cY-8*s);X.lineTo(cX-20*s,cY-12*s);X.lineTo(cX-15*s,cY-8*s);X.stroke();
    // Anvil
    X.fillStyle='rgba(80,80,85,0.06)';X.beginPath();X.moveTo(cX+15*s,cY-3*s);X.lineTo(cX+25*s,cY-3*s);X.lineTo(cX+22*s,cY+2*s);X.lineTo(cX+18*s,cY+2*s);X.closePath();X.fill();
    // Forge glow
    X.fillStyle='rgba(255,150,50,'+(0.02+Math.sin(t*4)*0.01)+')';X.beginPath();X.arc(cX+20*s,cY-5*s,3*s,0,Math.PI*2);X.fill();
    // Barracks outline
    X.strokeStyle='rgba(100,90,70,0.06)';X.lineWidth=0.4;
    X.strokeRect(cX+30*s,cY-10*s,25*s,15*s);
    lbl('колодец · кузница · казармы',cx,cY-cH2/2-10*s,'rgba(180,170,150,0.5)',6);
  }

  // === STAGE 6: Underground ===
  if(stage>=6){
    var ugY=gy+15*s;
    // Underground passage
    X.strokeStyle='rgba(80,70,50,0.08)';X.lineWidth=0.5;
    X.beginPath();X.moveTo(cx-30*s,ugY);X.bezierCurveTo(cx-40*s,ugY+15*s,cx+40*s,ugY+15*s,cx+30*s,ugY);X.stroke();
    // Chamber
    X.fillStyle='rgba(60,55,45,0.04)';X.fillRect(cx-20*s,ugY+10*s,40*s,20*s);
    X.strokeStyle='rgba(90,85,70,0.08)';X.lineWidth=0.4;X.strokeRect(cx-20*s,ugY+10*s,40*s,20*s);
    // Bars (prison)
    for(var br=0;br<5;br++){
      var brx=cx-15*s+br*8*s;
      X.strokeStyle='rgba(100,100,110,0.06)';X.lineWidth=0.3;
      X.beginPath();X.moveTo(brx,ugY+12*s);X.lineTo(brx,ugY+28*s);X.stroke();
    }
    // Supplies
    X.fillStyle='rgba(160,140,100,0.04)';X.beginPath();X.ellipse(cx+15*s,ugY+22*s,4*s,3*s,0,0,Math.PI*2);X.fill();
    // Secret passage
    X.strokeStyle='rgba(70,65,50,0.05)';X.lineWidth=0.4;
    X.beginPath();X.moveTo(cx+20*s,ugY+20*s);X.bezierCurveTo(cx+50*s,ugY+25*s,cx+70*s,ugY+20*s,cx+90*s,ugY+5*s);X.stroke();
    lbl('тайные ходы · тюрьма · запасы',cx,ugY+35*s,'rgba(180,170,150,0.5)',6);
  }

  // === STAGE 7: Keep / Donjon ===
  if(stage>=7){
    var dW=30*s,dH=90*s;
    var dX=cx,dY=gy-15*s;
    // Donjon tower
    X.fillStyle='rgba(80,75,65,0.07)';X.fillRect(dX-dW/2,dY-dH,dW,dH);
    X.strokeStyle='rgba(100,95,85,0.12)';X.lineWidth=0.7;X.strokeRect(dX-dW/2,dY-dH,dW,dH);
    // Donjon top
    X.strokeStyle='rgba(100,95,85,0.1)';X.lineWidth=0.5;
    X.beginPath();X.moveTo(dX-dW/2-5*s,dY-dH);X.lineTo(dX,dY-dH-12*s);X.lineTo(dX+dW/2+5*s,dY-dH);X.stroke();
    // Windows
    for(var dw=0;dw<3;dw++){
      var dwy=dY-dH*0.3-dw*dH*0.25;
      // Window arch
      X.fillStyle='rgba(40,60,80,0.04)';X.fillRect(dX-4*s,dwy-6*s,8*s,12*s);
      X.strokeStyle='rgba(100,120,150,0.06)';X.lineWidth=0.3;
      X.beginPath();X.arc(dX,dwy-6*s,4*s,Math.PI,0);X.stroke();
      X.strokeRect(dX-4*s,dwy-6*s,8*s,12*s);
      // Warm light from window
      X.fillStyle='rgba(255,200,100,'+(0.01+Math.sin(t+dw)*0.005)+')';X.beginPath();X.arc(dX,dwy,6*s,0,Math.PI*2);X.fill();
    }
    // Stone courses
    for(var ds=0;ds<6;ds++){
      var dsy=dY-dH+ds*(dH/6);
      X.strokeStyle='rgba(100,95,80,0.05)';X.lineWidth=0.2;
      X.beginPath();X.moveTo(dX-dW/2,dsy);X.lineTo(dX+dW/2,dsy);X.stroke();
    }
    lbl('донжон · столовая · личные покои',cx,dY-dH-20*s,'rgba(180,170,150,0.5)',6);
  }

  // === STAGE 8: Water system ===
  if(stage>=8){
    // Cistern
    var ciX=cx+50*s,ciY=gy+10*s;
    X.fillStyle='rgba(40,60,80,0.04)';X.fillRect(ciX-15*s,ciY,30*s,15*s);
    X.strokeStyle='rgba(60,80,100,0.08)';X.lineWidth=0.4;X.strokeRect(ciX-15*s,ciY,30*s,15*s);
    // Water level
    X.fillStyle='rgba(40,80,120,0.04)';X.fillRect(ciX-14*s,ciY+5*s,28*s,9*s);
    // Pipes
    X.strokeStyle='rgba(100,100,110,0.06)';X.lineWidth=0.5;
    X.beginPath();X.moveTo(ciX-15*s,ciY+5*s);X.lineTo(ciX-30*s,ciY+5*s);X.lineTo(ciX-30*s,ciY-20*s);X.stroke();
    // Moat (water around castle)
    X.strokeStyle='rgba(40,80,140,0.05)';X.lineWidth=1;
    X.beginPath();
    for(var mw=0;mw<W;mw+=4){
      var mwy=gy+10*s+Math.sin(mw*0.02+t)*2;
      if(mw===0)X.moveTo(mw,mwy);else X.lineTo(mw,mwy);
    }
    X.stroke();
    lbl('колодец · цистерна · рвы',ciX,ciY+25*s,'rgba(100,160,200,0.5)',6);
  }

  // === STAGE 9: Defense ===
  if(stage>=9){
    // Ballista on wall
    var blX=cx-wW/2+20*s;
    var blY=gy-15*s-wH-10*s;
    // Ballista base
    X.strokeStyle='rgba(100,80,50,0.08)';X.lineWidth=0.6;
    X.beginPath();X.moveTo(blX-8*s,blY);X.lineTo(blX+8*s,blY);X.stroke();
    X.beginPath();X.moveTo(blX,blY);X.lineTo(blX,blY-8*s);X.stroke();
    // Arms
    X.beginPath();X.moveTo(blX-10*s,blY-6*s);X.lineTo(blX,blY-8*s);X.lineTo(blX+10*s,blY-6*s);X.stroke();
    // Projectile
    X.fillStyle='rgba(100,80,50,0.06)';X.beginPath();X.ellipse(blX,blY-10*s,3*s,1,0,0,Math.PI*2);X.fill();
    // Second ballista
    var bl2X=cx+wW/2-20*s;
    X.strokeStyle='rgba(100,80,50,0.08)';X.lineWidth=0.6;
    X.beginPath();X.moveTo(bl2X-8*s,blY);X.lineTo(bl2X+8*s,blY);X.stroke();
    X.beginPath();X.moveTo(bl2X,blY);X.lineTo(bl2X,blY-8*s);X.stroke();
    X.beginPath();X.moveTo(bl2X-10*s,blY-6*s);X.lineTo(bl2X,blY-8*s);X.lineTo(bl2X+10*s,blY-6*s);X.stroke();
    // Abatis (sharpened logs)
    for(var ab=0;ab<6;ab++){
      var abx=cx-60*s+ab*25*s;
      var aby=gy+15*s;
      X.strokeStyle='rgba(120,100,60,0.06)';X.lineWidth=0.4;
      X.beginPath();X.moveTo(abx,aby);X.lineTo(abx+3*s,aby-12*s);X.stroke();
      X.beginPath();X.moveTo(abx+5*s,aby);X.lineTo(abx+2*s,aby-10*s);X.stroke();
    }
    lbl('баллисты · камнемёты · засеки',cx,blY-20*s,'rgba(200,180,140,0.5)',6);
  }

  // === STAGE 10: Surroundings ===
  if(stage>=10){
    // Palisade
    for(var ps2=0;ps2<12;ps2++){
      var px=cx-80*s+ps2*15*s;
      var py=gy+18*s;
      X.strokeStyle='rgba(120,100,60,0.06)';X.lineWidth=0.4;
      X.beginPath();X.moveTo(px,py);X.lineTo(px,py-15*s-Math.random()*5*s);X.stroke();
      // Point
      X.beginPath();X.moveTo(px-1*s,py-15*s);X.lineTo(px,py-18*s-Math.random()*3*s);X.lineTo(px+1*s,py-15*s);X.stroke();
    }
    // Barbed wire hint
    X.strokeStyle='rgba(100,100,110,0.04)';X.lineWidth=0.3;
    for(var bw=0;bw<3;bw++){
      var bwy=gy+20*s+bw*4*s;
      X.beginPath();
      for(var bwx=cx-80*s;bwx<cx+80*s;bwx+=4){
        var by2=bwy+Math.sin(bwx*0.3)*2;
        if(bwx===cx-80*s)X.moveTo(bwx,by2);else X.lineTo(bwx,by2);
      }
      X.stroke();
    }
    lbl('ров · палисад · колючая проволока',cx,gy+35*s,'rgba(180,170,150,0.5)',6);
  }

  // === STAGE 11: Decorations ===
  if(stage>=11){
    // Flag on highest tower
    var flagX=cx,flagY=gy-15*s-wH-25*s;
    X.strokeStyle='rgba(100,80,50,0.08)';X.lineWidth=0.4;
    X.beginPath();X.moveTo(flagX,flagY);X.lineTo(flagX,flagY-15*s);X.stroke();
    // Flag waving
    X.fillStyle='rgba(200,50,50,0.06)';X.beginPath();
    X.moveTo(flagX,flagY-15*s);
    X.quadraticCurveTo(flagX+8*s+Math.sin(t*3)*2,flagY-13*s,flagX+15*s+Math.sin(t*3+1)*2,flagY-10*s);
    X.lineTo(flagX+15*s+Math.sin(t*3+1)*2,flagY-5*s);
    X.quadraticCurveTo(flagX+8*s+Math.sin(t*3+2)*2,flagY-7*s,flagX,flagY-8*s);
    X.closePath();X.fill();
    // Coat of arms
    X.strokeStyle='rgba(255,200,100,0.06)';X.lineWidth=0.4;
    X.beginPath();X.arc(flagX+7*s+Math.sin(t*3)*1,flagY-10*s,3*s,0,Math.PI*2);X.stroke();
    // Windows lit up
    for(var wl=0;wl<6;wl++){
      var wlx=cx-wW/3+wl*(wW/3);
      var wly=gy-15*s-wH*0.4;
      X.fillStyle='rgba(255,200,100,'+(0.015+Math.sin(t+wl)*0.008)+')';X.beginPath();X.arc(wlx,wly,3*s,0,Math.PI*2);X.fill();
    }
    // Stained glass on main tower
    var sgcX=cx,sgcY=gy-15*s-wH*0.7;
    X.strokeStyle='rgba(100,150,200,0.06)';X.lineWidth=0.3;
    X.beginPath();X.arc(sgcX,sgcY,5*s,0,Math.PI*2);X.stroke();
    // Colored segments
    for(var sg=0;sg<4;sg++){
      var sga=sg*Math.PI/2+t*0.2;
      X.fillStyle='rgba('+(150+sg*30)+','+(100+sg*40)+',200,0.03)';
      X.beginPath();X.moveTo(sgcX,sgcY);X.arc(sgcX,sgcY,5*s,sga,sga+Math.PI/2);X.closePath();X.fill();
    }
    lbl('герб · флаг · витражи · свет в окнах',flagX,flagY-20*s,'rgba(200,180,140,0.5)',6);
  }

  // === STAGE 12: Living fortress ===
  if(stage>=12){
    // Guards on walls
    for(var gw=0;gw<3;gw++){
      var gwx=cx-wW/3+gw*(wW/3);
      var gwy=gy-15*s-wH-10*s;
      // Guard figure
      X.fillStyle='rgba(150,140,120,0.06)';X.beginPath();X.arc(gwx,gwy-8*s,2*s,0,Math.PI*2);X.fill();
      X.strokeStyle='rgba(120,110,100,0.08)';X.lineWidth=0.5;
      X.beginPath();X.moveTo(gwx,gwy-6*s);X.lineTo(gwx,gwy+2*s);X.stroke();
      X.beginPath();X.moveTo(gwx-4*s,gwy-3*s);X.lineTo(gwx+4*s,gwy-3*s);X.stroke();
      // Spear
      X.strokeStyle='rgba(100,90,70,0.06)';X.lineWidth=0.3;
      X.beginPath();X.moveTo(gwx+3*s,gwy-3*s);X.lineTo(gwx+3*s,gwy-15*s);X.stroke();
    }
    // Signal fires on towers
    for(var sf=0;sf<2;sf++){
      var sfx=cx-wW/2+sf*wW;
      var sfy=gy-15*s-wH-5*s;
      // Fire
      X.fillStyle='rgba(255,150,50,'+(0.03+Math.sin(t*5+sf*3)*0.015)+')';
      X.beginPath();X.moveTo(sfx-3*s,sfy);X.quadraticCurveTo(sfx-2*s,sfy-6*s-Math.sin(t*6+sf)*2,sfx,sfy-8*s-Math.sin(t*5+sf)*3);
      X.quadraticCurveTo(sfx+2*s,sfy-6*s-Math.sin(t*6+sf+1)*2,sfx+3*s,sfy);X.fill();
      // Smoke
      X.globalAlpha=0.015;
      for(var sm=0;sm<4;sm++){
        var smx=sfx+Math.sin(t+sm+sf)*5*s;
        var smy=sfy-10*s-sm*8*s;
        X.fillStyle='rgba(150,150,160,0.5)';X.beginPath();X.arc(smx,smy,3*s+sm,0,Math.PI*2);X.fill();
      }
      X.globalAlpha=1;
    }
    lbl('стража на стенах · костры · сигналы',cx,gy-15*s-wH-35*s,'rgba(255,200,140,0.6)',7);
  }

  document.getElementById('part-label').textContent=pts[stage]||'';
  X.fillStyle='rgba(255,200,0,0.04)';X.fillRect(W*0.1,H-8,W*0.8,3);
  X.fillStyle='rgba(255,200,0,0.12)';X.fillRect(W*0.1,H-8,W*0.8*(stage/maxStage),3);
  for(var sd=0;sd<=maxStage;sd++){X.fillStyle=sd<=stage?'rgba(255,200,0,0.25)':'rgba(255,200,0,0.06)';X.beginPath();X.arc(W*0.1+W*0.8*(sd/maxStage),H-6.5,2,0,Math.PI*2);X.fill()}
  requestAnimationFrame(draw);
}
draw();
</script></body></html>
