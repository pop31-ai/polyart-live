<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>23 — Величие Человека — PolyArt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0812;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#aaa;font-size:9px;text-transform:uppercase;letter-spacing:1.5px}
.ctrl input[type=range]{width:90px;accent-color:#fc0;cursor:pointer}
.ctrl .val{color:#ddd;font-size:11px;font-weight:bold}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:16px;letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 20px #fc05;z-index:10}
#info{position:absolute;top:42px;left:50%;transform:translateX(-50%);color:#666;font-size:9px;letter-spacing:2px;z-index:10}
button.tog{background:none;border:1px solid #fc0;color:#fc0;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Величие Человека</div>
<div id="info">Ум · Способность · Трудолюбие — Базар как памятник достижениям цивилизации</div>
<div id="ui">
<div class="ctrl"><label>Обводка</label><input type="range" id="lw" min="0" max="3" value="1" step="0.5"><span class="val" id="lwV">1</span></div>
<div class="ctrl"><label>Энергия</label><input type="range" id="nrg" min="0.3" max="2" value="1" step="0.1"><span class="val" id="nrgV">1</span></div>
<div class="ctrl"><label>Аспект</label><button class="tog" id="togA">ВСЁ</button></div>
</div>
<script>
var C=document.getElementById('c'),X=C.getContext('2d'),W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);
document.getElementById('lw').oninput=function(){document.getElementById('lwV').textContent=this.value;};
document.getElementById('nrg').oninput=function(){document.getElementById('nrgV').textContent=this.value;};

var aspect=0;var aspects=['ВСЁ','УМ','СПОСОБНОСТЬ','ТРУД'];
document.getElementById('togA').onclick=function(){aspect=(aspect+1)%aspects.length;this.textContent=aspects[aspect];};

var PHI=1.618033988749895;
var t=0;

function F(pts,c){X.fillStyle=c;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.fill();}
function S(pts,c,w){if(w<=0)return;X.strokeStyle=c;X.lineWidth=w;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.stroke();}

// Brain — intellect symbol
function drawBrain(cx,cy,size,t2){
  var pulse=Math.sin(t2*0.6)*0.05+1;
  size*=pulse;
  
  // Left hemisphere
  X.fillStyle='rgba(200,180,220,0.08)';
  X.beginPath();
  X.moveTo(cx,cy-size*0.4);
  X.bezierCurveTo(cx-size*0.3,cy-size*0.5,cx-size*0.5,cy-size*0.2,cx-size*0.4,cy+size*0.1);
  X.bezierCurveTo(cx-size*0.3,cy+size*0.3,cx-size*0.1,cy+size*0.4,cx,cy+size*0.3);
  X.closePath();
  X.fill();
  S([cx,cy-size*0.4,[cx-size*0.3,cy-size*0.5,cx-size*0.5,cy-size*0.2,cx-size*0.4,cy+size*0.1],[cx-size*0.3,cy+size*0.3,cx-size*0.1,cy+size*0.4,cx,cy+size*0.3]],'rgba(200,180,220,0.3)',0.8);
  
  // Right hemisphere
  X.fillStyle='rgba(200,180,220,0.08)';
  X.beginPath();
  X.moveTo(cx,cy-size*0.4);
  X.bezierCurveTo(cx+size*0.3,cy-size*0.5,cx+size*0.5,cy-size*0.2,cx+size*0.4,cy+size*0.1);
  X.bezierCurveTo(cx+size*0.3,cy+size*0.3,cx+size*0.1,cy+size*0.4,cx,cy+size*0.3);
  X.closePath();
  X.fill();
  S([cx,cy-size*0.4,[cx+size*0.3,cy-size*0.5,cx+size*0.5,cy-size*0.2,cx+size*0.4,cy+size*0.1],[cx+size*0.3,cy+size*0.3,cx+size*0.1,cy+size*0.4,cx,cy+size*0.3]],'rgba(200,180,220,0.3)',0.8);
  
  // Neural connections
  for(var nc=0;nc<8;nc++){
    var nca=nc*Math.PI*2/8+Math.sin(t2*0.3)*0.2;
    var ncr=size*0.25+Math.sin(t2*0.5+nc)*size*0.05;
    var ncx=cx+Math.cos(nca)*ncr;
    var ncy=cy+Math.sin(nca)*ncr*0.7;
    X.fillStyle='rgba(220,200,255,'+(0.1+0.05*Math.sin(t2*2+nc))+')';
    X.beginPath();X.arc(ncx,ncy,1.5,0,Math.PI*2);X.fill();
    S([[cx,cy],[ncx,ncy]],'rgba(200,180,220,0.08)',0.3);
  }
  
  // Central fissure
  S([[cx,cy-size*0.35],[cx,cy+size*0.25]],'rgba(180,160,200,0.15)',0.5);
}

// Hands — capability symbol
function drawHands(cx,cy,size,t2){
  var action=Math.sin(t2*0.7)*0.3+0.7;
  
  // Left hand
  var lhx=cx-size*0.3;
  var lhy=cy;
  // Palm
  F([lhx,lhy-size*0.15,lhx+size*0.2,lhy-size*0.15,lhx+size*0.2,lhy+size*0.15,lhx,lhy+size*0.15],'rgba(200,180,160,0.1)');
  S([lhx,lhy-size*0.15,lhx+size*0.2,lhy-size*0.15,lhx+size*0.2,lhy+size*0.15,lhx,lhy+size*0.15],'rgba(200,180,160,0.3)',0.6);
  // Fingers
  for(var fi=0;fi<4;fi++){
    var ffx=lhx+size*0.04+fi*size*0.04;
    var ffy=lhy-size*0.15;
    S([[ffx,ffy],[ffx,ffy-size*0.12*Math.sin(action+fi*0.3)]],'rgba(200,180,160,0.25)',0.4);
  }
  // Thumb
  S([[lhx,lhy],[lhx-size*0.08,lhy-size*0.08*Math.sin(action)]],'rgba(200,180,160,0.25)',0.4);
  
  // Right hand
  var rhx=cx+size*0.3;
  var rhy=cy;
  F([rhx,rhy-size*0.15,rhx+size*0.2,rhy-size*0.15,rhx+size*0.2,rhy+size*0.15,rhx,rhy+size*0.15],'rgba(200,180,160,0.1)');
  S([rhx,rhy-size*0.15,rhx+size*0.2,rhy-size*0.15,rhx+size*0.2,rhy+size*0.15,rhx,rhy+size*0.15],'rgba(200,180,160,0.3)',0.6);
  for(var fi2=0;fi2<4;fi2++){
    var ffx2=rhx+size*0.04+fi2*size*0.04;
    var ffy2=rhy-size*0.15;
    S([[ffx2,ffy2],[ffx2,ffy2-size*0.12*Math.sin(action+fi2*0.3+1)]],'rgba(200,180,160,0.25)',0.4);
  }
  S([[rhx+size*0.2,rhy],[rhx+size*0.28,rhy-size*0.08*Math.sin(action+1)]],'rgba(200,180,160,0.25)',0.4);
  
  // Tool being held — abstract work implement
  var toolX=(lhx+rhx+size*0.2)/2;
  var toolY=lhy-size*0.2;
  S([[toolX-size*0.15,toolY],[toolX+size*0.15,toolY]],'rgba(180,160,120,0.3)',0.8);
  S([[toolX,toolY-size*0.05],[toolX,toolY+size*0.1]],'rgba(180,160,120,0.25)',0.6);
}

// Gear — industry symbol
function drawGear(cx,cy,size,t2){
  var rotation=t2*0.5;
  var teeth=8;
  
  X.save();
  X.translate(cx,cy);
  X.rotate(rotation);
  
  // Gear body
  X.fillStyle='rgba(180,170,160,0.08)';
  X.beginPath();X.arc(0,0,size*0.35,0,Math.PI*2);X.fill();
  X.strokeStyle='rgba(180,170,160,0.3)';X.lineWidth=0.8;
  X.beginPath();X.arc(0,0,size*0.35,0,Math.PI*2);X.stroke();
  
  // Teeth
  for(var gt=0;gt<teeth;gt++){
    var ga=gt*Math.PI*2/teeth;
    var gx1=Math.cos(ga)*size*0.35;
    var gy1=Math.sin(ga)*size*0.35;
    var gx2=Math.cos(ga)*size*0.45;
    var gy2=Math.sin(ga)*size*0.45;
    var gx3=Math.cos(ga+0.15)*size*0.45;
    var gy3=Math.sin(ga+0.15)*size*0.45;
    var gx4=Math.cos(ga+0.15)*size*0.35;
    var gy4=Math.sin(ga+0.15)*size*0.35;
    F([gx1,gy1,gx2,gy2,gx3,gy3,gx4,gy4],'rgba(180,170,160,0.1)');
    S([gx1,gy1,gx2,gy2,gx3,gy3,gx4,gy4],'rgba(180,170,160,0.25)',0.5);
  }
  
  // Center hole
  X.fillStyle='rgba(10,8,18,0.3)';X.beginPath();X.arc(0,0,size*0.1,0,Math.PI*2);X.fill();
  X.strokeStyle='rgba(180,170,160,0.2)';X.lineWidth=0.5;
  X.beginPath();X.arc(0,0,size*0.1,0,Math.PI*2);X.stroke();
  
  X.restore();
}

// Rising figure — human achievement
function drawRisingFigure(cx,cy,size,t2,index){
  var reach=Math.sin(t2*0.5+index*0.8)*0.3+0.7;
  var height=size*0.8;
  
  // Body
  S([cx,cy,cx,cy-height*0.6],'rgba(200,180,160,0.4)',0.8);
  
  // Arms reaching upward
  var armAngle=Math.PI*0.5-reach*0.5;
  S([cx,cy-height*0.4,cx-Math.cos(armAngle)*size*0.3,cy-height*0.4-Math.sin(armAngle)*size*0.3],'rgba(200,180,160,0.35)',0.6);
  S([cx,cy-height*0.4,cx+Math.cos(armAngle)*size*0.3,cy-height*0.4-Math.sin(armAngle)*size*0.3],'rgba(200,180,160,0.35)',0.6);
  
  // Head
  X.fillStyle='rgba(200,180,160,0.15)';X.beginPath();X.arc(cx,cy-height*0.7,size*0.12,0,Math.PI*2);X.fill();
  X.strokeStyle='rgba(200,180,160,0.3)';X.lineWidth=0.6;
  X.beginPath();X.arc(cx,cy-height*0.7,size*0.12,0,Math.PI*2);X.stroke();
  
  // Achievement glow
  X.fillStyle='rgba(255,220,150,'+(0.03+0.02*reach)+')';X.beginPath();X.arc(cx,cy-height*0.5,size*0.25,0,Math.PI*2);X.fill();
  
  // Work tools nearby
  if(index%3===0){
    // Hammer
    S([[cx+size*0.2,cy-height*0.3],[cx+size*0.2,cy-height*0.5]],'rgba(180,160,120,0.2)',0.4);
    S([[cx+size*0.15,cy-height*0.5],[cx+size*0.25,cy-height*0.5]],'rgba(180,160,120,0.25)',0.5);
  }
}

// Product/creation — output of labor
function drawCreation(cx,cy,size,t2,type){
  var pulse=Math.sin(t2*0.4+type)*0.1+1;
  size*=pulse;
  
  if(type===0){
    // Pottery/vessel
    X.fillStyle='rgba(180,140,100,0.1)';
    X.beginPath();
    X.moveTo(cx-size*0.2,cy+size*0.15);
    X.bezierCurveTo(cx-size*0.25,cy-size*0.1,cx+size*0.25,cy-size*0.1,cx+size*0.2,cy+size*0.15);
    X.closePath();
    X.fill();
    S([cx-size*0.2,cy+size*0.15,[cx-size*0.25,cy-size*0.1,cx+size*0.25,cy-size*0.1,cx+size*0.2,cy+size*0.15]],'rgba(180,140,100,0.3)',0.6);
    // Rim
    S([[cx-size*0.22,cy-size*0.08],[cx+size*0.22,cy-size*0.08]],'rgba(180,140,100,0.2)',0.4);
  }else if(type===1){
    // Textile/fabric
    for(var tf=0;tf<4;tf++){
      var tfy=cy-size*0.15+tf*size*0.08;
      S([[cx-size*0.25,tfy],[cx+size*0.25,tfy+Math.sin(t2+tf)*size*0.02]],'rgba(160,140,180,0.15)',0.3);
    }
    X.strokeStyle='rgba(160,140,180,0.25)';X.lineWidth=0.5;
    X.beginPath();X.rect(cx-size*0.25,cy-size*0.15,size*0.5,size*0.3);X.stroke();
  }else{
    // Tool/ implement
    S([[cx,cy-size*0.2],[cx,cy+size*0.2]],'rgba(180,170,140,0.25)',0.6);
    S([[cx-size*0.1,cy-size*0.2],[cx+size*0.1,cy-size*0.2]],'rgba(180,170,140,0.3)',0.5);
    X.fillStyle='rgba(180,170,140,0.08)';X.beginPath();X.arc(cx,cy+size*0.2,size*0.06,0,Math.PI*2);X.fill();
  }
}

// Knowledge wheel — intellectual foundation
function drawKnowledgeWheel(cx,cy,size,t2){
  var rotation=t2*0.3;
  
  X.save();
  X.translate(cx,cy);
  X.rotate(rotation);
  
  // Outer ring
  X.strokeStyle='rgba(200,200,220,0.15)';X.lineWidth=0.8;
  X.beginPath();X.arc(0,0,size*0.4,0,Math.PI*2);X.stroke();
  
  // Inner divisions
  for(var kw=0;kw<6;kw++){
    var kwa=kw*Math.PI*2/6;
    S([[0,0],[Math.cos(kwa)*size*0.4,Math.sin(kwa)*size*0.4]],'rgba(200,200,220,0.08)',0.4);
  }
  
  // Center
  X.fillStyle='rgba(220,220,240,0.1)';X.beginPath();X.arc(0,0,size*0.1,0,Math.PI*2);X.fill();
  
  X.restore();
}

function draw(){
  var lw=parseFloat(document.getElementById('lw').value);
  var nrg=parseFloat(document.getElementById('nrg').value);
  t+=0.016;
  
  // Background — deep with warm undertone of human endeavor
  X.fillStyle='#0a0812';X.fillRect(0,0,W,H);
  
  // Central glow — warmth of achievement
  var sg=X.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.5);
  sg.addColorStop(0,'rgba(255,200,150,0.06)');
  sg.addColorStop(1,'rgba(255,180,120,0)');
  X.fillStyle=sg;X.fillRect(0,0,W,H);
  
  var cx=W/2;
  var cy=H/2;
  var s=Math.min(W,H)/500;
  
  // Knowledge wheel — intellectual foundation
  drawKnowledgeWheel(cx,cy,180*s,t);
  
  // Brain — at the top, overseeing all
  if(aspect===0||aspect===1){
    drawBrain(cx,cy-100*s,80*s,t);
  }
  
  // Hands — capability
  if(aspect===0||aspect===2){
    drawHands(cx,cy+20*s,100*s,t);
  }
  
  // Gears — industry
  if(aspect===0||aspect===3){
    drawGear(cx-120*s,cy-30*s,50*s,t);
    drawGear(cx+120*s,cy-30*s,50*s,t+1);
    drawGear(cx,cy+80*s,40*s,t+2);
  }
  
  // Rising figures — human achievement
  var figures=8;
  for(var rf=0;rf<figures;rf++){
    var rfa=rf*Math.PI*2/figures;
    var rfr=160*s+Math.sin(t*0.2+rf)*20*s;
    var rfx=cx+Math.cos(rfa)*rfr;
    var rfy=cy+Math.sin(rfa)*rfr*0.6;
    drawRisingFigure(rfx,rfy,30*s,t+rf,rf);
  }
  
  // Creations — products of labor
  for(var cr=0;cr<6;cr++){
    var cra=cr*Math.PI*2/6+Math.PI/6;
    var crr=130*s+Math.sin(t*0.3+cr)*15*s;
    var crx=cx+Math.cos(cra)*crr;
    var cry=cy+Math.sin(cra)*crr*0.6;
    drawCreation(crx,cry,25*s,t+cr,cr%3);
  }
  
  // Resource particles — fruits of labor
  for(var rf2=0;rf2<25;rf2++){
    var rfa2=rf2*Math.PI*2/25+Math.sin(t*0.1)*0.5;
    var rfr2=200*s+Math.sin(t*0.2+rf2*0.7)*30*s;
    var rfx2=cx+Math.cos(rfa2)*rfr2;
    var rfy2=cy+Math.sin(rfa2)*rfr2*0.6;
    var rfs=1+Math.sin(t*1.5+rf2)*0.5;
    X.fillStyle='rgba(255,220,180,'+(0.08+0.04*Math.sin(t+rf2))+')';
    X.beginPath();X.arc(rfx2,rfy2,rfs*s,0,Math.PI*2);X.fill();
  }
  
  // Energy lines connecting elements
  X.globalAlpha=0.03*nrg;
  for(var el=0;el<12;el++){
    var ela=el*Math.PI*2/12;
    var elr1=60*s;
    var elr2=180*s+Math.sin(t*0.3+el)*20*s;
    var elx1=cx+Math.cos(ela)*elr1;
    var ely1=cy+Math.sin(ela)*elr1*0.6;
    var elx2=cx+Math.cos(ela)*elr2;
    var ely2=cy+Math.sin(ela)*elr2*0.6;
    S([[elx1,ely1],[elx2,ely2]],'rgba(255,200,150,0.3)',0.3);
  }
  X.globalAlpha=1;
  
  // Labels
  X.globalAlpha=0.06;X.font=(9*s)+'px serif';X.fillStyle='rgba(255,220,180,0.6)';X.textAlign='center';
  X.fillText(aspects[aspect]+' — Величие через Труд',cx,H-18*s);
  X.fillText('"Базар — памятник достижениям человека"',cx,H-8*s);
  X.textAlign='left';X.globalAlpha=1;
  
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
