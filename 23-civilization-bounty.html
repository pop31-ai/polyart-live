<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>23 — Цивилизация Щедрости — PolyArt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0812;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#aaa;font-size:9px;text-transform:uppercase;letter-spacing:1.5px}
.ctrl input[type=range]{width:90px;accent-color:#fc0;cursor:pointer}
.ctrl .val{color:#ddd;font-size:11px;font-weight:bold}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:16px;letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 20px #fc05;z-index:10}
#info{position:absolute;top:42px;left:50%;transform:translateX(-50%);color:#666;font-size:9px;letter-spacing:2px;z-index:10}
button.tog{background:none;border:1px solid #fc0;color:#fc0;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Цивилизация Щедрости</div>
<div id="info">Экономический объект — Базар как шведский стол цивилизации — Витаминчики могущества</div>
<div id="ui">
<div class="ctrl"><label>Обводка</label><input type="range" id="lw" min="0" max="3" value="1" step="0.5"><span class="val" id="lwV">1</span></div>
<div class="ctrl"><label>Щедрость</label><input type="range" id="gen" min="0.2" max="2" value="1" step="0.1"><span class="val" id="genV">1</span></div>
<div class="ctrl"><label>Режим</label><button class="tog" id="togM">ЩЕДРОСТЬ</button></div>
</div>
<script>
var C=document.getElementById('c'),X=C.getContext('2d'),W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);
document.getElementById('lw').oninput=function(){document.getElementById('lwV').textContent=this.value;};
document.getElementById('gen').oninput=function(){document.getElementById('genV').textContent=this.value;};

var mode=0;var modes=['ЩЕДРОСТЬ','ВИТАМИНЫ','МЕДИЦИНА','ЗНАНИЯ'];
document.getElementById('togM').onclick=function(){mode=(mode+1)%modes.length;this.textContent=modes[mode];};

var PHI=1.618033988749895;
var t=0;

function F(pts,c){X.fillStyle=c;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.fill();}
function S(pts,c,w){if(w<=0)return;X.strokeStyle=c;X.lineWidth=w;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.stroke();}

// Generosity flow — polynomial curves representing free distribution
function drawGenerosityFlow(cx,cy,radius,generosity,t2){
  var flows=8;
  for(var f=0;f<flows;f++){
    var angle=f*Math.PI*2/flows;
    var pulse=Math.sin(t2*0.8+f*0.5)*0.3+0.7;
    var len=radius*generosity*pulse;
    
    // Main flow line
    var pts=[[cx,cy]];
    var segments=5;
    for(var s=1;s<=segments;s++){
      var frac=s/segments;
      var x=cx+Math.cos(angle)*len*frac+Math.sin(t2*0.5+f)*frac*20;
      var y=cy+Math.sin(angle)*len*frac+Math.cos(t2*0.5+f)*frac*20;
      pts.push([x,y]);
    }
    S(pts,'rgba(255,200,100,'+(0.1+0.05*pulse)+')',0.8);
    
    // Resource particles along flow
    for(var p=0;p<5;p++){
      var pp=(p/5+t2*0.2)%1;
      var px=cx+Math.cos(angle)*len*pp;
      var py=cy+Math.sin(angle)*len*pp;
      X.fillStyle='rgba(255,220,120,'+(0.15-pp*0.1)+')';
      X.beginPath();X.arc(px,py,2+Math.sin(t2+p)*0.5,0,Math.PI*2);X.fill();
    }
  }
}

// Vitamin molecule — abstract representation
function drawVitaminMolecule(cx,cy,size,t2){
  // Central structure
  var atoms=6;
  var atomSize=size*0.15;
  
  for(var a=0;a<atoms;a++){
    var angle=a*Math.PI*2/atoms+Math.sin(t2*0.3)*0.2;
    var dist=size*0.4;
    var ax=cx+Math.cos(angle)*dist;
    var ay=cy+Math.sin(angle)*dist;
    
    // Atom
    X.fillStyle='rgba(100,200,100,'+(0.2+Math.sin(t2+a)*0.1)+')';
    X.beginPath();X.arc(ax,ay,atomSize,0,Math.PI*2);X.fill();
    X.strokeStyle='rgba(120,220,120,0.4)';X.lineWidth=0.5;
    X.beginPath();X.arc(ax,ay,atomSize,0,Math.PI*2);X.stroke();
    
    // Bond to center
    S([[ax,ay],[cx,cy]],'rgba(80,180,80,0.2)',0.4);
    
    // Bond to next atom
    var nextAngle=(a+1)*Math.PI*2/atoms+Math.sin(t2*0.3)*0.2;
    var nx=cx+Math.cos(nextAngle)*dist;
    var ny=cy+Math.sin(nextAngle)*dist;
    S([[ax,ay],[nx,ny]],'rgba(80,180,80,0.15)',0.3);
    
    // Side chains
    var sideLen=size*0.2;
    var sideAngle=angle+Math.PI*0.5;
    var sx=ax+Math.cos(sideAngle)*sideLen;
    var sy=ay+Math.sin(sideAngle)*sideLen;
    S([[ax,ay],[sx,sy]],'rgba(60,160,60,0.1)',0.3);
    X.fillStyle='rgba(80,190,80,0.12)';X.beginPath();X.arc(sx,sy,atomSize*0.6,0,Math.PI*2);X.fill();
  }
  
  // Central atom
  X.fillStyle='rgba(150,255,150,0.25)';X.beginPath();X.arc(cx,cy,atomSize*1.2,0,Math.PI*2);X.fill();
  X.strokeStyle='rgba(180,255,180,0.5)';X.lineWidth=0.7;
  X.beginPath();X.arc(cx,cy,atomSize*1.2,0,Math.PI*2);X.stroke();
}

// Medicine cross — healing symbol
function drawMedicineCross(cx,cy,size,t2){
  var pulse=Math.sin(t2*0.6)*0.1+1;
  size*=pulse;
  
  // Vertical bar
  F([cx-size*0.15,cy-size*0.4,cx+size*0.15,cy-size*0.4,cx+size*0.15,cy+size*0.4,cx-size*0.15,cy+size*0.4],'rgba(255,100,100,0.15)');
  S([cx-size*0.15,cy-size*0.4,cx+size*0.15,cy-size*0.4,cx+size*0.15,cy+size*0.4,cx-size*0.15,cy+size*0.4],'rgba(255,120,120,0.4)',0.7);
  
  // Horizontal bar
  F([cx-size*0.4,cy-size*0.15,cx+size*0.4,cy-size*0.15,cx+size*0.4,cy+size*0.15,cx-size*0.4,cy+size*0.15],'rgba(255,100,100,0.15)');
  S([cx-size*0.4,cy-size*0.15,cx+size*0.4,cy-size*0.15,cx+size*0.4,cy+size*0.15,cx-size*0.4,cy+size*0.15],'rgba(255,120,120,0.4)',0.7);
  
  // Glow
  X.fillStyle='rgba(255,150,150,0.05)';X.beginPath();X.arc(cx,cy,size*0.5,0,Math.PI*2);X.fill();
}

// Knowledge scroll — wisdom symbol
function drawKnowledgeScroll(cx,cy,size,t2){
  var unroll=Math.sin(t2*0.4)*0.2+0.8;
  
  // Scroll body
  F([cx-size*0.3,cy-size*0.4,cx+size*0.3,cy-size*0.4,cx+size*0.3,cy+size*0.4,cx-size*0.3,cy+size*0.4],'rgba(200,180,120,0.12)');
  S([cx-size*0.3,cy-size*0.4,cx+size*0.3,cy-size*0.4,cx+size*0.3,cy+size*0.4,cx-size*0.3,cy+size*0.4],'rgba(220,200,140,0.35)',0.6);
  
  // Scroll rolls
  X.fillStyle='rgba(180,160,100,0.15)';X.beginPath();X.arc(cx-size*0.3,cy-size*0.4,size*0.08,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(cx-size*0.3,cy+size*0.4,size*0.08,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(cx+size*0.3,cy-size*0.4,size*0.08,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(cx+size*0.3,cy+size*0.4,size*0.08,0,Math.PI*2);X.fill();
  
  // Text lines
  for(var tl=0;tl<5;tl++){
    var ly=cy-size*0.25+tl*size*0.12;
    var lw=size*0.4*(0.3+Math.sin(tl*1.5)*0.1)*unroll;
    S([[cx-lw*0.5,ly],[cx+lw*0.5,ly]],'rgba(160,140,80,0.15)',0.3);
  }
}

// Civilization hub — central distribution point
function drawCivilizationHub(cx,cy,radius,t2){
  // Outer ring
  X.strokeStyle='rgba(255,200,100,0.2)';X.lineWidth=1.5;
  X.beginPath();X.arc(cx,cy,radius,0,Math.PI*2);X.stroke();
  
  // Inner ring
  X.strokeStyle='rgba(255,220,150,0.15)';X.lineWidth=1;
  X.beginPath();X.arc(cx,cy,radius*0.6,0,Math.PI*2);X.stroke();
  
  // Core
  X.fillStyle='rgba(255,240,200,0.1)';X.beginPath();X.arc(cx,cy,radius*0.3,0,Math.PI*2);X.fill();
  X.strokeStyle='rgba(255,250,220,0.3)';X.lineWidth=0.8;
  X.beginPath();X.arc(cx,cy,radius*0.3,0,Math.PI*2);X.stroke();
  
  // Radiating lines
  for(var rl=0;rl<12;rl++){
    var rla=rl*Math.PI*2/12+Math.sin(t2*0.2)*0.1;
    var rlx=cx+Math.cos(rla)*radius*0.35;
    var rly=cy+Math.sin(rla)*radius*0.35;
    var rlx2=cx+Math.cos(rla)*radius*0.95;
    var rly2=cy+Math.sin(rla)*radius*0.95;
    S([[rlx,rly],[rlx2,rly2]],'rgba(255,230,180,0.1)',0.3);
  }
}

// People receiving — gratitude figures
function drawReceivingPerson(cx,cy,size,t2,index){
  var reach=Math.sin(t2*0.5+index*0.8)*0.3+0.7;
  
  // Body
  S([cx,cy,cx,cy-size*0.6],'rgba(200,180,160,0.4)',0.8);
  
  // Arms reaching up
  var armAngle=Math.PI*0.5-reach*0.5;
  S([cx,cy-size*0.4,cx-Math.cos(armAngle)*size*0.3,cy-size*0.4-Math.sin(armAngle)*size*0.3],'rgba(200,180,160,0.35)',0.6);
  S([cx,cy-size*0.4,cx+Math.cos(armAngle)*size*0.3,cy-size*0.4-Math.sin(armAngle)*size*0.3],'rgba(200,180,160,0.35)',0.6);
  
  // Head
  X.fillStyle='rgba(200,180,160,0.15)';X.beginPath();X.arc(cx,cy-size*0.7,size*0.12,0,Math.PI*2);X.fill();
  X.strokeStyle='rgba(200,180,160,0.3)';X.lineWidth=0.6;
  X.beginPath();X.arc(cx,cy-size*0.7,size*0.12,0,Math.PI*2);X.stroke();
  
  // Gratitude glow
  X.fillStyle='rgba(255,220,150,'+(0.03+0.02*reach)+')';X.beginPath();X.arc(cx,cy-size*0.5,size*0.25,0,Math.PI*2);X.fill();
}

function draw(){
  var lw=parseFloat(document.getElementById('lw').value);
  var gen=parseFloat(document.getElementById('gen').value);
  t+=0.016;
  
  // Background — deep cosmic generosity
  X.fillStyle='#0a0812';X.fillRect(0,0,W,H);
  
  // Central glow
  var sg=X.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.5);
  sg.addColorStop(0,'rgba(255,200,100,0.06)');
  sg.addColorStop(1,'rgba(255,180,80,0)');
  X.fillStyle=sg;X.fillRect(0,0,W,H);
  
  var cx=W/2;
  var cy=H/2;
  var s=Math.min(W,H)/500;
  
  // Civilization hub
  drawCivilizationHub(cx,cy,120*s,t);
  
  // Generosity flows
  drawGenerosityFlow(cx,cy,150*s,gen,t);
  
  // Mode-specific symbols
  if(mode===0){
    // Generosity — wheat/grain symbols
    for(var wh=0;wh<8;wh++){
      var wha=wh*Math.PI*2/8;
      var whr=100*s+Math.sin(t*0.5+wh)*10*s;
      var whx=cx+Math.cos(wha)*whr;
      var why=cy+Math.sin(wha)*whr;
      
      // Wheat stalk
      S([[whx,why],[whx+Math.cos(wha)*20*s,why+Math.sin(wha)*20*s]],'rgba(220,180,60,0.3)',0.6);
      
      // Wheat head
      for(var wg=0;wg<3;wg++){
        var wga=wha+Math.PI*0.5*(wg-1);
        var wgx=whx+Math.cos(wga)*5*s;
        var wgy=why+Math.sin(wga)*5*s;
        X.fillStyle='rgba(240,200,80,0.15)';X.beginPath();X.ellipse(wgx,wgy,3*s,1.5*s,wga,0,Math.PI*2);X.fill();
      }
    }
  }else if(mode===1){
    // Vitamins — multiple molecules
    for(var vm=0;vm<5;vm++){
      var vma=vm*Math.PI*2/5;
      var vmr=80*s+Math.sin(t*0.3+vm)*15*s;
      var vmx=cx+Math.cos(vma)*vmr;
      var vmy=cy+Math.sin(vma)*vmr;
      drawVitaminMolecule(vmx,vmy,40*s,t+vm);
    }
  }else if(mode===2){
    // Medicine — healing symbols
    for(var md=0;md<6;md++){
      var mda=md*Math.PI*2/6;
      var mdr=90*s+Math.sin(t*0.4+md)*12*s;
      var mdx=cx+Math.cos(mda)*mdr;
      var mdy=cy+Math.sin(mda)*mdr;
      drawMedicineCross(mdx,mdy,30*s,t+md);
    }
  }else{
    // Knowledge — scroll symbols
    for(var kn=0;kn<7;kn++){
      var kna=kn*Math.PI*2/7;
      var knr=85*s+Math.sin(t*0.35+kn)*10*s;
      var knx=cx+Math.cos(kna)*knr;
      var kny=cy+Math.sin(kna)*knr;
      drawKnowledgeScroll(knx,kny,35*s,t+kn);
    }
  }
  
  // Receiving people around the hub
  for(var rp=0;rp<12;rp++){
    var rpa=rp*Math.PI*2/12;
    var rpr=180*s+Math.sin(t*0.2+rp)*20*s;
    var rpx=cx+Math.cos(rpa)*rpr;
    var rpy=cy+Math.sin(rpa)*rpr;
    drawReceivingPerson(rpx,rpy,25*s,t+rp,rp);
  }
  
  // Resource particles floating
  for(var rf=0;rf<30;rf++){
    var rfa=rf*Math.PI*2/30+Math.sin(t*0.1)*0.5;
    var rfr=200*s+Math.sin(t*0.2+rf*0.7)*30*s;
    var rfx=cx+Math.cos(rfa)*rfr;
    var rfy=cy+Math.sin(rfa)*rfr;
    var rfs=1+Math.sin(t*1.5+rf)*0.5;
    X.fillStyle='rgba(255,220,150,'+(0.1+0.05*Math.sin(t+rf))+')';
    X.beginPath();X.arc(rfx,rfy,rfs*s,0,Math.PI*2);X.fill();
  }
  
  // Swedish table metaphor — abundance grid
  X.globalAlpha=0.04;
  for(var tg=0;tg<8;tg++){
    var tgx=cx-150*s+tg*40*s;
    var tgy=cy+160*s+Math.sin(t*0.3+tg)*10*s;
    // Table items
    for(var ti=0;ti<3;ti++){
      var tix=tgx+ti*15*s;
      var tiy=tgy-ti*5*s;
      X.fillStyle='rgba(255,200,100,0.3)';X.beginPath();X.arc(tix,tiy,3*s,0,Math.PI*2);X.fill();
    }
  }
  X.globalAlpha=1;
  
  // Labels
  X.globalAlpha=0.08;X.font=(9*s)+'px serif';X.fillStyle='rgba(255,220,180,0.6)';X.textAlign='center';
  X.fillText(modes[mode]+' — Щедрость цивилизации',cx,H-18*s);
  X.fillText('"Базар — шведский стол цивилизации"',cx,H-8*s);
  X.textAlign='left';X.globalAlpha=1;
  
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
