<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16 — Шеф на Аренде — PolyArt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0608;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#aaa;font-size:9px;text-transform:uppercase;letter-spacing:1.5px}
.ctrl input[type=range]{width:90px;accent-color:#e80;cursor:pointer}
.ctrl .val{color:#ddd;font-size:11px;font-weight:bold}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:16px;letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 20px #f805;z-index:10}
#info{position:absolute;top:42px;left:50%;transform:translateX(-50%);color:#666;font-size:9px;letter-spacing:2px;z-index:10}
#colorBtn{position:absolute;top:14px;left:14px;z-index:10;padding:4px 10px;background:rgba(255,120,0,0.08);border:1px solid rgba(255,120,0,0.3);color:#f80;font-size:9px;cursor:pointer;border-radius:3px;text-transform:uppercase;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Шеф на Аренде</div>
<div id="info">Огонь — Стихия — Решимость — Карикатура в полиномиальных кривых</div>
<button id="colorBtn" onclick="toggleColor()">Цвет</button>
<div id="ui">
<div class="ctrl"><label>Обводка</label><input type="range" id="lw" min="0" max="3" value="1.2" step="0.5"><span class="val" id="lwV">1.2</span></div>
<div class="ctrl"><label>Огонь</label><input type="range" id="gl" min="0" max="100" value="70"><span class="val" id="glV">0.70</span></div>
</div>
<script>
var C=document.getElementById('c'),X=C.getContext('2d'),W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

var col=false;
function toggleColor(){col=!col;document.getElementById('colorBtn').classList.toggle('on',col);}
document.getElementById('lw').oninput=function(){document.getElementById('lwV').textContent=this.value;};
document.getElementById('gl').oninput=function(){document.getElementById('glV').textContent=(this.value/100).toFixed(2);};

var PHI=1.618033988749895;
var t=0;

// Hot kitchen palette
function c1(a){return col?'rgba(220,60,30,'+a+')':'rgba(240,180,80,'+a+')';}
function c2(a){return col?'rgba(255,140,20,'+a+')':'rgba(255,200,60,'+a+')';}
function c3(a){return col?'rgba(255,220,100,'+a+')':'rgba(255,240,180,'+a+')';}
function c4(a){return col?'rgba(180,40,20,'+a+')':'rgba(200,80,40,'+a+')';}
function c5(a){return col?'rgba(255,255,240,'+a+')':'rgba(255,255,250,'+a+')';}
function c6(a){return col?'rgba(60,30,15,'+a+')':'rgba(80,50,30,'+a+')';}
function c7(a){return col?'rgba(100,200,80,'+a+')':'rgba(120,220,100,'+a+')';}
function c8(a){return col?'rgba(160,80,40,'+a+')':'rgba(180,120,60,'+a+')';}

function F(pts,c){X.fillStyle=c;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.fill();}
function S(pts,c,w){if(w<=0)return;X.strokeStyle=c;X.lineWidth=w;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.stroke();}

function draw(){
  var lw=parseFloat(document.getElementById('lw').value);
  var gl=parseFloat(document.getElementById('gl').value)/100;
  t+=0.016;
  X.fillStyle='#0a0608';X.fillRect(0,0,W,H);

  var cx=W/2, cy=H/2, s=Math.min(W,H)/550;

  // ====== KITCHEN BACKGROUND ======
  // Back wall
  F([
    [cx-W*0.45,cy-H*0.4],[cx+W*0.45,cy-H*0.4],
    [cx+W*0.45,cy+H*0.15],[cx-W*0.45,cy+H*0.15]
  ],c6('0.15)'));

  // Counter
  var counterY=cy+H*0.15;
  var counterH=H*0.08;
  F([
    [cx-W*0.45,counterY],[cx+W*0.45,counterY],
    [cx+W*0.45,counterY+counterH],[cx-W*0.45,counterY+counterH]
  ],c8('0.25)'));
  // Counter front
  F([
    [cx-W*0.45,counterY+counterH],[cx+W*0.45,counterY+counterH],
    [cx+W*0.45,counterY+counterH+H*0.25],[cx-W*0.45,counterY+counterH+H*0.25]
  ],c6('0.2)'));

  // Shelf
  S([[cx-W*0.4,cy-H*0.25],[cx+W*0.4,cy-H*0.25]],c8('0.15)'),lw);
  // Jars on shelf
  for(var ji=0;ji<4;ji++){
    var jx=cx-W*0.3+ji*W*0.18;
    F([
      [jx-6*s,cy-H*0.25-4*s],[jx-6*s,cy-H*0.25-20*s],
      [jx+6*s,cy-H*0.25-20*s],[jx+6*s,cy-H*0.25-4*s]
    ],c8('0.1)'));
    S([
      [jx-6*s,cy-H*0.25-4*s],[jx-6*s,cy-H*0.25-20*s],
      [jx+6*s,cy-H*0.25-20*s],[jx+6*s,cy-H*0.25-4*s]
    ],c8('0.08)'),lw*0.3);
  }

  // ====== STOVE — source of fire ======
  var stoveX=cx+W*0.15;
  var stoveY=counterY-counterH*0.5;
  var stoveW=W*0.22;
  var stoveH=H*0.06;
  F([
    [stoveX-stoveW/2,stoveY],[stoveX+stoveW/2,stoveY],
    [stoveX+stoveW/2,stoveY+stoveH],[stoveX-stoveW/2,stoveY+stoveH]
  ],c6('0.35)'));
  S([
    [stoveX-stoveW/2,stoveY],[stoveX+stoveW/2,stoveY],
    [stoveX+stoveW/2,stoveY+stoveH],[stoveX-stoveW/2,stoveY+stoveH]
  ],c6('0.2)'),lw);

  // Burner
  S([
    [stoveX-15*s,stoveY],[stoveX-15*s,stoveY-stoveH*0.3],
    [stoveX+15*s,stoveY-stoveH*0.3],[stoveX+15*s,stoveY]
  ],c6('0.2)'),lw*0.5);

  // FLAMES — dynamic, alive
  for(var fi=0;fi<12;fi++){
    var fx=stoveX-12*s+fi*2.2*s;
    var fh=15*s+Math.sin(t*4+fi*1.5)*8*s+Math.sin(t*7+fi)*4*s;
    var fw=2*s+Math.sin(t*3+fi)*1*s;
    var ftop=stoveY-fh;
    var fcolor=fi%3===0?c1('0.6)'):fi%3===1?c2('0.5)'):c3('0.4)');
    F([
      [fx-fw,stoveY],
      [fx-fw*1.5,stoveY-fh*0.4,fx,stoveY-fh*0.7],
      [fx,ftop],
      [fx+fw*1.5,stoveY-fh*0.4,fx+fw,stoveY]
    ],fcolor);
  }

  // POT on stove — boiling
  var potX=stoveX-5*s;
  var potY=stoveY-2*s;
  var potW=30*s, potH=18*s;
  // Pot body
  F([
    [potX-potW/2,potY],[potX-potW*0.55,potY+potH,potX+potW*0.55,potY+potH],[potX+potW/2,potY]
  ],c6('0.45)'));
  S([
    [potX-potW/2,potY],[potX-potW*0.55,potY+potH,potX+potW*0.55,potY+potH],[potX+potW/2,potY]
  ],c6('0.25)'),lw);
  // Handles
  S([[potX-potW/2-5*s,potY+potH*0.3],[potX-potW/2,potY+potH*0.3]],c6('0.2)'),lw);
  S([[potX+potW/2,potY+potH*0.3],[potX+potW/2+5*s,potY+potH*0.3]],c6('0.2)'),lw);
  // Steam — polynomial curves rising
  for(var si=0;si<5;si++){
    var stx=potX-8*s+si*4*s;
    var steamH=25*s+si*5*s;
    S([
      [stx,potY-2*s],
      [stx-4*s+Math.sin(t*2+si)*3*s,potY-steamH*0.4,stx+Math.sin(t*3+si)*5*s,potY-steamH*0.7],
      [stx+3*s+Math.sin(t*2.5+si)*4*s,potY-steamH]
    ],c5('0.08)'),lw*0.5);
  }

  // ====== THE CHEF — caricature figure ======
  // exaggerated features: huge head, tiny legs, massive chef hat,
  // arms in dramatic pose, leaning forward with intensity
  var chefX=cx-W*0.1;
  var chefY=counterY;
  var figH=s*160;
  var torsoH=figH*0.4;
  var legH=figH*0.3;
  var headR=torsoH*0.45; // BIG head for caricature
  var hatH=headR*1.8;    // HUGE chef hat

  // LEANING FORWARD — intensity indicator
  var lean=Math.sin(t*1.5)*3*s;

  // Legs — short, wide stance (caricature)
  var legW=7*s;
  // Left leg
  F([
    [chefX-legW*1.8,chefY],[chefX-legW*2,chefY-legH*0.4,chefX-legW*1.2,chefY-legH*0.8],
    [chefX-legW*0.8,chefY-legH],[chefX+legW*0.2,chefY-legH*0.8,chefX+legW*0.3,chefY-legH*0.4],
    [chefX+legW*0.5,chefY]
  ],c6('0.55)'));
  // Right leg
  F([
    [chefX+legW*0.5,chefY],[chefX+legW*0.3,chefY-legH*0.4,chefX+legW*1.2,chefY-legH*0.8],
    [chefX+legW*1.6,chefY-legH],[chefX+legW*2.2,chefY-legH*0.8,chefX+legW*2.4,chefY-legH*0.4],
    [chefX+legW*2.2,chefY]
  ],c6('0.5)'));

  // Apron — white, stained
  var apronBot=chefY-legH+legH*0.1;
  var apronTop=apronBot-torsoH;
  F([
    [chefX-legW*1.5,apronBot],[chefX-legW*1.8,apronTop+torsoH*0.2,chefX-legW*1.2,apronTop],
    [chefX+legW*1.2,apronTop],[chefX+legW*1.8,apronTop+torsoH*0.2,chefX+legW*1.5,apronBot]
  ],c5('0.2)'));
  S([
    [chefX-legW*1.5,apronBot],[chefX-legW*1.8,apronTop+torsoH*0.2,chefX-legW*1.2,apronTop],
    [chefX+legW*1.2,apronTop],[chefX+legW*1.8,apronTop+torsoH*0.2,chefX+legW*1.5,apronBot]
  ],c5('0.1)'),lw*0.5);
  // Apron strap
  S([[chefX-legW*0.8,apronTop+torsoH*0.05],[chefX+legW*0.8,apronTop+torsoH*0.05]],c5('0.08)'),lw*0.3);
  // Stain spots
  F([
    [chefX-8*s,apronBot-torsoH*0.3],
    [chefX-6*s,apronBot-torsoH*0.35,chefX-10*s,apronBot-torsoH*0.38],
    [chefX-8*s,apronBot-torsoH*0.35]
  ],c4('0.08)'));
  F([
    [chefX+5*s,apronBot-torsoH*0.15],
    [chefX+7*s,apronBot-torsoH*0.2,chefX+4*s,apronBot-torsoH*0.22],
    [chefX+5*s,apronBot-torsoH*0.18]
  ],c8('0.06)'));

  // TORSO — broad, leaning into the work
  var tBot=chefY-legH;
  var tTop=tBot-torsoH;
  F([
    [chefX+lean,tBot],[chefX+lean+8*s,tBot-torsoH*0.15,chefX+lean+13*s,tBot-torsoH*0.55],
    [chefX+lean+11*s,tTop,chefX+lean,tTop-5*s],
    [chefX+lean-9*s,tTop,chefX+lean-13*s,tBot-torsoH*0.55],
    [chefX+lean-10*s,tBot-torsoH*0.15],[chefX+lean,tBot]
  ],c5('0.3)'));
  S([
    [chefX+lean,tBot],[chefX+lean+8*s,tBot-torsoH*0.15,chefX+lean+13*s,tBot-torsoH*0.55],
    [chefX+lean+11*s,tTop,chefX+lean,tTop-5*s],
    [chefX+lean-9*s,tTop,chefX+lean-13*s,tBot-torsoH*0.55],
    [chefX+lean-10*s,tBot-torsoH*0.15],[chefX+lean,tBot]
  ],c5('0.12)'),lw);

  // === LEFT ARM — stirring the pot with intensity ===
  var stir=Math.sin(t*3)*8*s;
  F([
    [chefX+lean-12*s,tTop+torsoH*0.1],
    [chefX+lean-22*s,tTop+torsoH*0.15+stir,chefX+lean-35*s,stoveY-potH*0.3],
    [chefX+lean-30*s,stoveY-potH*0.2,chefX+lean-25*s,stoveY+2*s]
  ],c5('0.25)'));

  // Spoon/ladle
  var ladleX=chefX+lean-28*s, ladleY=stoveY;
  S([[ladleX-12*s,ladleY-20*s],[ladleX,ladleY+2*s]],c8('0.3)'),lw*1.2);
  // Ladle bowl
  F([
    [ladleX-4*s,ladleY+2*s],[ladleX-6*s,ladleY+8*s,ladleX+6*s,ladleY+8*s],[ladleX+4*s,ladleY+2*s]
  ],c6('0.25)'));

  // === RIGHT ARM — dramatic gesture, holding something ===
  var gestWave=Math.sin(t*2.5)*5*s;
  F([
    [chefX+lean+12*s,tTop+torsoH*0.1],
    [chefX+lean+20*s,tTop+torsoH*0.05+gestWave,chefX+lean+35*s,tTop-torsoH*0.1+gestWave],
    [chefX+lean+42*s,tTop-torsoH*0.15+gestWave,chefX+lean+45*s,tTop-torsoH*0.1+gestWave]
  ],c5('0.25)'));
  S([
    [chefX+lean+12*s,tTop+torsoH*0.1],
    [chefX+lean+20*s,tTop+torsoH*0.05+gestWave,chefX+lean+35*s,tTop-torsoH*0.1+gestWave],
    [chefX+lean+42*s,tTop-torsoH*0.15+gestWave,chefX+lean+45*s,tTop-torsoH*0.1+gestWave]
  ],c5('0.1)'),lw*0.5);

  // Spice shaker in hand
  var shX=chefX+lean+44*s, shY=tTop-torsoH*0.12+gestWave;
  F([
    [shX-3*s,shY+5*s],[shX-3*s,shY-5*s],[shX+3*s,shY-5*s],[shX+3*s,shY+5*s]
  ],c8('0.3)'));
  // Spice particles flying out
  for(var pi=0;pi<8;pi++){
    var px=shX+5*s+pi*3*s+Math.sin(t*4+pi)*2*s;
    var py=shY-5*s-Math.sin(t*3+pi)*4*s+pi*2*s;
    X.fillStyle=c1(0.3+Math.sin(t*5+pi)*0.1+')');
    X.beginPath();X.arc(px,py,0.8*s,0,Math.PI*2);X.fill();
  }

  // ====== HEAD — HUGE caricature head ======
  var hX=chefX+lean, hY=tTop-headR*0.3;

  // Face — round, expressive
  F([
    [hX-headR,hY],[hX-headR*1.1,hY-headR*0.8,hX,hY-headR*1.2],
    [hX+headR*1.1,hY-headR*0.8,hX+headR,hY],
    [hX+headR*1.1,hY+headR*0.6,hX,hY+headR*0.8],
    [hX-headR*1.1,hY+headR*0.6,hX-headR,hY]
  ],c8('0.35)'));
  S([
    [hX-headR,hY],[hX-headR*1.1,hY-headR*0.8,hX,hY-headR*1.2],
    [hX+headR*1.1,hY-headR*0.8,hX+headR,hY],
    [hX+headR*1.1,hY+headR*0.6,hX,hY+headR*0.8],
    [hX-headR*1.1,hY+headR*0.6,hX-headR,hY]
  ],c8('0.2)'),lw);

  // CHEF HAT — toque blanche, exaggerated tall
  F([
    [hX-headR*0.9,hY-headR*0.8],
    [hX-headR*1.0,hY-headR*1.2,hX-headR*0.8,hY-headR*1.5-hatH*0.3],
    [hX-headR*0.4,hY-headR*1.8-hatH*0.6,hX,hY-headR*2.0-hatH],
    [hX+headR*0.4,hY-headR*1.8-hatH*0.6,hX+headR*0.8,hY-headR*1.5-hatH*0.3],
    [hX+headR*1.0,hY-headR*1.2,hX+headR*0.9,hY-headR*0.8]
  ],c5('0.25)'));
  S([
    [hX-headR*0.9,hY-headR*0.8],
    [hX-headR*1.0,hY-headR*1.2,hX-headR*0.8,hY-headR*1.5-hatH*0.3],
    [hX-headR*0.4,hY-headR*1.8-hatH*0.6,hX,hY-headR*2.0-hatH],
    [hX+headR*0.4,hY-headR*1.8-hatH*0.6,hX+headR*0.8,hY-headR*1.5-hatH*0.3],
    [hX+headR*1.0,hY-headR*1.2,hX+headR*0.9,hY-headR*0.8]
  ],c5('0.1)'),lw);
  // Hat pleats
  for(var hi=0;hi<4;hi++){
    var hx2=hX-headR*0.5+hi*headR*0.33;
    S([
      [hx2,hY-headR*0.9],[hx2+Math.sin(hi)*2*s,hY-headR*1.5-hatH*0.5]
    ],c5('0.06)'),lw*0.3);
  }

  // Eyes — HUGE, intense, focused
  var eyeR=headR*0.18;
  var eyeY=hY-headR*0.15;
  // Left eye
  F([
    [hX-headR*0.45,eyeY],[hX-headR*0.45,eyeY-eyeR*1.2,hX-headR*0.2,eyeY-eyeR*1.2],
    [hX-headR*0.2,eyeY],[hX-headR*0.2,eyeY+eyeR*0.8,hX-headR*0.45,eyeY+eyeR*0.8]
  ],c5('0.5)'));
  // Pupil — looking at pot
  F([
    [hX-headR*0.38,eyeY],[hX-headR*0.38,eyeY-eyeR*0.6,hX-headR*0.28,eyeY-eyeR*0.6],
    [hX-headR*0.28,eyeY],[hX-headR*0.28,eyeY+eyeR*0.5,hX-headR*0.38,eyeY+eyeR*0.5]
  ],c6('0.5)'));
  // Eye highlight
  X.fillStyle='rgba(255,255,255,0.5)';X.beginPath();X.arc(hX-headR*0.35,eyeY-eyeR*0.3,eyeR*0.25,0,Math.PI*2);X.fill();

  // Right eye — slightly squinted (intense focus)
  F([
    [hX+headR*0.2,eyeY],[hX+headR*0.2,eyeY-eyeR*1.0,hX+headR*0.45,eyeY-eyeR*1.0],
    [hX+headR*0.45,eyeY],[hX+headR*0.45,eyeY+eyeR*0.6,hX+headR*0.2,eyeY+eyeR*0.6]
  ],c5('0.5)'));
  F([
    [hX+headR*0.25,eyeY],[hX+headR*0.25,eyeY-eyeR*0.5,hX+headR*0.38,eyeY-eyeR*0.5],
    [hX+headR*0.38,eyeY],[hX+headR*0.38,eyeY+eyeR*0.4,hX+headR*0.25,eyeY+eyeR*0.4]
  ],c6('0.5)'));
  X.fillStyle='rgba(255,255,255,0.5)';X.beginPath();X.arc(hX+headR*0.28,eyeY-eyeR*0.2,eyeR*0.2,0,Math.PI*2);X.fill();

  // Eyebrows — furrowed, intense
  S([
    [hX-headR*0.5,eyeY-eyeR*1.6],[hX-headR*0.35,eyeY-eyeR*2.0,hX-headR*0.15,eyeY-eyeR*1.5]
  ],c6('0.35)'),lw*0.8);
  S([
    [hX+headR*0.15,eyeY-eyeR*1.5],[hX+headR*0.35,eyeY-eyeR*2.0,hX+headR*0.5,eyeY-eyeR*1.6]
  ],c6('0.35)'),lw*0.8);

  // Nose — big, round (caricature)
  F([
    [hX-4*s,eyeY+eyeR*0.5],[hX-6*s,eyeY+eyeR*1.0,hX,eyeY+eyeR*1.3],
    [hX+6*s,eyeY+eyeR*1.0,hX+4*s,eyeY+eyeR*0.5]
  ],c8('0.25)'));

  // Mouth — determined, slightly open (tasting/concentrating)
  var mouthOpen=Math.abs(Math.sin(t*2))*3*s;
  F([
    [hX-headR*0.25,hY+headR*0.3],
    [hX-headR*0.1,hY+headR*0.35+mouthOpen,hX+headR*0.1,hY+headR*0.35+mouthOpen],
    [hX+headR*0.25,hY+headR*0.3],
    [hX+headR*0.1,hY+headR*0.3-mouthOpen*0.3,hX-headR*0.1,hY+headR*0.3-mouthOpen*0.3]
  ],c4('0.2)'));

  // Sweat drops — intensity indicator
  for(var swi=0;swi<3;swi++){
    var swx=hX+headR*0.8+swi*4*s;
    var swy=hY-headR*0.2+swi*6*s+Math.sin(t*2+swi)*2*s;
    var swSize=1.5*s+Math.sin(t+swi)*0.5*s;
    F([
      [swx,swy-swSize*2],[swx+swSize,swy],[swx,swy+swSize*0.5],[swx-swSize,swy]
    ],c1('0.25)'));
  }

  // ====== FLYING INGREDIENTS — chaos of cooking ======
  // Tomato
  var tmX=cx+W*0.25+Math.sin(t*1.8)*20*s;
  var tmY=counterY-H*0.2+Math.cos(t*2)*10*s;
  F([
    [tmX,tmY-8*s],[tmX+8*s,tmY-4*s,tmX+8*s,tmY+4*s],
    [tmX,tmY+8*s],[tmX-8*s,tmY+4*s,tmX-8*s,tmY-4*s]
  ],c1('0.35)'));
  // Stem
  S([[tmX,tmY-8*s],[tmX+1*s,tmY-12*s]],c7('0.2)'),lw*0.5);

  // Onion rings flying
  for(var oi=0;oi<3;oi++){
    var ox=cx-W*0.3+Math.sin(t*2.2+oi*2)*15*s;
    var oy=cy-H*0.1+Math.cos(t*1.8+oi*1.5)*12*s;
    X.strokeStyle=c5('0.15)');X.lineWidth=lw*0.5;
    X.beginPath();X.ellipse(ox,oy,5*s+oi*2*s,3*s+oi*s,Math.sin(t+oi)*0.3,0,Math.PI*2);X.stroke();
  }

  // Herb leaves
  for(var hi2=0;hi2<4;hi2++){
    var lhx=cx-W*0.15+Math.sin(t*1.5+hi2*2.5)*25*s;
    var lhy=cy-H*0.15+Math.cos(t*2+hi2*1.8)*15*s;
    var lha=t*2+hi2*1.5;
    F([
      [lhx,lhy],[lhx+Math.cos(lha)*6*s,lhy+Math.sin(lha)*3*s,lhx+Math.cos(lha)*10*s,lhy],
      [lhx+Math.cos(lha)*6*s,lhy-Math.sin(lha)*3*s,lhx,lhy]
    ],c7('0.2)'));
  }

  // Garlic clove
  var gcX=cx+W*0.32+Math.cos(t*1.7)*12*s;
  var gcY=cy-H*0.25+Math.sin(t*2.1)*8*s;
  F([
    [gcX,gcY-5*s],[gcX+4*s,gcY,gcX+3*s,gcY+5*s],[gcX,gcY+6*s],[gcX-3*s,gcY+5*s,gcX-4*s,gcY]
  ],c5('0.2)'));

  // ====== ACTION LINES — movement energy ======
  for(var ai=0;ai<8;ai++){
    var al=30*s+ai*8*s;
    var aa=Math.sin(t*2+ai*0.8)*0.15;
    S([
      [chefX+lean+45*s,tTop-torsoH*0.1+gestWave],
      [chefX+lean+45*s+al*0.6,tTop-torsoH*0.1+gestWave+Math.sin(t+ai)*5*s+aa*al,
       chefX+lean+45*s+al,tTop-torsoH*0.1+gestWave+Math.sin(t*1.5+ai)*6*s+aa*al]
    ],c2(0.06+Math.sin(t*3+ai)*0.02+')'),lw*0.3);
  }

  // ====== FIRE GLOW — from stove ======
  if(gl>0.05){
    var fg=X.createRadialGradient(stoveX,stoveY,5*s,stoveX,stoveY,80*s*gl);
    fg.addColorStop(0,'rgba(255,150,30,'+(0.12*gl)+')');
    fg.addColorStop(0.5,'rgba(255,100,10,'+(0.04*gl)+')');
    fg.addColorStop(1,'rgba(255,50,0,0)');
    X.fillStyle=fg;X.beginPath();X.arc(stoveX,stoveY,80*s*gl,0,Math.PI*2);X.fill();

    // Chef face glow
    var cfg=X.createRadialGradient(hX,hY,0,hX,hY,30*s*gl);
    cfg.addColorStop(0,'rgba(255,180,80,'+(0.06*gl)+')');cfg.addColorStop(1,'rgba(255,180,80,0)');
    X.fillStyle=cfg;X.beginPath();X.arc(hX,hY,30*s*gl,0,Math.PI*2);X.fill();
  }

  // ====== FLOATING SPARKS ======
  for(var ski=0;ski<15;ski++){
    var skx=stoveX+Math.sin(t*3+ski*2.5)*30*s;
    var sky=stoveY-20*s-Math.abs(Math.sin(t*2+ski*1.8))*40*s;
    var skr=0.5+Math.sin(t*5+ski)*0.5;
    X.fillStyle='rgba(255,200,80,'+(0.15+0.1*Math.sin(t*4+ski))+')';
    X.beginPath();X.arc(skx,sky,skr*s,0,Math.PI*2);X.fill();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
