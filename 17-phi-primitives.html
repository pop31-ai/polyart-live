<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 — φ-Примитивы — PolyArt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08060e;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#aaa;font-size:9px;text-transform:uppercase;letter-spacing:1.5px}
.ctrl input[type=range]{width:90px;accent-color:#fc0;cursor:pointer}
.ctrl .val{color:#ddd;font-size:11px;font-weight:bold}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:16px;letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 20px #fc05;z-index:10}
#info{position:absolute;top:42px;left:50%;transform:translateX(-50%);color:#666;font-size:9px;letter-spacing:2px;z-index:10}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">φ-Примитивы</div>
<div id="info">Золотое сечение — Приподнятые элементы — Тени глубины — Полиномиальные кривые</div>
<div id="ui">
<div class="ctrl"><label>Обводка</label><input type="range" id="lw" min="0" max="3" value="1" step="0.5"><span class="val" id="lwV">1</span></div>
<div class="ctrl"><label>Высота</label><input type="range" id="gl" min="0" max="100" value="50"><span class="val" id="glV">0.50</span></div>
<div class="ctrl"><label>Наряд</label><button id="togD" style="background:none;border:1px solid #fc0;color:#fc0;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px;letter-spacing:1px">NUDUS</button></div>
<div class="ctrl"><label>Тип</label><button id="togT" style="background:none;border:1px solid #aaa;color:#aaa;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px;letter-spacing:1px">ТОГА</button></div>
<div class="ctrl"><label>Состояние</label><button id="togS" style="background:none;border:1px solid #5f5;color:#5f5;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px;letter-spacing:1px">ТРЕЗВ</button></div>
<div class="ctrl"><label>Телосложение</label><button id="togB" style="background:none;border:1px solid #aaa;color:#aaa;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:10px;letter-spacing:1px">НОРМА</button></div>
</div>
<script>
var C=document.getElementById('c'),X=C.getContext('2d'),W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

document.getElementById('lw').oninput=function(){document.getElementById('lwV').textContent=this.value;};
document.getElementById('gl').oninput=function(){document.getElementById('glV').textContent=(this.value/100).toFixed(2);};

var PHI=1.618033988749895;
var t=0;
var dressed=false;
var dressType=0;
var dressNames=['ТОГА','ЛОРИКА','ИМПЕРАТОР'];
var drunk=0;
var bodyType=0; // 0=norm,1=thin,2=chubby,4=bloated
var bodyNames=['НОРМА','ХУДОЙ','ПОЛНЫЙ','ОПУХ'];
document.getElementById('togD').onclick=function(){dressed=!dressed;this.textContent=dressed?'ROMA':'NUDUS';};
document.getElementById('togT').onclick=function(){dressType=(dressType+1)%3;this.textContent=dressNames[dressType];};
document.getElementById('togS').onclick=function(){drunk=drunk?0:1;this.textContent=drunk?'БРАК':'ТРЕЗВ';this.style.color=drunk?'#f55':'#5f5';};
document.getElementById('togB').onclick=function(){bodyType=(bodyType+1)%4;this.textContent=bodyNames[bodyType];};

function F(pts,c){X.fillStyle=c;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.fill();}
function S(pts,c,w){if(w<=0)return;X.strokeStyle=c;X.lineWidth=w;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.stroke();}

// Draw elevated primitive: shape + drop shadow + highlight edge
function elevation(cx,cy,size,shadowH,col,strokeCol,lw2){
  // Drop shadow
  X.globalAlpha=0.15;
  F([
    [cx-size,cy+shadowH*0.3],[cx-size+size*0.3,cy+shadowH,cx+size*0.3,cy+shadowH],[cx+size,cy+shadowH*0.3]
  ],'rgba(0,0,0,0.8)');
  X.globalAlpha=1;
  // Main shape
  S([[cx-size,cy],[cx+size,cy]],strokeCol,lw2);
  // Highlight edge (top)
  S([[cx-size,cy],[cx-size+size*0.2,cy-shadowH*0.3]],'rgba(255,255,255,0.08)',lw2*0.3);
}

// Golden ratio spiral points
function gSpiral(cx,cy,a,n){
  var pts=[];
  for(var i=0;i<=n;i++){
    var f=i/n;
    var r=a*Math.pow(PHI,f*2);
    var ang=f*Math.PI*2;
    pts.push([cx+Math.cos(ang)*r,cy+Math.sin(ang)*r]);
  }
  return pts;
}

function draw(){
  var lw=parseFloat(document.getElementById('lw').value);
  var elev=parseFloat(document.getElementById('gl').value)/100;
  t+=0.016;
  X.fillStyle='#08060e';X.fillRect(0,0,W,H);

  var cx=W/2, cy=H/2, s=Math.min(W,H)/550;
  var shH=elev*12*s;

  // Body type multipliers
  var bW=1,bH=1,bLW=1,bHead=1,bJaw=1,bBelly=0,bNeck=1,bArm=1; // defaults = norm
  if(bodyType===1){bW=0.72;bH=1.15;bLW=0.7;bHead=1.08;bJaw=0.8;bBelly=0;bNeck=0.75;bArm=0.7;} // худой
  if(bodyType===2){bW=1.35;bH=0.92;bLW=1.3;bHead=0.95;bJaw=1.2;bBelly=0.4;bNeck=1.2;bArm=1.2;} // полный
  if(bodyType===3){bW=1.6;bH=0.85;bLW=1.5;bHead=1.1;bJaw=1.5;bBelly=0.8;bNeck=1.4;bArm=1.3;} // опухший

  // Drunk sway
  var drunkSway=drunk?Math.sin(t*1.2)*4*s:0;
  var drunkNod=drunk?Math.sin(t*0.8)*2*s:0;

  // ====== GOLDEN RATIO GRID ======
  var gx1=W/PHI, gx2=W-gx1;
  var gy1=H/PHI, gy2=H-gy1;
  // Vertical lines
  X.globalAlpha=0.04;
  S([[gx1,0],[gx1,H]],'rgba(255,200,0,0.5)',lw*0.3);
  S([[gx2,0],[gx2,H]],'rgba(255,200,0,0.5)',lw*0.3);
  S([[0,gy1],[W,gy1]],'rgba(255,200,0,0.5)',lw*0.3);
  S([[0,gy2],[W,gy2]],'rgba(255,200,0,0.5)',lw*0.3);
  X.globalAlpha=1;

  // Golden spiral
  var sp=gSpiral(cx,cy,W*0.35,80);
  X.globalAlpha=0.06+0.02*Math.sin(t*0.5);
  S(sp,'rgba(255,200,50,0.5)',lw*0.5);
  X.globalAlpha=1;

  // ====== FIGURE — human form from φ-primitives ======
  // Each body part = primitive scaled by golden ratio
  // Positioned at golden section points
  // Elevated with shadows

  // === HEAD — realistic human head, polynomial curves ===
  var headR=s*28*bHead;
  var headX=cx+drunkSway;
  var headY=cy-H*0.22+drunkNod;
  var headElev=shH*1.5;
  // Enforce minimum facial feature sizes — face always detailed
  var eyeMinR=s*3.5;
  var noseMinR=s*2;
  var mouthMinW=s*8;

  // Shadow
  X.globalAlpha=0.2;
  X.fillStyle='rgba(0,0,0,0.9)';X.beginPath();X.ellipse(headX+3*s,headY+headElev+4*s,headR*1.1,headR*0.4,0,0,Math.PI*2);X.fill();
  X.globalAlpha=1;

  // Head shape — oval with jawline (polynomial)
  var jawDrop=headR*0.35*bJaw; // chin extends below circle — affected by body type
  X.fillStyle='rgba(255,230,180,0.13)';
  X.beginPath();
  X.moveTo(headX,headY-headElev-headR*0.95); // top of skull
  // Right side — skull to cheek to jaw
  X.bezierCurveTo(
    headX+headR*0.7,headY-headElev-headR*0.9,
    headX+headR*1.05,headY-headElev-headR*0.3,
    headX+headR*0.95,headY-headElev+headR*0.15
  );
  // Right jaw — angular
  X.bezierCurveTo(
    headX+headR*0.85,headY-headElev+headR*0.45,
    headX+headR*0.55,headY-headElev+jawDrop,
    headX+headR*0.15,headY-headElev+jawDrop+2*s
  );
  // Chin
  X.quadraticCurveTo(
    headX,headY-headElev+jawDrop+4*s,
    headX-headR*0.15,headY-headElev+jawDrop+2*s
  );
  // Left jaw
  X.bezierCurveTo(
    headX-headR*0.55,headY-headElev+jawDrop,
    headX-headR*0.85,headY-headElev+headR*0.45,
    headX-headR*0.95,headY-headElev+headR*0.15
  );
  // Left side — jaw to cheek to skull
  X.bezierCurveTo(
    headX-headR*1.05,headY-headElev-headR*0.3,
    headX-headR*0.7,headY-headElev-headR*0.9,
    headX,headY-headElev-headR*0.95
  );
  X.fill();

  // Outline — same shape
  X.strokeStyle='rgba(255,220,160,0.55)';X.lineWidth=lw*1.2;
  X.beginPath();
  X.moveTo(headX,headY-headElev-headR*0.95);
  X.bezierCurveTo(
    headX+headR*0.7,headY-headElev-headR*0.9,
    headX+headR*1.05,headY-headElev-headR*0.3,
    headX+headR*0.95,headY-headElev+headR*0.15
  );
  X.bezierCurveTo(
    headX+headR*0.85,headY-headElev+headR*0.45,
    headX+headR*0.55,headY-headElev+jawDrop,
    headX+headR*0.15,headY-headElev+jawDrop+2*s
  );
  X.quadraticCurveTo(
    headX,headY-headElev+jawDrop+4*s,
    headX-headR*0.15,headY-headElev+jawDrop+2*s
  );
  X.bezierCurveTo(
    headX-headR*0.55,headY-headElev+jawDrop,
    headX-headR*0.85,headY-headElev+headR*0.45,
    headX-headR*0.95,headY-headElev+headR*0.15
  );
  X.bezierCurveTo(
    headX-headR*1.05,headY-headElev-headR*0.3,
    headX-headR*0.7,headY-headElev-headR*0.9,
    headX,headY-headElev-headR*0.95
  );
  X.stroke();

  // Brow ridge — subtle curve
  S([
    [headX-headR*0.55,headY-headElev-headR*0.12,
     headX-headR*0.2,headY-headElev-headR*0.18,
     headX,headY-headElev-headR*0.17,
     headX+headR*0.2,headY-headElev-headR*0.18,
     headX+headR*0.55,headY-headElev-headR*0.12]
  ],'rgba(255,220,160,0.2)',lw*0.5);

  // Eyes — almond-shaped with polynomial curves
  var eyeY=headY-headElev+headR*0.0;
  var eyeW=Math.max(headR*0.32,eyeMinR*2.5);
  var eyeH=Math.max(headR*0.11,eyeMinR);
  for(var ei=-1;ei<=1;ei+=2){
    var ex=headX+ei*headR*0.3;
    // Eye white
    X.fillStyle='rgba(255,255,252,0.15)';
    X.beginPath();
    X.moveTo(ex-eyeW,eyeY);
    X.quadraticCurveTo(ex,eyeY-eyeH*1.5,ex+eyeW,eyeY);
    X.quadraticCurveTo(ex,eyeY+eyeH*1.2,ex-eyeW,eyeY);
    X.fill();
    // Iris
    var irisR=eyeH*0.9;
    var irisOff=Math.sin(t*0.3)*1.5*s; // subtle look-around
    X.fillStyle='rgba(80,100,140,0.25)';
    X.beginPath();X.arc(ex+irisOff,eyeY,irisR,0,Math.PI*2);X.fill();
    // Pupil
    X.fillStyle='rgba(20,20,30,0.4)';
    X.beginPath();X.arc(ex+irisOff,eyeY,irisR*0.45,0,Math.PI*2);X.fill();
    // Light reflection
    X.fillStyle='rgba(255,255,255,0.3)';
    X.beginPath();X.arc(ex+irisOff+irisR*0.25,eyeY-irisR*0.25,irisR*0.2,0,Math.PI*2);X.fill();
    // Eyelid line
    S([
      [ex-eyeW*1.1,eyeY+eyeH*0.2,
       ex,eyeY-eyeH*1.8,
       ex+eyeW*1.1,eyeY+eyeH*0.2]
    ],'rgba(200,180,150,0.3)',lw*0.5);
    // Lower lash line
    S([
      [ex-eyeW*0.9,eyeY+eyeH*0.3,
       ex,eyeY+eyeH*1.3,
       ex+eyeW*0.9,eyeY+eyeH*0.3]
    ],'rgba(200,180,150,0.15)',lw*0.3);
    // Eyebrow
    S([
      [ex-eyeW*1.2,eyeY-eyeH*2.5-ei*2*s,
       ex-eyeW*0.2,eyeY-eyeH*3.2-ei*1*s,
       ex+eyeW*0.8,eyeY-eyeH*2.3-ei*0.5*s]
    ],'rgba(80,60,40,0.25)',lw*0.7);
  }

  // Nose — polynomial bridge and tip
  var noseTopY=headY-headElev-headR*0.15;
  var noseBotY=headY-headElev+headR*0.25;
  var noseMidY=(noseTopY+noseBotY)/2;
  // Bridge
  S([
    [headX-headR*0.04,noseTopY,
     headX-headR*0.06,noseMidY,
     headX-headR*0.1,noseBotY-4*s]
  ],'rgba(200,180,150,0.2)',lw*0.6);
  S([
    [headX+headR*0.04,noseTopY,
     headX+headR*0.03,noseMidY,
     headX+headR*0.08,noseBotY-4*s]
  ],'rgba(200,180,150,0.15)',lw*0.5);
  // Tip — small circle
  X.fillStyle='rgba(255,220,180,0.1)';X.beginPath();
  X.ellipse(headX,noseBotY-2*s,headR*0.1,headR*0.06,0,0,Math.PI*2);X.fill();
  // Nostrils
  X.fillStyle='rgba(180,150,120,0.15)';
  X.beginPath();X.ellipse(headX-headR*0.06,noseBotY,headR*0.04,headR*0.025,-0.2,0,Math.PI*2);X.fill();
  X.beginPath();X.ellipse(headX+headR*0.06,noseBotY,headR*0.04,headR*0.025,0.2,0,Math.PI*2);X.fill();

  // Mouth — full lips with polynomial curves
  var mouthY=headY-headElev+headR*0.42;
  var mouthW=Math.max(headR*0.28,mouthMinW);
  // Upper lip — cupid's bow
  X.fillStyle='rgba(200,130,110,0.1)';
  X.beginPath();
  X.moveTo(headX-mouthW,mouthY);
  X.quadraticCurveTo(headX-mouthW*0.5,mouthY-3*s,headX,mouthY-2*s+Math.sin(t*1.5)*s);
  X.quadraticCurveTo(headX+mouthW*0.5,mouthY-3*s,headX+mouthW,mouthY);
  X.quadraticCurveTo(headX,mouthY+1*s,headX-mouthW,mouthY);
  X.fill();
  // Upper lip outline
  S([
    [headX-mouthW,mouthY,
     headX-mouthW*0.5,mouthY-3*s,
     headX,mouthY-2*s+Math.sin(t*1.5)*s,
     headX+mouthW*0.5,mouthY-3*s,
     headX+mouthW,mouthY]
  ],'rgba(180,110,90,0.35)',lw*0.7);
  // Lower lip
  X.fillStyle='rgba(210,140,120,0.08)';
  X.beginPath();
  X.moveTo(headX-mouthW*0.9,mouthY+1*s);
  X.quadraticCurveTo(headX,mouthY+5*s+Math.sin(t*1.5)*1.5*s,headX+mouthW*0.9,mouthY+1*s);
  X.quadraticCurveTo(headX,mouthY+2*s,headX-mouthW*0.9,mouthY+1*s);
  X.fill();
  S([
    [headX-mouthW*0.9,mouthY+1*s,
     headX,mouthY+5*s+Math.sin(t*1.5)*1.5*s,
     headX+mouthW*0.9,mouthY+1*s]
  ],'rgba(180,110,90,0.25)',lw*0.5);
  // Line between lips
  S([
    [headX-mouthW,mouthY,
     headX-mouthW*0.3,mouthY+0.5*s+Math.sin(t*1.5)*0.5*s,
     headX+mouthW*0.3,mouthY+0.5*s+Math.sin(t*1.5)*0.5*s,
     headX+mouthW,mouthY]
  ],'rgba(150,100,80,0.3)',lw*0.4);

  // Ears — small polynomial curves on sides
  for(var ear=-1;ear<=1;ear+=2){
    var earX=headX+ear*headR*0.95;
    var earY=headY-headElev-headR*0.05;
    var earH2=headR*0.3;
    S([
      [earX,earY-earH2,
       earX+ear*headR*0.15,earY-earH2*0.3,
       earX+ear*headR*0.12,earY+earH2*0.3,
       earX,earY+earH2]
    ],'rgba(255,220,160,0.2)',lw*0.5);
    // Inner ear
    S([
      [earX+ear*2*s,earY-earH2*0.6,
       earX+ear*headR*0.1,earY,
       earX+ear*2*s,earY+earH2*0.5]
    ],'rgba(220,180,140,0.12)',lw*0.3);
  }

  // Neck shadow under jaw
  X.globalAlpha=0.06;
  F([
    [headX-headR*0.3,headY-headElev+jawDrop+2*s],
    [headX+headR*0.3,headY-headElev+jawDrop+2*s],
    [headX+headR*0.4,headY-headElev+jawDrop+12*s],
    [headX-headR*0.4,headY-headElev+jawDrop+12*s]
  ],'rgba(0,0,0,0.5)');
  X.globalAlpha=1;

  // === DRUNK FACE EFFECTS ===
  if(drunk){
    // Flushed cheeks — red patches
    X.globalAlpha=0.12+Math.sin(t*2)*0.03;
    X.fillStyle='rgba(220,80,60,0.5)';
    X.beginPath();X.ellipse(headX-headR*0.55,headY-headElev+headR*0.2,headR*0.18,headR*0.12,0.1,0,Math.PI*2);X.fill();
    X.beginPath();X.ellipse(headX+headR*0.55,headY-headElev+headR*0.2,headR*0.18,headR*0.12,-0.1,0,Math.PI*2);X.fill();
    X.globalAlpha=1;

    // Droopy left eyelid — half-closed
    var droopY=eyeY-eyeH*0.3;
    X.fillStyle='rgba(255,230,180,0.12)';
    X.beginPath();
    X.moveTo(headX-headR*0.3-headR*0.32,droopY);
    X.quadraticCurveTo(headX-headR*0.3,droopY+eyeH*0.8,headX-headR*0.3+headR*0.32,droopY);
    X.quadraticCurveTo(headX-headR*0.3,droopY-eyeH*0.5,headX-headR*0.3-headR*0.32,droopY);
    X.fill();

    // Slight smirk — asymmetric mouth
    S([
      [headX-mouthW,mouthY+1.5*s,
       headX-mouthW*0.2,mouthY+3*s+Math.sin(t*1.5)*s,
       headX+mouthW*0.5,mouthY-1*s,
       headX+mouthW,mouthY+0.5*s]
    ],'rgba(180,110,90,0.15)',lw*0.4);
  }

  // === BODY TYPE EFFECTS ===
  // Belly bulge — polynomial curve below torso
  if(bBelly>0){
    var bellyCY=torsoCY+torsoH2*0.3-torsoElev;
    var bellyR=torsoW*bBelly*0.8;
    X.fillStyle='rgba(255,230,180,0.06)';
    X.beginPath();
    X.ellipse(torsoCX+drunkSway*0.5,bellyCY+bellyR*0.3,bellyR,bellyR*0.7,0,0,Math.PI);
    X.fill();
    S([
      [torsoCX+drunkSway*0.5-bellyR,bellyCY+bellyR*0.1,
       torsoCX+drunkSway*0.5,bellyCY+bellyR*0.9,
       torsoCX+drunkSway*0.5+bellyR,bellyCY+bellyR*0.1]
    ],'rgba(255,220,160,0.15)',lw*0.5);
  }

  // === DRUNK ACCESSORIES — wine in hand ===
  if(drunk){
    var cupX=handX+8*s;
    var cupY=handY-4*s;
    var cupElev=shH*0.5;
    // Shadow
    X.globalAlpha=0.1;X.fillStyle='rgba(0,0,0,0.6)';
    X.beginPath();X.ellipse(cupX+1*s,cupY+cupElev+2*s,5*s,2*s,0,0,Math.PI*2);X.fill();X.globalAlpha=1;
    // Cup stem
    S([[cupX,cupY+cupElev*0.5],[cupX,cupY-cupElev]],'rgba(200,180,140,0.3)',lw*0.5);
    // Cup bowl
    X.fillStyle='rgba(180,50,50,0.15)';
    X.beginPath();
    X.moveTo(cupX-5*s,cupY-cupElev);

      for(var sg=0;sg<2;sg++){

           sgX+sgSide*torsoW*0.25,torsoCY-torsoH2*0.58-clothElev,

           sgX+sgSide*torsoW*0.1,torsoCY-torsoH2*0.4-clothElev]
        ],lorStroke,lw*0.9);
        // Gold edge
        S([
          [sgX+sgSide*torsoW*0.05,torsoCY-torsoH2*0.46-clothElev,
           sgX+sgSide*torsoW*0.22,torsoCY-torsoH2*0.56-clothElev,
           sgX+sgSide*torsoW*0.32,torsoCY-torsoH2*0.44-clothElev]
        ],'rgba(255,200,80,0.25)',lw*0.5);
        // Leather straps with studs
        S([
          [sgX+sgSide*torsoW*0.1,torsoCY-torsoH2*0.5-clothElev,
           sgX+sgSide*torsoW*0.15,torsoCY-torsoH2*0.1-clothElev]
        ],'rgba(140,100,50,0.35)',lw*0.7);
        // Gold studs on straps
        for(var si2=0;si2<3;si2++){
          var studY=torsoCY-torsoH2*0.4-clothElev+si2*torsoH2*0.15;
          X.fillStyle='rgba(255,200,80,0.3)';
          X.beginPath();X.arc(sgX+sgSide*torsoW*0.12,studY,1.5*s,0,Math.PI*2);X.fill();
        }

      // Belt — ornate cingulum with gold buckle
      var beltY=torsoCY+torsoH2*0.15-clothElev;
      S([[torsoCX-torsoW*0.52,beltY],[torsoCX+torsoW*0.52,beltY]],'rgba(200,160,80,0.5)',lw*1.5);
      // Gold edges
      S([[torsoCX-torsoW*0.52,beltY-2*s],[torsoCX+torsoW*0.52,beltY-2*s]],'rgba(255,200,80,0.2)',lw*0.3);
      S([[torsoCX-torsoW*0.52,beltY+2*s],[torsoCX+torsoW*0.52,beltY+2*s]],'rgba(255,200,80,0.2)',lw*0.3);
      // Central buckle
      X.fillStyle='rgba(255,200,80,0.3)';X.beginPath();
      X.arc(torsoCX,beltY,5*s,0,Math.PI*2);X.fill();
      X.strokeStyle='rgba(255,200,80,0.6)';X.lineWidth=lw*0.6;X.beginPath();
      X.arc(torsoCX,beltY,5*s,0,Math.PI*2);X.stroke();
      // Eagle on buckle
      X.strokeStyle='rgba(255,220,120,0.3)';X.lineWidth=lw*0.3;
      X.beginPath();X.moveTo(torsoCX,beltY-3*s);
      X.quadraticCurveTo(torsoCX+4*s,beltY-1*s,torsoCX+2*s,beltY+2*s);

      // Hanging strips (pteryges) — more of them, with gold tips
      for(var bi=0;bi<7;bi++){

      // Cross guard
      S([[glX-2*s,glY-2*s],[glX+5*s,glY-2*s]],'rgba(255,200,80,0.4)',lw*0.8);
      // Pommel — golden orb
      X.fillStyle='rgba(255,200,80,0.3)';X.beginPath();X.arc(glX+3*s,glY-11*s,2.5*s,0,Math.PI*2);X.fill();
      X.strokeStyle='rgba(255,200,80,0.5)';X.lineWidth=lw*0.4;X.beginPath();X.arc(glX+3*s,glY-11*s,2.5*s,0,Math.PI*2);X.stroke();

      // Caligae — Roman boots
      for(var cb=0;cb<2;cb++){

    } else {
      // === PALUDAMENTUM — Imperial purple commander's cloak ===

      ],'rgba(0,0,0,0.5)');
      X.globalAlpha=1;

      // Main cloak — imperial purple, grand sweep
      var palWave=Math.sin(t*0.8)*4*s;
      var palWave2=Math.cos(t*0.6)*3*s;
      F([
        [torsoCX-torsoW*0.9,torsoCY-torsoH2*0.55-clothElev],
        [torsoCX+torsoW*0.35,torsoCY-torsoH2*0.6-clothElev],

         torsoCX+torsoW*0.8,torsoCY+torsoH2*0.25-clothElev-palWave2,

      ],'rgba(100,25,85,0.15)',lw*0.5);
      S([
        [torsoCX-torsoW*0.4,torsoCY+torsoH2*0.2-clothElev+palWave*1.2,
         torsoCX-torsoW*0.1,torsoCY+torsoH2*0.5-clothElev-palWave2*1.2,

      ],'rgba(100,25,85,0.12)',lw*0.5);

      // Gold border — double line along entire edge
      S([
        [torsoCX-torsoW*0.9,torsoCY-torsoH2*0.55-clothElev,
         torsoCX-torsoW*1.0,torsoCY-clothElev-palWave,
         torsoCX-torsoW*0.5,torsoCY+torsoH2*0.8-clothElev-palWave2,
         torsoCX+torsoW*0.1,torsoCY+torsoH2*0.85-clothElev+palWave]
      ],'rgba(255,200,80,0.35)',lw*0.8);
      S([
        [torsoCX+torsoW*0.35,torsoCY-torsoH2*0.6-clothElev,
         torsoCX+torsoW*0.9,torsoCY+torsoH2*0.15-clothElev+palWave,
         torsoCX+torsoW*0.7,torsoCY+torsoH2*0.9-clothElev-palWave2]
      ],'rgba(255,200,80,0.35)',lw*0.8);
      // Inner gold line
      S([
        [torsoCX-torsoW*0.85,torsoCY-torsoH2*0.5-clothElev,
         torsoCX-torsoW*0.95,torsoCY+torsoH2*0.05-clothElev-palWave,
         torsoCX-torsoW*0.45,torsoCY+torsoH2*0.75-clothElev-palWave2]
      ],'rgba(255,200,80,0.15)',lw*0.4);

      // Purple stripe pattern along border
      for(var ps=0;ps<8;ps++){
        var psF=ps/8;
        var psX=torsoCX-torsoW*0.9+torsoW*(0.05+psF*0.15);

      // Center gem — deep red
      X.fillStyle='rgba(200,30,30,0.4)';X.beginPath();X.arc(fibX,fibY,2.5*s,0,Math.PI*2);X.fill();
      // Rays
      for(var fr2=0;fr2<12;fr2++){
        var frA2=fr2*Math.PI/6;

        S([[fibX+Math.cos(frA2)*7*s,fibY+Math.sin(frA2)*7*s,

      var crestBaseY=headY-headElev-headR-1*s;

      for(var cp=0;cp<12;cp++){

          [cbX2+legW/2+3*s,legTop+legH2+7*s],[cbX2-legW/2-3*s,legTop+legH2+7*s]

        S([
          [cbX2-legW/2-2*s,legTop+legH2-8*s],[cbX2+legW/2+2*s,legTop+legH2-8*s],

        ],'rgba(160,120,60,0.4)',lw*0.7);

        // Gold buckle
        X.fillStyle='rgba(255,200,80,0.3)';X.beginPath();

    }
  }

  // ====== FLOATING φ-PRIMITIVES around figure ======
  // Orbiting geometric shapes at golden ratio distances

  // Orbit 1 — small circles
  for(var i1=0;i1<5;i1++){
    var a1=i1*Math.PI*2/5+t*0.3;
    var r1=headR*2.5;
    var ox1=cx+Math.cos(a1)*r1;
    var oy1=cy-H*0.05+Math.sin(a1)*r1*0.6;
    var oR1=s*4+Math.sin(t+i1)*s*2;
    var oElev1=shH*(0.5+Math.sin(t*2+i1)*0.3);

    X.globalAlpha=0.12;X.fillStyle='rgba(0,0,0,0.8)';X.beginPath();X.arc(ox1+1*s,oy1+oElev1+2*s,oR1,0,Math.PI*2);X.fill();X.globalAlpha=1;
    X.fillStyle='rgba(255,200,100,0.08)';X.beginPath();X.arc(ox1,oy1-oElev1,oR1,0,Math.PI*2);X.fill();
    X.strokeStyle='rgba(255,200,80,0.35)';X.lineWidth=lw*0.6;X.beginPath();X.arc(ox1,oy1-oElev1,oR1,0,Math.PI*2);X.stroke();
  }

  // Orbit 2 — triangles
  for(var i2=0;i2<3;i2++){
    var a2=i2*Math.PI*2/3+t*0.2+1;
    var r2=headR*4;
    var ox2=cx+Math.cos(a2)*r2;
    var oy2=cy+Math.sin(a2)*r2*0.5;

    X.globalAlpha=0.1;F([
      [ox2+1*s,oy2+oElev2*0.3+tR2*0.3],
      [ox2-tR2+1*s,oy2+oElev2*0.3-tR2*0.2],
      [ox2+tR2+1*s,oy2+oElev2*0.3-tR2*0.2]
    ],'rgba(0,0,0,0.7)');X.globalAlpha=1;

      [ox2,oy2-oElev2-tR2*0.4],
      [ox2-tR2,oy2-oElev2+tR2*0.3],
      [ox2+tR2,oy2-oElev2+tR2*0.3]
    ],'rgba(220,100,50,0.06)');
    S([
      [ox2,oy2-oElev2-tR2*0.4],
      [ox2-tR2,oy2-oElev2+tR2*0.3],
      [ox2+tR2,oy2-oElev2+tR2*0.3]
    ],'rgba(240,130,70,0.35)',lw*0.7);
  }

  // Orbit 3 — rectangles (squares)
  for(var i3=0;i3<4;i3++){
    var a3=i3*Math.PI/2+t*0.15+0.5;
    var r3=headR*3.2;
    var ox3=cx+Math.cos(a3)*r3;
    var oy3=cy+Math.sin(a3)*r3*0.4;
    var sqR=s*6+Math.sin(t*0.8+i3)*s*2;
    var oElev3=shH*(0.3+Math.sin(t+i3)*0.15);

    X.globalAlpha=0.1;X.fillStyle='rgba(0,0,0,0.7)';X.fillRect(ox3-sqR+1*s,oy3+oElev3-sqR+2*s,sqR*2,sqR*2);X.globalAlpha=1;
    F([
      [ox3-sqR,oy3-oElev3-sqR],[ox3+sqR,oy3-oElev3-sqR],
      [ox3+sqR,oy3-oElev3+sqR],[ox3-sqR,oy3-oElev3+sqR]
    ],'rgba(80,150,200,0.06)');
    S([
      [ox3-sqR,oy3-oElev3-sqR],[ox3+sqR,oy3-oElev3-sqR],
      [ox3+sqR,oy3-oElev3+sqR],[ox3-sqR,oy3-oElev3+sqR]
    ],'rgba(100,170,220,0.3)',lw*0.6);
  }

  // ====== φ LABELS ======
  X.globalAlpha=0.08;X.font=(10*s)+'px monospace';X.fillStyle='rgba(255,200,50,0.5)';X.textAlign='center';
  X.fillText('φ = 1.618',cx,cy+H*0.42);
  X.fillText('голова: r',headX,headY-headElev-headR-8*s);
  X.fillText('торс: r·φ',torsoCX,torsoCY-torsoH2*0.55-torsoElev-8*s);
  X.fillText('нога: h/φ',legLX,legTop-8*s);
  X.textAlign='left';
  X.globalAlpha=1;

  // ====== CONNECTING LINES — golden ratio proportions ======
  X.globalAlpha=0.06;
  // Head to torso
  S([[headX,headY-headElev+headR],[torsoCX,torsoCY-torsoH2*0.55-torsoElev]],'rgba(255,200,50,0.4)',lw*0.3);
  // Torso to legs
  S([[torsoCX-torsoW*0.25,torsoCY+torsoH2*0.5-torsoElev],[legLX,legTop]],'rgba(255,200,50,0.4)',lw*0.3);
  S([[torsoCX+torsoW*0.25,torsoCY+torsoH2*0.5-torsoElev],[legRX,legTop]],'rgba(255,200,50,0.4)',lw*0.3);
  X.globalAlpha=1;

  // ====== FLOATING DUST ======
  for(var di=0;di<20;di++){
    var dx=cx+Math.sin(t*0.15+di*2.2)*W*0.4;
    var dy=cy+Math.cos(t*0.12+di*1.8)*H*0.4;
    var dr=0.4+Math.sin(t+di)*0.3;
    X.fillStyle='rgba(255,220,160,'+(0.03+0.02*Math.sin(t*1.5+di))+')';
    X.beginPath();X.arc(dx,dy,dr*s,0,Math.PI*2);X.fill();
  }

  requestAnimationFrame(draw);
}

// Helper: named color function for mouth
function c8a(a){return 'rgba(200,120,60,'+a+')';}

draw();
</script>
