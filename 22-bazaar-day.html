<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>22 — Базарный День — PolyArt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1008;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#aaa;font-size:9px;text-transform:uppercase;letter-spacing:1.5px}
.ctrl input[type=range]{width:90px;accent-color:#fc0;cursor:pointer}
.ctrl .val{color:#ddd;font-size:11px;font-weight:bold}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:16px;letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 20px #fc05;z-index:10}
#info{position:absolute;top:42px;left:50%;transform:translateX(-50%);color:#666;font-size:9px;letter-spacing:2px;z-index:10}
button.tog{background:none;border:1px solid #fc0;color:#fc0;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Базарный День</div>
<div id="info">По CV-анализу — Три плана — Горизонтали навесов — Вертикали столбов — Круги фруктов — Волны тканей</div>
<div id="ui">
<div class="ctrl"><label>Обводка</label><input type="range" id="lw" min="0" max="3" value="1" step="0.5"><span class="val" id="lwV">1</span></div>
<div class="ctrl"><label>Время</label><button class="tog" id="togT">УТРО</button></div>
<div class="ctrl"><label>План</label><button class="tog" id="togP">ВСЁ</button></div>
</div>
<script>
var C=document.getElementById('c'),X=C.getContext('2d'),W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);
document.getElementById('lw').oninput=function(){document.getElementById('lwV').textContent=this.value;};

var timeOfDay=0;var timeNames=['УТРО','ДЕНЬ','ВЕЧЕР'];
document.getElementById('togT').onclick=function(){timeOfDay=(timeOfDay+1)%3;this.textContent=timeNames[timeOfDay];};

var depthMode=0;var depthNames=['ВСЁ','ДАЛЬНИЙ','СРЕДНИЙ','ПЕРЕДНИЙ'];
document.getElementById('togP').onclick=function(){depthMode=(depthMode+1)%4;this.textContent=depthNames[depthMode];};

var PHI=1.618033988749895;
var t=0;

function F(pts,c){X.fillStyle=c;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.fill();}
function S(pts,c,w){if(w<=0)return;X.strokeStyle=c;X.lineWidth=w;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.stroke();}

// Fruit parametric
function drawFruit(x,y,r,type,t2){
  var pulse=1+Math.sin(t2*2+type)*0.02;
  r*=pulse;
  if(type===0){
    X.fillStyle='rgba(200,50,40,0.18)';X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.fill();
    X.strokeStyle='rgba(220,70,50,0.45)';X.lineWidth=0.8;X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.stroke();
    S([[x,y-r*0.8],[x+r*0.1,y-r*1.3]],'rgba(100,80,40,0.3)',0.5);
    X.fillStyle='rgba(255,255,255,0.1)';X.beginPath();X.arc(x-r*0.2,y-r*0.3,r*0.3,0,Math.PI*2);X.fill();
  }else if(type===1){
    X.fillStyle='rgba(240,160,40,0.18)';X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.fill();
    X.strokeStyle='rgba(240,170,50,0.45)';X.lineWidth=0.8;X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.stroke();
    for(var od=0;od<5;od++){var oa=od*Math.PI*2/5;X.fillStyle='rgba(220,140,30,0.08)';X.beginPath();X.arc(x+Math.cos(oa)*r*0.5,y+Math.sin(oa)*r*0.5,r*0.08,0,Math.PI*2);X.fill();}
  }else if(type===2){
    for(var gi=0;gi<7;gi++){var ga=gi*Math.PI*2/7+Math.sin(gi*1.3)*0.5;var gr=r*0.35+Math.sin(gi)*r*0.1;X.fillStyle='rgba(120,40,140,0.14)';X.beginPath();X.arc(x+Math.cos(ga)*r*0.5,y+Math.sin(ga)*r*0.5,gr,0,Math.PI*2);X.fill();X.strokeStyle='rgba(140,60,160,0.3)';X.lineWidth=0.5;X.beginPath();X.arc(x+Math.cos(ga)*r*0.5,y+Math.sin(ga)*r*0.5,gr,0,Math.PI*2);X.stroke();}
    S([[x,y-r*0.8],[x,y-r*1.2]],'rgba(80,120,40,0.3)',0.4);
    X.fillStyle='rgba(80,140,50,0.1)';X.beginPath();X.moveTo(x,y-r*1.1);X.quadraticCurveTo(x+r*0.6,y-r*1.5,x+r*0.4,y-r*1);X.quadraticCurveTo(x+r*0.2,y-r*0.9,x,y-r*1.1);X.fill();
  }else if(type===3){
    X.fillStyle='rgba(50,150,60,0.12)';X.beginPath();X.arc(x,y,r,0,Math.PI);X.fill();
    X.strokeStyle='rgba(60,170,70,0.4)';X.lineWidth=0.8;X.beginPath();X.arc(x,y,r,0,Math.PI);X.stroke();
    X.fillStyle='rgba(200,50,50,0.12)';X.beginPath();X.arc(x,y,r*0.8,0.1,Math.PI-0.1);X.fill();
    for(var si=0;si<4;si++){var sa=0.3+si*Math.PI*0.18;X.fillStyle='rgba(30,20,10,0.15)';X.beginPath();X.ellipse(x+Math.cos(sa)*r*0.5,y+Math.sin(sa)*r*0.4,1,0.5,sa,0,Math.PI*2);X.fill();}
  }else{
    X.strokeStyle='rgba(240,220,60,0.4)';X.lineWidth=r*0.4;X.beginPath();X.arc(x+r*0.5,y+r,r,Math.PI*1.2,Math.PI*1.8);X.stroke();
    X.strokeStyle='rgba(240,230,80,0.15)';X.lineWidth=r*0.3;X.beginPath();X.arc(x+r*0.5,y+r,r,Math.PI*1.25,Math.PI*1.75);X.stroke();
  }
}

// Fabric
function drawFabric(x,y,w,h,pattern,t2){
  var wave=Math.sin(t2*0.5)*2;
  var cols={red:['rgba(180,40,40,0.1)','rgba(200,50,50,0.4)'],blue:['rgba(40,60,140,0.1)','rgba(50,70,160,0.4)'],green:['rgba(40,120,60,0.1)','rgba(50,140,70,0.4)'],gold:['rgba(200,170,40,0.1)','rgba(220,190,50,0.4)'],purple:['rgba(120,40,120,0.1)','rgba(140,50,140,0.4)']};
  var c=cols[pattern]||cols.red;
  F([x,y,x+w*0.1,y+h*0.3+wave,x+w*0.9,y+h*0.3-wave,x+w,y+h*0.2,x+w*0.8,y+h,x+w*0.2,y+h+wave*0.5,x,y+h*0.8],c[0]);
  S([x,y,x+w*0.1,y+h*0.3+wave,x+w*0.9,y+h*0.3-wave,x+w,y+h*0.2,x+w*0.8,y+h,x+w*0.2,y+h+wave*0.5,x,y+h*0.8],c[1],0.8);
  for(var fl=0;fl<3;fl++){var fy=y+h*(0.2+fl*0.25);S([x+w*0.1,fy+wave*(fl%2===0?1:-1),x+w*0.5,fy+wave*(fl%2===0?-1:1),x+w*0.9,fy+wave*(fl%2===0?1:-1)],c[1].replace('0.4','0.15'),0.4);}
  if(pattern==='gold'){for(var di=0;di<3;di++){var dx=x+w*0.2+di*w*0.3;var dy=y+h*0.3+Math.sin(di)*h*0.1;F([[dx,dy-3],[dx+3,dy],[dx,dy+3],[dx-3,dy]],'rgba(255,200,80,0.08)');S([[dx,dy-3],[dx+3,dy],[dx,dy+3],[dx-3,dy]],'rgba(255,200,80,0.25)',0.3);}}
}

// Person
function drawPerson(x,y,s2,pos,col){
  var baseY=y;
  var ll=pos.legLen||25;
  S([x+pos.x-ll*Math.sin(pos.legL)*0.3,baseY,x+pos.x-ll*Math.sin(pos.legL)*0.15,baseY-ll*0.5,x+pos.x,baseY-ll],col,1.2);
  S([x+pos.x+ll*Math.sin(pos.legR)*0.3,baseY,x+pos.x+ll*Math.sin(pos.legR)*0.15,baseY-ll*0.5,x+pos.x+ll*0.05,baseY-ll],col,1.2);
  var tTop=baseY-ll;
  S([x+pos.x+pos.lean*s2*2,tTop,x+pos.x+pos.lean*s2*4,tTop-pos.torsoH*s2],col,1.2);
  var shX=x+pos.x+pos.lean*s2*4,shY=tTop-pos.torsoH*s2*0.1,al=pos.armLen*s2;
  S([shX-s2*7,shY,shX-s2*7-Math.cos(pos.armL)*al*0.5,shY-Math.sin(pos.armL)*al*0.5,shX-s2*7-Math.cos(pos.armL)*al,shY-Math.sin(pos.armL)*al],col,1);
  S([shX+s2*7,shY,shX+s2*7+Math.cos(pos.armR)*al*0.5,shY-Math.sin(pos.armR)*al*0.5,shX+s2*7+Math.cos(pos.armR)*al,shY-Math.sin(pos.armR)*al],col,1);
  var hr=pos.headR||5,hx=shX+pos.headTilt*s2*3,hy=shY-pos.torsoH*s2*0.3-hr*s2*1.5;
  X.fillStyle=col;X.globalAlpha=0.1;X.beginPath();X.arc(hx,hy,hr*s2,0,Math.PI*2);X.fill();X.globalAlpha=1;
  X.strokeStyle=col;X.lineWidth=0.8;X.beginPath();X.arc(hx,hy,hr*s2,0,Math.PI*2);X.stroke();
  if(pos.hat){S([hx-hr*s2*1.5,hy+hr*s2*0.2,hx-hr*s2*0.3,hy-hr*s2*1.2,hx+hr*s2*0.3,hy-hr*s2*1.2,hx+hr*s2*1.5,hy+hr*s2*0.2],pos.hatCol||col,0.6);}
  if(pos.carry){var cy2=shY-Math.sin(pos.armR)*al,cx2=shX+s2*7+Math.cos(pos.armR)*al;if(pos.carry==='basket'){S([cx2-5,cy2,cx2+5,cy2],'rgba(160,120,60,0.3)',0.6);S([cx2-4,cy2,cx2-3,cy2+4],'rgba(160,120,60,0.25)',0.5);S([cx2+4,cy2,cx2+3,cy2+4],'rgba(160,120,60,0.25)',0.5);}else if(pos.carry==='box'){F([cx2-5,cy2-3,cx2+5,cy2-3,cx2+5,cy2+2,cx2-5,cy2+2],'rgba(140,120,80,0.1)');S([cx2-5,cy2-3,cx2+5,cy2-3,cx2+5,cy2+2,cx2-5,cy2+2],'rgba(160,140,100,0.3)',0.5);}}
}

// Awning (horizontal strip with stripes)
function drawAwning(x,y,w,h,color,t2){
  var droop=Math.sin(t2*0.3)*1;
  F([x,y,x+w,y,x+w*1.05,y+h+droop,x-0.02*w,y+h-droop],color+'0.08)');
  S([x,y,x+w,y,x+w*1.05,y+h+droop,x-0.02*w,y+h-droop],color+'0.4)',0.8);
  for(var st=0;st<Math.floor(w/(W*0.035));st++){
    var sx=x+w*0.05+st*w*0.2;
    S([[sx,y+1],[sx+w*0.08,y+h-1+droop*(st%2===0?1:-1)]],'rgba(255,255,255,0.05)',0.3);
  }
  // Support poles
  S([[x,y+h],[x,y+h*2.5]],'rgba(140,120,80,0.25)',0.5);
  S([[x+w,y+h+droop],[x+w,y+h*2.5+droop]],'rgba(140,120,80,0.25)',0.5);
}

function draw(){
  var lw=parseFloat(document.getElementById('lw').value);
  t+=0.016;

  // Background — warm atmospheric
  if(timeOfDay===0){
    X.fillStyle='#1a1208';X.fillRect(0,0,W,H);
    var sg=X.createRadialGradient(W*0.85,H*0.12,0,W*0.85,H*0.12,W*0.5);
    sg.addColorStop(0,'rgba(255,200,100,0.1)');sg.addColorStop(1,'rgba(255,180,80,0)');
    X.fillStyle=sg;X.fillRect(0,0,W,H);
  }else if(timeOfDay===1){
    X.fillStyle='#1e1510';X.fillRect(0,0,W,H);
    var sg2=X.createRadialGradient(W*0.5,H*0.05,0,W*0.5,H*0.05,W*0.5);
    sg2.addColorStop(0,'rgba(255,230,150,0.12)');sg2.addColorStop(1,'rgba(255,220,120,0)');
    X.fillStyle=sg2;X.fillRect(0,0,W,H);
  }else{
    X.fillStyle='#1a0a08';X.fillRect(0,0,W,H);
    var sg3=X.createRadialGradient(W*0.9,H*0.3,0,W*0.9,H*0.3,W*0.5);
    sg3.addColorStop(0,'rgba(255,120,40,0.08)');sg3.addColorStop(1,'rgba(255,100,30,0)');
    X.fillStyle=sg3;X.fillRect(0,0,W,H);
  }

  var cx=W/2, cy=H*0.5, s=Math.min(W,H)/600;
  var floorY=cy+H*0.22;

  // Horizon line
  var horizonY=H*0.35;

  // ====== LAYER 1: FAR BACKGROUND (buildings, sky) ======
  if(depthMode===0||depthMode===1){
    // Distant buildings — faded rectangles
    X.globalAlpha=0.04;
    for(var bi=0;bi<8;bi++){
      var bx=bi*W/7;
      var bh=H*0.12+Math.sin(bi*2.3)*H*0.04;
      var bw=W/8;
      F([bx,horizonY-bh*0.3,bx+bw,horizonY-bh*0.3,bx+bw,horizonY,bx,horizonY],'rgba(180,160,140,0.3)');
      // Windows
      for(var wi=0;wi<3;wi++){
        var wy=horizonY-bh*0.15-wi*bh*0.08;
        X.fillStyle='rgba(200,180,140,0.15)';X.fillRect(bx+bw*0.3,wy,bw*0.15,bh*0.05);
      }
    }
    X.globalAlpha=1;

    // Distant awnings — small, faded
    for(var da=0;da<5;da++){
      var dax=W*0.1+da*W*0.18;
      var day=horizonY+H*0.02;
      drawAwning(dax,day,W*0.1,H*0.025,'rgba(180,100,80,',t+da);
    }
    X.globalAlpha=1;
  }

  // ====== LAYER 2: MIDGROUND (stalls, fabrics, main activity) ======
  if(depthMode===0||depthMode===2){
    var midY=floorY-H*0.02;

    // Awning row — 3 connected stalls
    var awColors=['rgba(200,60,40,','rgba(40,80,160,','rgba(180,140,40,'];
    for(var ai=0;ai<3;ai++){
      var awX=W*0.05+ai*W*0.3;
      var awY=midY-H*0.28;
      drawAwning(awX,awY,W*0.26,H*0.08,awColors[ai],t+ai*0.5);
    }

    // Counters
    for(var ci=0;ci<3;ci++){
      var cntX=W*0.05+ci*W*0.3;
      var cntY=midY;
      S([[cntX,cntY],[cntX+W*0.26,cntY]],'rgba(160,130,80,0.45)',lw);
      S([[cntX,cntY],[cntX,cntY-H*0.2]],'rgba(160,130,80,0.3)',lw*0.5);
      S([[cntX+W*0.26,cntY],[cntX+W*0.26,cntY-H*0.2]],'rgba(160,130,80,0.3)',lw*0.5);
      // Shelf
      S([[cntX,cntY-H*0.12],[cntX+W*0.26,cntY-H*0.12]],'rgba(140,110,70,0.2)',lw*0.3);
    }

    // Fruits on stalls
    var stallFruits=[
      [0,0,0,1,1,1,0,0], // stall 1 — apples + oranges
      [3,3,2,2,4,4,3],    // stall 2 — watermelon, grapes, banana
      [1,1,0,2,4,1]       // stall 3 — orange, apple, grape, banana
    ];
    for(var si=0;si<3;si++){
      var stX=W*0.05+si*W*0.3;
      var stY=midY;
      var fruits=stallFruits[si];
      for(var fi=0;fi<fruits.length;fi++){
        var fx=stX+W*0.02+fi*(W*0.26/(fruits.length+1));
        var fy=stY-H*0.04-Math.floor(fi/3)*H*0.06;
        var fr=3.5+Math.sin(fi*1.7)*0.5;
        drawFruit(fx,fy,fr*s,fruits[fi],t+fi+si);
      }
    }

    // Fabrics — hanging from central stall
    var fbX=W*0.35;
    var fbY=midY-H*0.25;
    S([[fbX,fbY],[fbX+W*0.22,fbY]],'rgba(140,120,80,0.4)',lw);
    var fabC=['red','blue','gold','green','purple','red','blue','gold'];
    for(var ffi=0;ffi<8;ffi++){
      var ffx=fbX+ffi*W*0.026;
      var ffh=H*0.14+Math.sin(ffi*1.3)*H*0.02;
      drawFabric(ffx,fbY,W*0.023,ffh,fabC[ffi],t+ffi*0.5);
    }

    // Second fabric row
    var fb2Y=fbY+H*0.16;
    S([[fbX+5,fb2Y],[fbX+W*0.18-5,fb2Y]],'rgba(140,120,80,0.3)',lw*0.5);
    var fabC2=['gold','purple','red','blue','green'];
    for(var ffi2=0;ffi2<5;ffi2++){
      drawFabric(fbX+5+ffi2*W*0.034,fb2Y,W*0.03,H*0.1+Math.sin(ffi2*2)*H*0.01,fabC2[ffi2],t+ffi2*0.7+0.5);
    }

    // People in midground
    var midPeople=[
      {x:W*0.12,lean:0.05,armL:Math.PI*0.5+Math.sin(t*0.7)*0.2,armR:Math.PI*0.5-Math.sin(t*0.7)*0.2,legL:Math.PI*0.5+Math.sin(t*0.7)*0.2,legR:Math.PI*0.5-Math.sin(t*0.7)*0.2,headTilt:0,torsoH:24,armLen:20,legLen:25,headR:5,col:'rgba(200,180,160,0.4)',hat:true,hatCol:'rgba(200,180,140,0.25)',carry:'basket'},
      {x:W*0.18,lean:0.1,armL:Math.PI*0.5-0.3,armR:Math.PI*0.5+0.4,legL:Math.PI*0.5,legR:Math.PI*0.5,headTilt:0.1,torsoH:24,armLen:20,legLen:25,headR:5,col:'rgba(180,160,140,0.4)',hat:true,hatCol:'rgba(160,140,100,0.2)'},
      {x:W*0.42,lean:-0.05,armL:Math.PI*0.5+0.5,armR:Math.PI*0.5-0.3,legL:Math.PI*0.5+Math.sin(t*0.5)*0.15,legR:Math.PI*0.5-Math.sin(t*0.5)*0.15,headTilt:-0.1,torsoH:24,armLen:20,legLen:24,headR:5,col:'rgba(200,160,140,0.4)',carry:'box'},
      {x:W*0.68,lean:0.15,armL:Math.PI*0.5-0.2,armR:Math.PI*0.5+0.8,legL:Math.PI*0.5+Math.sin(t*0.3)*0.1,legR:Math.PI*0.5-Math.sin(t*0.3)*0.1,headTilt:0.2,torsoH:22,armLen:20,legLen:24,headR:5,col:'rgba(170,160,150,0.4)',hat:true,hatCol:'rgba(140,130,120,0.2)'},
      {x:W*0.82,lean:0.02,armL:Math.PI*0.5+0.1,armR:Math.PI*0.5-0.1,legL:Math.PI*0.5+Math.sin(t*0.6)*0.15,legR:Math.PI*0.5-Math.sin(t*0.6)*0.15,headTilt:0,torsoH:26,armLen:20,legLen:28,headR:5,col:'rgba(190,170,150,0.4)',carry:'box'}
    ];
    for(var mpi=0;mpi<midPeople.length;mpi++){
      var mpp=midPeople[mpi];
      X.globalAlpha=0.08;X.fillStyle='rgba(0,0,0,0.5)';X.beginPath();X.ellipse(mpp.x+3*s,floorY+3*s,10*s,3*s,0,0,Math.PI*2);X.fill();X.globalAlpha=1;
      drawPerson(mpp.x,floorY,s,mpp,mpp.col);
    }
  }

  // ====== LAYER 3: FOREGROUND (close elements) ======
  if(depthMode===0||depthMode===3){
    // Foreground fruit basket — large, close
    var fgX=W*0.08;
    var fgY=floorY+H*0.05;
    // Basket
    X.strokeStyle='rgba(160,120,60,0.3)';X.lineWidth=0.8;
    S([[fgX-15,fgY,fgX+15,fgY]],'rgba(160,120,60,0.35)',0.8);
    S([[fgX-12,fgY,fgX-10,fgY+10]],'rgba(160,120,60,0.3)',0.6);
    S([[fgX+12,fgY,fgX+10,fgY+10]],'rgba(160,120,60,0.3)',0.6);
    S([[fgX-10,fgY+10,fgX+10,fgY+10]],'rgba(160,120,60,0.25)',0.5);
    // Woven pattern
    for(var wp=0;wp<4;wp++){
      var wy=fgY+2+wp*2.5;
      S([[fgX-12+wp,wy],[fgX+12-wp,wy]],'rgba(140,100,50,0.12)',0.3);
    }
    // Fruits in basket
    drawFruit(fgX-5,fgY-3,4*s,0,t);
    drawFruit(fgX+3,fgY-4,3.5*s,1,t+0.5);
    drawFruit(fgX-1,fgY-7,3*s,4,t+1);

    // Foreground fabric drape — right side
    var fgFbX=W*0.88;
    var fgFbY=floorY-H*0.1;
    drawFabric(fgFbX,fgFbY,W*0.06,H*0.2,'red',t);
    drawFabric(fgFbX+W*0.07,fgFbY-H*0.02,W*0.05,H*0.18,'gold',t+0.5);

    // Foreground person — close, larger
    var fgPerson={x:W*0.92,lean:0.03,armL:Math.PI*0.5+Math.sin(t*0.5)*0.15,armR:Math.PI*0.5-Math.sin(t*0.5)*0.15+0.3,legL:Math.PI*0.5+Math.sin(t*0.5)*0.2,legR:Math.PI*0.5-Math.sin(t*0.5)*0.2,headTilt:-0.05,torsoH:28,armLen:24,legLen:30,headR:6,col:'rgba(200,180,170,0.4)'};
    drawPerson(fgPerson.x,floorY-H*0.08,s*1.1,fgPerson,fgPerson.col);

    // Child running — foreground
    var child={x:W*0.5,lean:0.2,armL:Math.PI*0.5+Math.sin(t*2)*0.5,armR:Math.PI*0.5-Math.sin(t*2)*0.5,legL:Math.PI*0.5+Math.sin(t*2)*0.4,legR:Math.PI*0.5-Math.sin(t*2)*0.4,headTilt:0.1,torsoH:20,armLen:16,legLen:20,headR:5,col:'rgba(220,200,180,0.45)'};
    drawPerson(child.x,floorY+H*0.02,s*0.9,child,child.col);

    // Couple walking — far right
    var cp1={x:W*0.72,lean:0.03,armL:Math.PI*0.5+Math.sin(t*0.5)*0.15,armR:Math.PI*0.5-Math.sin(t*0.5)*0.15+0.3,legL:Math.PI*0.5+Math.sin(t*0.5)*0.2,legR:Math.PI*0.5-Math.sin(t*0.5)*0.2,headTilt:-0.05,torsoH:24,armLen:20,legLen:26,headR:5,col:'rgba(200,180,170,0.35)'};
    var cp2={x:W*0.74,lean:-0.03,armL:Math.PI*0.5+Math.sin(t*0.5)*0.15-0.3,armR:Math.PI*0.5-Math.sin(t*0.5)*0.15,legL:Math.PI*0.5+Math.sin(t*0.5)*0.2,legR:Math.PI*0.5-Math.sin(t*0.5)*0.2,headTilt:0.05,torsoH:22,armLen:18,legLen:24,headR:4.5,col:'rgba(200,170,160,0.35)'};
    drawPerson(cp1.x,floorY-H*0.05,s,cp1,cp1.col);
    drawPerson(cp2.x,floorY-H*0.05,s,cp2,cp2.col);
  }

  // ====== SUNLIGHT RAYS ======
  if(timeOfDay<2){
    X.globalAlpha=0.015+Math.sin(t*0.3)*0.005;
    var sunX=timeOfDay===0?W*0.85:W*0.5;
    for(var sr=0;sr<6;sr++){
      var srA=sr*0.12-0.35;
      var srLen2=H*0.7;
      S([sunX,0,sunX+Math.cos(srA+Math.PI*0.5)*srLen2*0.08,srLen2*0.25,sunX+Math.cos(srA+Math.PI*0.5)*srLen2*0.25,srLen2],'rgba(255,220,150,0.3)',lw*0.15);
    }
    X.globalAlpha=1;
  }

  // ====== DUST MOTES ======
  for(var dm=0;dm<25;dm++){
    var dmx=Math.sin(t*0.1+dm*2.3)*W*0.4+W*0.5;
    var dmy=cy+Math.cos(t*0.08+dm*1.7)*H*0.35;
    var dmr=0.3+Math.sin(t+dm)*0.15;
    X.fillStyle='rgba(255,220,160,'+(0.015+0.01*Math.sin(t*1.3+dm))+')';
    X.beginPath();X.arc(dmx,dmy,dmr*s,0,Math.PI*2);X.fill();
  }

  // ====== LABELS ======
  X.globalAlpha=0.06;X.font=(8*s)+'px serif';X.fillStyle='rgba(255,220,180,0.5)';X.textAlign='center';
  X.fillText(depthNames[depthMode]+' — '+timeNames[timeOfDay],cx,H-18*s);
  X.textAlign='left';X.globalAlpha=1;

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
