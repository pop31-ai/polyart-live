<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Root Garden</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a05;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#title{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:20px;letter-spacing:6px;text-transform:uppercase;text-shadow:0 0 20px #0f8,0 0 40px #0a5;z-index:10}
#ui{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10;flex-wrap:wrap;justify-content:center}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:3px}
.ctrl label{color:#8f8;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;text-shadow:0 0 4px #0a0}
.ctrl input[type=range]{width:100px;accent-color:#0f8;cursor:pointer}
.ctrl .val{color:#0f8;font-size:12px;font-weight:bold;text-shadow:0 0 6px #0f8}
#presets{position:absolute;top:16px;right:16px;z-index:10;display:flex;gap:6px;flex-wrap:wrap;max-width:220px;justify-content:flex-end}
.pb{padding:4px 10px;background:rgba(0,255,100,0.06);border:1px solid #0f83;color:#0f8;font-size:9px;cursor:pointer;border-radius:3px;text-transform:uppercase;letter-spacing:1px;transition:all .2s}
.pb:hover{background:rgba(0,255,100,0.2);text-shadow:0 0 6px #0f8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Root Garden</div>
<div id="presets">
<button class="pb" onclick="lp(0)">Роза</button>
<button class="pb" onclick="lp(1)">Лотос</button>
<button class="pb" onclick="lp(2)">Сад</button>
<button class="pb" onclick="lp(3)">Вихрь</button>
</div>
<div id="ui">
<div class="ctrl"><label>Степень</label><input type="range" id="deg" min="2" max="12" value="5"><span class="val" id="degV">5</span></div>
<div class="ctrl"><label>Лепестки</label><input type="range" id="pet" min="2" max="20" value="6"><span class="val" id="petV">6</span></div>
<div class="ctrl"><label>Рост</label><input type="range" id="grow" min="1" max="100" value="50"><span class="val" id="growV">0.50</span></div>
<div class="ctrl"><label>Ветер</label><input type="range" id="wind" min="0" max="100" value="30"><span class="val" id="windV">0.30</span></div>
<div class="ctrl"><label>Глубина</label><input type="range" id="depth" min="1" max="10" value="4"><span class="val" id="depthV">4</span></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

const S={deg:'degV',pet:'petV',grow:'growV',wind:'windV',depth:'depthV'};
Object.keys(S).forEach(k=>{
  document.getElementById(k).addEventListener('input',()=>{
    const v=parseFloat(document.getElementById(k).value);
    let t=v+'';if(k==='grow'||k==='wind')t=(v/100).toFixed(2);
    document.getElementById(S[k]).textContent=t;
  });
});

const presets=[
  {deg:5,pet:6,grow:50,wind:30,depth:4},
  {deg:8,pet:12,grow:40,wind:20,depth:5},
  {deg:6,pet:8,grow:60,wind:40,depth:3},
  {deg:10,pet:16,grow:70,wind:50,depth:6},
];
function lp(i){const p=presets[i];Object.keys(p).forEach(k=>{document.getElementById(k).value=p[k];document.getElementById(k).dispatchEvent(new Event('input'));});}

function gv(id){return parseFloat(document.getElementById(id).value)}

function solveRoots(coeffs){
  const n=coeffs.length-1;if(n<=0)return[];
  const roots=[];
  for(let att=0;att<n*25&&roots.length<n;att++){
    let re=(Math.random()-0.5)*6,im=(Math.random()-0.5)*6;
    for(let it=0;it<120;it++){
      let zr=re,zi=im,pr=1,pi=0,fr=0,fi=0;
      for(let k=n;k>=0;k--){
        const nr=fr*zr-fi*zi+coeffs[k],ni=fr*zi+fi*zr;
        fr=nr;fi=ni;
        if(k>0){const t=pr*zr-pi*zi;pi=pr*zi+pi*zr;pr=t;}
      }
      const d=pr*pr+pi*pi;if(d<1e-22)break;
      re-=(fr*pr+fi*pi)/d;im-=(fi*pr-fr*pi)/d;
    }
    let ok=true;
    for(const r of roots)if(Math.hypot(re-r[0],im-r[1])<0.08){ok=false;break;}
    if(ok&&Math.hypot(re,im)<20)roots.push([re,im]);
  }
  return roots;
}

let t=0;
const petals=Array.from({length:60},()=>({a:Math.random()*Math.PI*2,r:Math.random()*0.5+0.3,s:Math.random()*2+1,h:Math.random()*120}));

function draw(){
  const deg=Math.round(gv('deg')),pet=Math.round(gv('pet')),grow=gv('grow')/100,wind=gv('wind')/100,depth=Math.round(gv('depth'));
  t+=0.016;

  X.fillStyle='rgba(5,10,5,0.04)';
  X.fillRect(0,0,W,H);

  const cx=W/2,cy=H/2,sc=Math.min(W,H)/10;

  const coeffs=[1];
  for(let i=0;i<deg;i++){
    const a=i*Math.PI*2/deg+t*0.15;
    const r=2+Math.sin(t*0.3+i)*0.8;
    coeffs.push(-(r*Math.cos(a)));
  }
  const roots=solveRoots(coeffs);

  roots.forEach((root,i)=>{
    const px=cx+root[0]*sc,py=cy-root[1]*sc;
    const d=Math.hypot(root[0],root[1]);
    const h=(120+i*30+d*20)%360;

    for(let p=0;p<pet;p++){
      const pa=p*Math.PI*2/pet+t*0.2+i*0.5;
      const pr2=sc*(0.8+0.3*Math.sin(t*1.5+p+i));
      const tipX=px+Math.cos(pa)*pr2*grow;
      const tipY=py+Math.sin(pa)*pr2*grow;
      const windOff=Math.sin(t*2+p*0.3+i)*wind*15;

      const cp1x=px+Math.cos(pa)*pr2*0.4*grow;
      const cp1y=py+Math.sin(pa)*pr2*0.4*grow;
      const cp2x=tipX+windOff*0.5;
      const cp2y=tipY-Math.abs(windOff)*0.3;

      const grad=X.createLinearGradient(px,py,tipX+windOff,tipY);
      grad.addColorStop(0,`hsla(${h},70%,50%,0.6)`);
      grad.addColorStop(0.5,`hsla(${h+20},80%,60%,0.3)`);
      grad.addColorStop(1,`hsla(${h+40},90%,70%,0.05)`);

      X.beginPath();
      X.moveTo(px,py);
      X.bezierCurveTo(cp1x+windOff*0.3,cp1y,cp2x,cp2y,tipX+windOff,tipY);
      const cp3x=tipX+Math.cos(pa+0.3)*pr2*0.5*grow+windOff*0.5;
      const cp3y=tipY+Math.sin(pa+0.3)*pr2*0.5*grow;
      const cp4x=px+Math.cos(pa+0.15)*pr2*0.3*grow;
      const cp4y=py+Math.sin(pa+0.15)*pr2*0.3*grow;
      X.bezierCurveTo(cp3x,cp3y,cp4x,cp4y,px,py);
      X.fillStyle=grad;X.fill();

      X.strokeStyle=`hsla(${h},60%,40%,0.15)`;X.lineWidth=0.5;X.stroke();
    }

    const pulse=1+0.3*Math.sin(t*3+i);
    const grad=X.createRadialGradient(px,py,0,px,py,8*pulse);
    grad.addColorStop(0,`hsla(${h+60},100%,90%,0.9)`);
    grad.addColorStop(0.5,`hsla(${h+40},90%,70%,0.3)`);
    grad.addColorStop(1,`hsla(${h+20},80%,40%,0)`);
    X.fillStyle=grad;X.beginPath();X.arc(px,py,8*pulse,0,Math.PI*2);X.fill();

    for(let l=0;l<depth;l++){
      const la=l*Math.PI*2/depth+t*0.1+i;
      const lr=sc*(0.5+l*0.3)*grow;
      const lx=px+Math.cos(la)*lr*0.3+Math.sin(t+l)*wind*5;
      const ly=py+Math.sin(la)*lr*0.3+Math.cos(t+l)*wind*3;
      X.strokeStyle=`hsla(${h+60+l*15},50%,40%,${0.08/l})`;X.lineWidth=0.8;
      X.beginPath();
      X.moveTo(px,py);
      X.quadraticCurveTo(lx,ly,px+Math.cos(la)*lr,py+Math.sin(la)*lr);
      X.stroke();
    }
  });

  for(let i=0;i<20;i++){
    const px=(Math.sin(t*0.1+i*3.1)*0.3+0.5)*W;
    const py=(1-((t*0.02+i*0.05)%1))*H;
    const s=1+Math.sin(t+i)*0.5;
    const h=(120+i*18)%360;
    X.fillStyle=`hsla(${h},80%,70%,${0.3*(1-py/H)})`;
    X.beginPath();X.arc(px,py,s,0,Math.PI*2);X.fill();
  }

  requestAnimationFrame(draw);
}

lp(0);draw();
</script>
</body>
</html>
