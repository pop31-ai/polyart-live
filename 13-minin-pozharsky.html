<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Минин и Пожарский — PolyArt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10;flex-wrap:wrap;justify-content:center}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#aaa;font-size:9px;text-transform:uppercase;letter-spacing:1.5px}
.ctrl input[type=range]{width:90px;accent-color:#999;cursor:pointer}
.ctrl .val{color:#ccc;font-size:11px;font-weight:bold}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:18px;letter-spacing:6px;text-transform:uppercase;text-shadow:0 0 20px #fff3;z-index:10}
#info{position:absolute;top:44px;left:50%;transform:translateX(-50%);color:#555;font-size:10px;letter-spacing:2px;z-index:10}
#preset{position:absolute;top:14px;right:14px;z-index:10;display:flex;gap:5px}
.pb{padding:3px 8px;background:rgba(255,255,255,0.04);border:1px solid #fff3;color:#aaa;font-size:8px;cursor:pointer;border-radius:3px;text-transform:uppercase;letter-spacing:1px}
.pb:hover,.pb.active{background:rgba(255,255,255,0.1);color:#fff}
#colorBtn{position:absolute;top:14px;left:14px;z-index:10;padding:4px 10px;background:rgba(255,255,255,0.04);border:1px solid #fff3;color:#aaa;font-size:9px;cursor:pointer;border-radius:3px;text-transform:uppercase;letter-spacing:1px}
#colorBtn.on{background:rgba(255,200,0,0.1);color:#fc0;border-color:#fc03}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Минин и Пожарский</div>
<div id="info">Полигоны и дуги — 1612</div>
<button id="colorBtn" onclick="toggleColor()">Цвет</button>
<div id="preset">
<button class="pb active" onclick="lp(0)">Памятник</button>
<button class="pb" onclick="lp(1)">Силуэт</button>
<button class="pb" onclick="lp(2)">Гравюра</button>
</div>
<div id="ui">
<div class="ctrl"><label>Толщина</label><input type="range" id="lw" min="0" max="5" value="1" step="0.5"><span class="val" id="lwV">1</span></div>
<div class="ctrl"><label>Свечение</label><input type="range" id="gl" min="0" max="100" value="40"><span class="val" id="glV">0.40</span></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

let col=false;
function toggleColor(){col=!col;document.getElementById('colorBtn').classList.toggle('on',col);}

document.getElementById('lw').oninput=function(){document.getElementById('lwV').textContent=this.value;};
document.getElementById('gl').oninput=function(){document.getElementById('glV').textContent=(this.value/100).toFixed(2);};

const presets=[
  {lw:1,gl:40,stroke:true,fill:true},
  {lw:0,gl:20,stroke:false,fill:true},
  {lw:2,gl:50,stroke:true,fill:false},
];
function lp(i){
  document.getElementById('lw').value=presets[i].lw;
  document.getElementById('lwV').textContent=presets[i].lw;
  document.getElementById('gl').value=presets[i].gl;
  document.getElementById('glV').textContent=(presets[i].gl/100).toFixed(2);
  document.querySelectorAll('.pb').forEach((b,j)=>b.classList.toggle('active',j===i));
}

let t=0;

function fillPoly(pts,color){
  X.fillStyle=color;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)X.lineTo(pts[i][0],pts[i][1]);
  X.closePath();X.fill();
}
function strokePoly(pts,color,w){
  if(w<=0)return;X.strokeStyle=color;X.lineWidth=w;X.beginPath();
  X.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)X.lineTo(pts[i][0],pts[i][1]);
  X.closePath();X.stroke();
}
function fillArc(cx,cy,r,start,end,color){
  X.fillStyle=color;X.beginPath();X.moveTo(cx,cy);
  X.arc(cx,cy,r,start,end);X.closePath();X.fill();
}
function fillEllipse(cx,cy,rx,ry,color){
  X.fillStyle=color;X.beginPath();X.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);X.fill();
}
function draw(){
  const lw=parseFloat(document.getElementById('lw').value);
  const gl=parseFloat(document.getElementById('gl').value)/100;
  t+=0.016;
  X.clearRect(0,0,W,H);
  X.fillStyle='#080810';X.fillRect(0,0,W,H);

  const cx=W/2,cy=H/2;
  const s=Math.min(W,H)/520;
  const BX=cx, BY=cy+50*s;

  const c1=col?'rgba(220,180,100,':'rgba(200,200,210,';
  const c2=col?'rgba(180,150,100,':'rgba(170,170,185,';
  const c3=col?'rgba(160,130,90,':'rgba(140,140,160,';
  const c4=col?'rgba(140,120,200,':'rgba(160,160,180,';
  const c5=col?'rgba(200,180,60,':'rgba(220,220,230,';

  // === PODIUM ===
  fillPoly([
    [BX-90*s,BY+30*s],[BX-70*s,BY+10*s],[BX-30*s,BY],[BX,BY-5*s],
    [BX+30*s,BY],[BX+70*s,BY+10*s],[BX+90*s,BY+30*s]
  ],c3('0.25)'));
  strokePoly([
    [BX-90*s,BY+30*s],[BX-70*s,BY+10*s],[BX-30*s,BY],[BX,BY-5*s],
    [BX+30*s,BY],[BX+70*s,BY+10*s],[BX+90*s,BY+30*s]
  ],c3('0.3)'),lw);

  // === POZHARSKY (right) ===
  var px=BX+40*s, py=BY-5*s;

  // Legs — two filled trapezoids
  fillPoly([[px-6*s,py],[px-2*s,py],[px+2*s,py-80*s],[px-4*s,py-80*s]],c1('0.4)'));
  fillPoly([[px+2*s,py],[px+8*s,py],[px+12*s,py-80*s],[px+6*s,py-80*s]],c1('0.35)'));
  strokePoly([[px-6*s,py],[px+8*s,py],[px+12*s,py-80*s],[px-4*s,py-80*s]],c1('0.2)'),lw*0.5);

  // Torso — filled polygon
  fillPoly([
    [px-4*s,py-80*s],[px+6*s,py-80*s],
    [px+14*s,py-110*s],[px+16*s,py-130*s],[px+12*s,py-145*s],
    [px-2*s,py-145*s],[px-10*s,py-130*s],[px-12*s,py-110*s]
  ],c1('0.5)'));
  strokePoly([
    [px-4*s,py-80*s],[px+6*s,py-80*s],
    [px+14*s,py-110*s],[px+16*s,py-130*s],[px+12*s,py-145*s],
    [px-2*s,py-145*s],[px-10*s,py-130*s],[px-12*s,py-110*s]
  ],c1('0.3)'),lw);

  // Armor line
  for(var i=0;i<4;i++){
    var ay=py-85*s-i*14*s;
    strokePoly([[px-9*s+i*s,ay],[px+10*s-i*s,ay]],c1('0.1)'),lw*0.3);
  }

  // Cape — filled triangle with wind
  var wf=Math.sin(t*1.5)*8*s;
  fillPoly([
    [px-8*s,py-140*s],[px-14*s,py-100*s],[px-20*s+wf,py-60*s],
    [px-30*s+wf*1.5,py-40*s],[px-15*s,py-100*s+10*s]
  ],c3('0.15)'));
  strokePoly([
    [px-8*s,py-140*s],[px-14*s,py-100*s],[px-20*s+wf,py-60*s],
    [px-30*s+wf*1.5,py-40*s]
  ],c3('0.15)'),lw*0.5);

  // Left arm — polygon down to shield
  fillPoly([
    [px-10*s,py-140*s],[px-16*s,py-130*s],[px-22*s,py-115*s],
    [px-26*s,py-100*s],[px-24*s,py-88*s],[px-18*s,py-88*s],
    [px-14*s,py-100*s],[px-10*s,py-115*s],[px-6*s,py-130*s]
  ],c1('0.4)'));
  strokePoly([[px-10*s,py-140*s],[px-26*s,py-100*s],[px-24*s,py-88*s],[px-6*s,py-130*s]],c1('0.25)'),lw*0.5);

  // SHIELD — filled hexagon
  var sx=px-30*s, sy=py-94*s;
  var shield=[
    [sx,sy-20*s],[sx+12*s,sy-14*s],[sx+12*s,sy+4*s],
    [sx,sy+20*s],[sx-12*s,sy+4*s],[sx-12*s,sy-14*s]
  ];
  fillPoly(shield,c4('0.35)'));
  strokePoly(shield,c4('0.4)'),lw);
  // Shield cross
  strokePoly([[sx,sy-18*s],[sx,sy+18*s]],c4('0.2)'),lw*0.5);
  strokePoly([[sx-10*s,sy-4*s],[sx+10*s,sy-4*s]],c4('0.2)'),lw*0.5);

  // Right arm up — polygon
  fillPoly([
    [px+8*s,py-140*s],[px+14*s,py-145*s],[px+20*s,py-155*s],
    [px+22*s,py-170*s],[px+18*s,py-175*s],[px+12*s,py-170*s],
    [px+6*s,py-155*s],[px+4*s,py-145*s]
  ],c1('0.4)'));
  strokePoly([[px+8*s,py-140*s],[px+22*s,py-170*s],[px+18*s,py-175*s],[px+4*s,py-145*s]],c1('0.25)'),lw*0.5);

  // SWORD — filled thin triangle + line
  var swx=px+18*s, swy=py-175*s;
  fillPoly([
    [swx-1*s,swy],[swx+1*s,swy],[swx,swy-70*s]
  ],c5('0.6)'));
  strokePoly([[swx,swy],[swx,swy-70*s]],c5('0.5)'),lw);
  // Guard
  strokePoly([[swx-6*s,swy+2*s],[swx+6*s,swy+2*s]],c5('0.4)'),lw);
  // Tip glow
  var tg=X.createRadialGradient(swx,swy-70*s,0,swx,swy-70*s,12*s);
  tg.addColorStop(0,'rgba(255,255,220,'+(0.15+0.1*Math.sin(t*3))+')');
  tg.addColorStop(1,'rgba(255,255,220,0)');
  X.fillStyle=tg;X.beginPath();X.arc(swx,swy-70*s,12*s,0,Math.PI*2);X.fill();

  // HEAD
  var hx=px+2*s, hy=py-152*s;
  fillEllipse(hx,hy,9*s,11*s,c1('0.5)'));
  strokePoly([[hx-9*s,hy],[hx,hy-11*s],[hx+9*s,hy],[hx,hy+11*s],[hx-9*s,hy]],c1('0.35)'),lw*0.8);
  // Helmet
  fillArc(hx,hy-2*s,10*s,-Math.PI,-0,c1('0.3)'));
  // Eyes
  fillEllipse(hx-3*s,hy-2*s,1.5*s,1*s,c1('0.4)'));
  fillEllipse(hx+3*s,hy-2*s,1.5*s,1*s,c1('0.4)'));

  // === MININ (left) ===
  var mx=BX-40*s, my=BY-5*s;

  // Legs
  fillPoly([[mx-6*s,my],[mx-2*s,my],[mx,my-80*s],[mx-6*s,my-80*s]],c2('0.4)'));
  fillPoly([[mx+2*s,my],[mx+6*s,my],[mx+8*s,my-80*s],[mx+2*s,my-80*s]],c2('0.35)'));
  strokePoly([[mx-6*s,my],[mx+8*s,my],[mx+8*s,my-80*s],[mx-6*s,my-80*s]],c2('0.2)'),lw*0.5);

  // Torso — robe with flare
  fillPoly([
    [mx-6*s,my-80*s],[mx+2*s,my-80*s],
    [mx+10*s,my-110*s],[mx+12*s,my-130*s],[mx+10*s,my-145*s],
    [mx-2*s,my-145*s],[mx-10*s,my-130*s],[mx-12*s,my-110*s]
  ],c2('0.5)'));
  // Robe flare at bottom
  fillPoly([
    [mx-6*s,my-80*s],[mx-16*s,my-70*s],[mx-14*s,my-80*s]
  ],c2('0.25)'));
  fillPoly([
    [mx+2*s,my-80*s],[mx+14*s,my-70*s],[mx+10*s,my-80*s]
  ],c2('0.25)'));
  strokePoly([
    [mx-6*s,my-80*s],[mx+12*s,my-110*s],[mx+10*s,my-145*s],
    [mx-10*s,my-145*s],[mx-12*s,my-110*s]
  ],c2('0.3)'),lw);

  // Left arm — polygon
  fillPoly([
    [mx-10*s,my-140*s],[mx-16*s,my-130*s],[mx-20*s,my-115*s],
    [mx-22*s,my-100*s],[mx-20*s,my-92*s],[mx-14*s,my-92*s],
    [mx-12*s,my-100*s],[mx-10*s,my-115*s],[mx-6*s,my-130*s]
  ],c2('0.35)'));

  // RIGHT ARM — iconic pointing gesture — polygon
  fillPoly([
    [mx+8*s,my-140*s],[mx+16*s,my-142*s],[mx+28*s,my-138*s],
    [mx+42*s,my-132*s],[mx+52*s,my-128*s],[mx+52*s,my-132*s],
    [mx+42*s,my-136*s],[mx+28*s,my-142*s],[mx+16*s,my-146*s]
  ],c2('0.45)'));
  strokePoly([[mx+8*s,my-140*s],[mx+52*s,my-130*s],[mx+52*s,my-134*s],[mx+8*s,my-144*s]],c2('0.25)'),lw*0.5);

  // Pointing finger — small triangle
  var ftx=mx+52*s, fty=my-131*s;
  fillPoly([[ftx,fty-1*s],[ftx+12*s,fty-2*s],[ftx,fty+1*s]],c2('0.5)'));

  // Energy lines from finger
  for(var ei=0;ei<4;ei++){
    var ea=0.1+0.08*Math.sin(t*4+ei);
    strokePoly([
      [ftx+12*s+ei*6*s,fty-2*s+Math.sin(t*3+ei)*3*s],
      [ftx+18*s+ei*8*s,fty-3*s+Math.sin(t*3+ei)*4*s]
    ],c2(ea+')'),lw*0.3);
  }

  // HEAD
  var mhx=mx+1*s, mhy=my-152*s;
  fillEllipse(mhx,mhy,8*s,10*s,c2('0.5)'));
  strokePoly([[mhx-8*s,mhy],[mhx,mhy-10*s],[mhx+8*s,mhy],[mhx,mhy+10*s],[mhx-8*s,mhy]],c2('0.35)'),lw*0.8);

  // Beard — filled triangle
  fillPoly([
    [mhx-4*s,mhy+5*s],[mhx,mhy+18*s],[mhx+4*s,mhy+5*s]
  ],c3('0.3)'));
  strokePoly([[mhx-4*s,mhy+5*s],[mhx,mhy+18*s],[mhx+4*s,mhy+5*s]],c3('0.2)'),lw*0.5);

  // Eyes
  fillEllipse(mhx-3*s,mhy-2*s,1.5*s,1*s,c2('0.4)'));
  fillEllipse(mhx+3*s,mhy-2*s,1.5*s,1*s,c2('0.4)'));

  // === GLOWS ===
  if(gl>0.05){
    var g1=X.createRadialGradient(swx,swy-70*s,0,swx,swy-70*s,35*s*gl);
    g1.addColorStop(0,'rgba(255,255,200,'+(0.08*gl)+')');
    g1.addColorStop(1,'rgba(255,255,200,0)');
    X.fillStyle=g1;X.beginPath();X.arc(swx,swy-70*s,35*s*gl,0,Math.PI*2);X.fill();

    var g2=X.createRadialGradient(ftx+12*s,fty,0,ftx+12*s,fty,25*s*gl);
    g2.addColorStop(0,'rgba(255,220,100,'+(0.06*gl)+')');
    g2.addColorStop(1,'rgba(255,220,100,0)');
    X.fillStyle=g2;X.beginPath();X.arc(ftx+12*s,fty,25*s*gl,0,Math.PI*2);X.fill();
  }

  // === Kremlin silhouette background ===
  X.globalAlpha=0.06;
  for(var k=-3;k<=3;k++){
    var kx=cx+k*60*s, ky=BY-80*s;
    fillPoly([[kx-6*s,ky+30*s],[kx-6*s,ky-8*s],[kx,ky-16*s],[kx+6*s,ky-8*s],[kx+6*s,ky+30*s]],c1('1)'));
    fillArc(kx,ky-16*s,4*s,-Math.PI,0,c1('0.5)'));
  }
  X.globalAlpha=1;

  requestAnimationFrame(draw);
}
lp(0);draw();
</script>
</body>
</html>
