<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyArt Flow — Иллюстрация как Объяснение</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;color:#ccc;font-family:'Segoe UI',sans-serif;overflow:hidden}
canvas{display:block;position:absolute;top:0;left:0}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#phase{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center}
#phase h1{color:#fff;font-size:24px;letter-spacing:8px;text-transform:uppercase;text-shadow:0 0 20px #ff0,0 0 40px #fa0}
#phase .sub{color:#aa8;font-size:11px;letter-spacing:3px;margin-top:4px}
#what{position:absolute;top:80px;left:50%;transform:translateX(-50%);max-width:600px;text-align:center}
#what .q{color:#ff0;font-size:13px;letter-spacing:2px;margin-bottom:6px}
#what .a{color:#aaa;font-size:12px;line-height:1.6}
#nav{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:all}
.nb{padding:8px 20px;background:rgba(255,200,0,0.06);border:1px solid #ff03;color:#ff0;font-size:10px;cursor:pointer;border-radius:4px;text-transform:uppercase;letter-spacing:2px;transition:all .2s}
.nb:hover{background:rgba(255,200,0,0.2);text-shadow:0 0 8px #ff0}
.nb.active{background:rgba(255,200,0,0.15);border-color:#ff06}
#progress{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:400px;height:3px;background:rgba(255,255,255,0.05);border-radius:2px}
#progressFill{height:100%;background:linear-gradient(90deg,#ff0,#fa0,#f60);border-radius:2px;transition:width 0.5s;width:0%}
#example{position:absolute;top:130px;right:30px;max-width:220px;pointer-events:all}
#example .ex{background:rgba(255,255,255,0.03);border:1px solid #222;border-radius:6px;padding:10px;margin-bottom:8px;cursor:pointer;transition:all .2s}
#example .ex:hover{border-color:#ff03}
#example .ex.active{border-color:#ff06;background:rgba(255,200,0,0.05)}
#example .ex h3{color:#ff0;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
#example .ex p{color:#888;font-size:9px;line-height:1.4}
#next{position:absolute;bottom:20px;right:30px;pointer-events:all}
#next .btn{padding:8px 16px;background:rgba(0,255,100,0.06);border:1px solid #0f83;color:#0f8;font-size:10px;cursor:pointer;border-radius:4px;text-transform:uppercase;letter-spacing:1px;transition:all .2s}
#next .btn:hover{background:rgba(0,255,100,0.2)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<div id="phase">
<h1 id="phaseTitle">BIRTH</h1>
<div class="sub" id="phaseSub">Появление</div>
</div>
<div id="what">
<div class="q" id="whatQ">Что объясняется?</div>
<div class="a" id="whatA">Один корень полинома — это точка на комплексной плоскости</div>
</div>
<div id="example">
<div class="ex active" id="ex1"><h3>1. Появление</h3><p>Из пустоты — точка</p></div>
<div class="ex" id="ex2"><h3>2. Рост</h3><p>Точка порождает структуру</p></div>
<div class="ex" id="ex3"><h3>3. Развитие</h3><p>Структура обрастает деталями</p></div>
<div class="ex" id="ex4"><h3>4. Применение</h3><p>Красота связана с реальностью</p></div>
<div class="ex" id="ex5"><h3>5. Расширение</h3><p>Система порождает новую</p></div>
</div>
<div id="progress"><div id="progressFill"></div></div>
<div id="nav">
<button class="nb active" onclick="setExample(0)">Nebula</button>
<button class="nb" onclick="setExample(1)">Symphony</button>
<button class="nb" onclick="setExample(2)">Mixer</button>
<button class="nb" onclick="setExample(3)">Mandala</button>
<button class="nb" onclick="setExample(4)">PolyCrypt</button>
</div>
<div id="next"><div class="btn" onclick="nextPhase()">ДАЛЕЕ →</div></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

let t=0,phase=0,exIdx=0;
const phaseNames=['BIRTH','GROWTH','EVOLUTION','APPLICATION','EXPANSION'];
const phaseSubs=['Появление','Рост','Развитие','Применение','Расширение'];

const examples=[
  {
    name:'Nebula',
    phases:[
      {q:'Что объясняется?',a:'Один корень полинома — это точка на комплексной плоскости'},
      {q:'Как растёт?',a:'Корней становится больше, между ними появляются связи'},
      {q:'Что создаёт красоту?',a:'Свечение, цвет, пульсация — детали вокруг каждого корня'},
      {q:'Где используется?',a:'Теория управления · Криптография · Компьютерная графика'},
      {q:'Что дальше?',a:'Root Mixer — перетаскивай корни мышью'}
    ],
    render:renderNebula
  },
  {
    name:'Symphony',
    phases:[
      {q:'Что объясняется?',a:'Коэффициент полинома — это нота в мелодии ландшафта'},
      {q:'Как растёт?',a:'9 коэффициентов叠加 = 9 нот, каждая меняет форму'},
      {q:'Что создаёт красоту?',a:'Горы, океан, пещера — каждый коэффициент = тембр'},
      {q:'Где используется?',a:'Фурье-анализ · Обработка звука · Спектрограммы'},
      {q:'Что дальше?',a:'Polynomial Aurora — северное сияние из тех же полиномов'}
    ],
    render:renderSymphony
  },
  {
    name:'Mixer',
    phases:[
      {q:'Что объясняется?',a:'Корень — это центр притяжения, ядро поля'},
      {q:'Как растёт?',a:'Два корня = два центра, поле между ними'},
      {q:'Что создаёт красоту?',a:'3 режима: Density, Iterate, Phase — три взгляда'},
      {q:'Где используется?',a:'Фильтры · Стабильность систем · Машинное обучение'},
      {q:'Что дальше?',a:'PolyCrypt — зашифруй сообщение в корнях'}
    ],
    render:renderMixer
  },
  {
    name:'Mandala',
    phases:[
      {q:'Что объясняется?',a:'Симметрия = повторение. Один сектор × N = мандала'},
      {q:'Как растёт?',a:'Круг → 8 лучей → каждый луч обрастает орнаментом'},
      {q:'Что создаёт красоту?',a:'Слои симметрии, цветовые гармонии, пульсация'},
      {q:'Где используется?',a:'Мозаика Альгамбра · Готические розетки · Фракталы'},
      {q:'Что дальше?',a:'Polynomial Symphony — частицы + шифрование'}
    ],
    render:renderMandala
  },
  {
    name:'PolyCrypt',
    phases:[
      {q:'Что объясняется?',a:'Буква → число → коэффициент полинома'},
      {q:'Как растёт?',a:'Коэффициенты → полином → корни'},
      {q:'Что создаёт красоту?',a:'Корни как звёзды — зашифрованное сообщение'},
      {q:'Где используется?',a:'Коды Рида-Соломона · BCH · Эллиптические кривые'},
      {q:'Что дальше?',a:'Основной polyart репозиторий — Python-система'}
    ],
    render:renderCrypt
  }
];

function setExample(i){
  exIdx=i;phase=0;
  document.querySelectorAll('.nb').forEach((b,j)=>b.classList.toggle('active',j===i));
  updateUI();
}
function nextPhase(){
  if(phase<4){phase++;updateUI();}
}
function updateUI(){
  const ex=examples[exIdx];
  document.getElementById('phaseTitle').textContent=phaseNames[phase];
  document.getElementById('phaseSub').textContent=phaseSubs[phase];
  document.getElementById('whatQ').textContent=ex.phases[phase].q;
  document.getElementById('whatA').textContent=ex.phases[phase].a;
  document.getElementById('progressFill').style.width=((phase+1)/5*100)+'%';
  for(let i=1;i<=5;i++){
    document.getElementById('ex'+i).classList.toggle('active',i===phase+1);
  }
}

function renderNebula(ctx,w,h,phase,t){
  const cx=w/2,cy=h/2,sc=Math.min(w,h)/10;
  const count=[1,5,8,8,12][phase];
  const glow=[2,6,10,10,15][phase];
  const connections=[0,1,1,3,5][phase];

  for(let i=0;i<count;i++){
    const a=i*Math.PI*2/count+t*0.2;
    const r=sc*(0.8+0.3*Math.sin(t*0.5+i));
    const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
    const h2=(210+i*30)%360;
    const pulse=1+0.2*Math.sin(t*2+i);

    for(let g=glow;g>0;g--){
      const rr=g*6*pulse;
      const grad=ctx.createRadialGradient(px,py,0,px,py,rr);
      grad.addColorStop(0,`hsla(${h2},90%,70%,${0.12/g})`);
      grad.addColorStop(1,`hsla(${h2},80%,40%,0)`);
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(px,py,rr,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle=`hsla(${h2},100%,85%,0.9)`;
    ctx.beginPath();ctx.arc(px,py,2.5*pulse,0,Math.PI*2);ctx.fill();

    if(phase>=1&&i<connections){
      const ni=(i+1)%count;
      const a2=ni*Math.PI*2/count+t*0.2;
      const r2=sc*(0.8+0.3*Math.sin(t*0.5+ni));
      ctx.strokeStyle=`hsla(${h2},60%,50%,0.15)`;ctx.lineWidth=0.8;
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(cx+Math.cos(a2)*r2,cy+Math.sin(a2)*r2);ctx.stroke();
    }
  }

  if(phase>=2){
    ctx.strokeStyle=`hsla(240,50%,50%,0.06)`;ctx.lineWidth=1;
    ctx.beginPath();
    for(let a=0;a<=Math.PI*2;a+=0.02){
      const rr=sc*(0.7+0.3*Math.sin(a*count+t));
      const px=cx+rr*Math.cos(a),py=cy+rr*Math.sin(a);
      a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath();ctx.stroke();
  }
}

function renderSymphony(ctx,w,h,phase,t){
  const layers=[1,3,6,6,8][phase];
  const colors=[[200],[200,250,300],[200,250,300,30,80],[200,250,300,30,80],[200,250,300,30,80,150,210]];

  for(let l=0;l<layers;l++){
    const ly=h*0.25+l*h*0.07;
    const c=colors[phase][l%colors[phase].length];
    const alpha=0.12+l*0.03;
    ctx.beginPath();ctx.moveTo(0,h);
    for(let x=0;x<=w;x+=3){
      const nx=(x/w-0.5)*8;
      const y=Math.sin(nx*0.5+t*0.5+l)*25+Math.cos(nx*0.3+t*0.7+l*0.5)*15+l*8;
      ctx.lineTo(x,ly+y);
    }
    ctx.lineTo(w,h);ctx.closePath();
    ctx.fillStyle=`hsla(${c},60%,40%,${alpha})`;ctx.fill();
    ctx.strokeStyle=`hsla(${c},70%,50%,${alpha*2})`;ctx.lineWidth=1;ctx.stroke();
  }
}

function renderMixer(ctx,w,h,phase,t){
  const cx=w/2,cy=h/2,sc=Math.min(w,h)/6;
  const roots=[];
  const count=[1,2,3,3,5][phase];
  for(let i=0;i<count;i++){
    const a=i*Math.PI*2/count+t*0.15;
    const r=sc*(0.4+0.1*Math.sin(t+i));
    roots.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});
  }

  if(phase>=2){
    for(let px=0;px<w;px+=6){
      for(let py=0;py<h;py+=6){
        let sum=0;
        for(const r of roots){
          const d=Math.hypot(px-r.x,py-r.y)+1;
          sum+=1/(d*d);
        }
        const v=Math.min(1,sum*200);
        const h2=(v*300+phase*60)%360;
        ctx.fillStyle=`hsla(${h2},80%,${30+v*40}%,${v*0.3})`;
        ctx.fillRect(px,py,5,5);
      }
    }
  }

  roots.forEach((r,i)=>{
    const pulse=1+0.3*Math.sin(t*2+i);
    const grad=ctx.createRadialGradient(r.x,r.y,0,r.x,r.y,15*pulse);
    grad.addColorStop(0,'rgba(255,255,100,0.8)');
    grad.addColorStop(1,'rgba(255,200,50,0)');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(r.x,r.y,15*pulse,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r.x,r.y,2.5,0,Math.PI*2);ctx.fill();
  });
}

function renderMandala(ctx,w,h,phase,t){
  const cx=w/2,cy=h/2,sc=Math.min(w,h)/10;
  const sym=[0,8,8,8,12][phase];
  const lay=[0,1,3,3,5][phase];

  if(phase===0)return;

  for(let l=0;l<lay;l++){
    const lr=sc*(0.8+l*0.6);
    const h2=(300+l*40)%360;
    for(let s=0;s<sym;s++){
      const a=s*Math.PI*2/sym+t*0.15+l*0.1;
      const a2=(s+1)*Math.PI*2/sym+t*0.15+l*0.1;
      const r1=lr*(0.7+0.3*Math.sin(t*0.5+s+l));
      const r2=lr*(0.7+0.3*Math.sin(t*0.5+s+1+l));

      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
      const mid=(a+a2)/2;
      const bulge=1+0.2*Math.sin(t*2+s+l);
      ctx.quadraticCurveTo(cx+Math.cos(mid)*lr*bulge,cy+Math.sin(mid)*lr*bulge,cx+Math.cos(a2)*r2,cy+Math.sin(a2)*r2);
      ctx.closePath();
      ctx.fillStyle=`hsla(${h2+l*20},80%,50%,${0.2-l*0.02})`;ctx.fill();
      ctx.strokeStyle=`hsla(${h2+l*20},70%,60%,${0.15})`;ctx.lineWidth=0.6;ctx.stroke();
    }
  }

  for(let s=0;s<sym;s++){
    const a=s*Math.PI*2/sym+t*0.15;
    const r=sc*(1+0.1*Math.sin(t+s));
    const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
    const pulse=1+0.3*Math.sin(t*3+s);
    const grad=ctx.createRadialGradient(px,py,0,px,py,5*pulse);
    grad.addColorStop(0,`hsla(${(s*45)%360},100%,85%,0.8)`);
    grad.addColorStop(1,`hsla(${(s*45)%360},80%,50%,0)`);
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(px,py,5*pulse,0,Math.PI*2);ctx.fill();
  }
}

function renderCrypt(ctx,w,h,phase,t){
  const cx=w/2,cy=h/2,sc=Math.min(w,h)/10;
  const msg='POLYART';
  const chars=[1,3,5,5,7][phase];

  for(let i=0;i<Math.min(chars,msg.length);i++){
    const a=i*Math.PI*2/7+t*0.3;
    const r=sc*(0.5+0.3*Math.sin(t*0.4+i));
    const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;

    const pulse=1+0.2*Math.sin(t*2+i);
    const h2=(50+i*40)%360;
    const grad=ctx.createRadialGradient(px,py,0,px,py,12*pulse);
    grad.addColorStop(0,`hsla(${h2},90%,70%,0.7)`);
    grad.addColorStop(1,`hsla(${h2},80%,40%,0)`);
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(px,py,12*pulse,0,Math.PI*2);ctx.fill();

    ctx.fillStyle=`hsla(${h2},100%,90%,0.9)`;
    ctx.font='bold 14px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(msg[i],px,py);

    if(phase>=1){
      ctx.strokeStyle=`hsla(${h2},60%,50%,0.2)`;ctx.lineWidth=0.5;
      ctx.beginPath();
      for(let j=0;j<=20;j++){
        const ja=j/20*Math.PI*2;
        const jr=20+j*2+Math.sin(ja*3+t)*5;
        const jx=px+Math.cos(ja)*jr,jy=py+Math.sin(ja)*jr;
        j===0?ctx.moveTo(jx,jy):ctx.lineTo(jx,jy);
      }
      ctx.closePath();ctx.stroke();
    }
  }

  if(phase>=2){
    for(let i=0;i<7;i++){
      const a=i*Math.PI*2/7+t*0.2;
      const r=sc*1.2;
      const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
      const grad=ctx.createRadialGradient(px,py,0,px,py,4);
      grad.addColorStop(0,'rgba(255,255,100,0.6)');
      grad.addColorStop(1,'rgba(255,200,50,0)');
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();
    }
  }
}

function draw(){
  t+=0.016;
  X.fillStyle='rgba(8,8,16,0.08)';
  X.fillRect(0,0,W,H);
  examples[exIdx].render(X,W,H,phase,t);
  requestAnimationFrame(draw);
}

updateUI();draw();
</script>
</body>
</html>
