<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complex Terrain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080410;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#title{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:20px;letter-spacing:6px;text-transform:uppercase;text-shadow:0 0 20px #f0f,0 0 40px #808;z-index:10}
#ui{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10;flex-wrap:wrap;justify-content:center}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:3px}
.ctrl label{color:#f8f;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;text-shadow:0 0 4px #a0a}
.ctrl input[type=range]{width:100px;accent-color:#f0f;cursor:pointer}
.ctrl .val{color:#f0f;font-size:12px;font-weight:bold;text-shadow:0 0 6px #f0f}
#presets{position:absolute;top:16px;right:16px;z-index:10;display:flex;gap:6px;flex-wrap:wrap;max-width:220px;justify-content:flex-end}
.pb{padding:4px 10px;background:rgba(255,0,255,0.06);border:1px solid #f0f3;color:#f0f;font-size:9px;cursor:pointer;border-radius:3px;text-transform:uppercase;letter-spacing:1px;transition:all .2s}
.pb:hover{background:rgba(255,0,255,0.2);text-shadow:0 0 6px #f0f}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Complex Terrain</div>
<div id="presets">
<button class="pb" onclick="lp(0)">Горы</button>
<button class="pb" onclick="lp(1)">Океан</button>
<button class="pb" onclick="lp(2)">Кристалл</button>
<button class="pb" onclick="lp(3)">Пустыня</button>
</div>
<div id="ui">
<div class="ctrl"><label>Высота</label><input type="range" id="ht" min="1" max="100" value="50"><span class="val" id="htV">50</span></div>
<div class="ctrl"><label>Частота</label><input type="range" id="fr" min="1" max="20" value="6"><span class="val" id="frV">6</span></div>
<div class="ctrl"><label>Наклон</label><input type="range" id="til" min="-100" max="100" value="30"><span class="val" id="tilV">0.30</span></div>
<div class="ctrl"><label>Вращение</label><input type="range" id="rot" min="0" max="100" value="25"><span class="val" id="rotV">0.25</span></div>
<div class="ctrl"><label>Палитра</label><input type="range" id="pal" min="0" max="5" value="0"><span class="val" id="palV">0</span></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

const S={ht:'htV',fr:'frV',til:'tilV',rot:'rotV',pal:'palV'};
Object.keys(S).forEach(k=>{
  document.getElementById(k).addEventListener('input',()=>{
    const v=parseFloat(document.getElementById(k).value);
    let t=v+'';if(k==='til'||k==='rot')t=(v/100).toFixed(2);
    document.getElementById(S[k]).textContent=t;
  });
});

const presets=[
  {ht:50,fr:6,til:30,rot:25,pal:0},
  {ht:30,fr:4,til:20,rot:15,pal:1},
  {ht:80,fr:10,til:40,rot:35,pal:2},
  {ht:25,fr:3,til:15,rot:10,pal:3},
];
function lp(i){const p=presets[i];Object.keys(p).forEach(k=>{document.getElementById(k).value=p[k];document.getElementById(k).dispatchEvent(new Event('input'));});}

function gv(id){return parseFloat(document.getElementById(id).value)}

const palettes=[
  [[0,100,200],[0,200,150],[100,255,100],[255,200,0],[255,100,50],[200,50,100]],
  [[10,30,80],[20,80,160],[50,150,220],[100,200,255],[180,230,255],[220,240,255]],
  [[80,0,120],[160,0,200],[200,50,255],[255,100,200],[255,180,220],[255,220,240]],
  [[120,80,20],[180,120,40],[220,160,60],[255,200,80],[255,220,140],[255,240,200]],
  [[200,20,20],[255,80,30],[255,150,50],[255,200,80],[255,255,100],[200,255,80]],
  [[0,180,180],[0,120,200],[60,60,200],[120,0,200],[180,0,180],[200,0,120]],
];

let t=0;
const GRID=40;

function heightAt(x,y,freq){
  let h=0;
  h+=Math.sin(x*freq*0.3+y*freq*0.2+t*0.3)*0.5;
  h+=Math.sin(x*freq*0.5-y*freq*0.4+t*0.2)*0.3;
  h+=Math.sin(x*freq*0.15+y*freq*0.6-t*0.4)*0.4;
  h+=Math.cos(x*freq*0.7+y*freq*0.3+t*0.15)*0.2;
  h+=Math.sin((x+y)*freq*0.25+t*0.5)*0.15;
  return h;
}

function draw(){
  const ht=gv('ht'),fr=gv('fr'),til=gv('til')/100,rot=gv('rot')/100;
  const palIdx=Math.round(gv('pal'))%palettes.length;
  const pal=palettes[palIdx];
  t+=0.012;

  X.fillStyle='rgba(8,4,16,0.12)';
  X.fillRect(0,0,W,H);

  const cx=W/2,cy=H/2;
  const size=Math.min(W,H)*0.7;
  const rows=GRID,cols=GRID;
  const step=size/GRID;

  const angleX=til*Math.PI*0.4;
  const angleY=rot*Math.PI*2+t*0.1;
  const cosY=Math.cos(angleY),sinY=Math.sin(angleY);
  const cosX=Math.cos(angleX),sinX=Math.sin(angleX);

  const projected=[];
  for(let r=0;r<=rows;r++){
    projected[r]=[];
    for(let c=0;c<=cols;c++){
      const gx=(c/cols-0.5)*8;
      const gy=(r/rows-0.5)*8;
      const gz=heightAt(gx,gy,fr)*ht*0.02;

      let x=gx*cosY-gy*sinY;
      let y=gx*sinY+gy*cosY;
      let z=gz;

      let y2=y*cosX-z*sinX;
      let z2=y*sinX+z*cosX;

      const scale=300/(300+y2*30);
      const px=cx+x*scale*size*0.08;
      const py=cy+z2*scale*size*0.08-y2*15;

      const hNorm=(gz/(ht*0.02)+1)/2;
      const ci=Math.min(pal.length-1,Math.max(0,Math.floor(hNorm*(pal.length-1))));
      const cf=hNorm*(pal.length-1)-ci;
      const c1=pal[ci],c2=pal[Math.min(ci+1,pal.length-1)];
      const cr=c1[0]+(c2[0]-c1[0])*cf;
      const cg=c1[1]+(c2[1]-c1[1])*cf;
      const cb=c1[2]+(c2[2]-c1[2])*cf;

      projected[r][c]={x:px,y:py,z:y2,h:hNorm,r:cr,g:cg,b:cb};
    }
  }

  const quads=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const a=projected[r][c],b=projected[r][c+1],d=projected[r+1][c],e=projected[r+1][c+1];
      const avgZ=(a.z+b.z+d.z+e.z)/4;
      const avgH=(a.h+b.h+d.h+e.h)/4;
      quads.push({a,b,d,e,z:avgZ,h:avgH});
    }
  }
  quads.sort((a,b)=>b.z-a.z);

  quads.forEach(q=>{
    const {a,b,d,e}=q;
    const avgH=(a.h+b.h+d.h+e.h)/4;
    const light=0.4+avgH*0.5+Math.sin(avgH*6)*0.1;

    const r=((a.r+b.r+d.r+e.r)/4*light)|0;
    const g=((a.g+b.g+d.g+e.g)/4*light)|0;
    const bl=((a.b+b.b+d.b+e.b)/4*light)|0;

    X.beginPath();
    X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.lineTo(e.x,e.y);X.lineTo(d.x,d.y);X.closePath();
    X.fillStyle=`rgba(${r},${g},${bl},0.85)`;
    X.fill();
    X.strokeStyle=`rgba(${Math.min(255,r+40)},${Math.min(255,g+40)},${Math.min(255,bl+40)},0.15)`;
    X.lineWidth=0.4;
    X.stroke();
  });

  for(let i=0;i<15;i++){
    const px=(Math.sin(t*0.2+i*2.7)*0.25+0.5)*W;
    const py=(Math.cos(t*0.15+i*1.9)*0.1+0.1)*H;
    const grad=X.createRadialGradient(px,py,0,px,py,20);
    const h=(t*30+i*24)%360;
    grad.addColorStop(0,`hsla(${h},80%,60%,0.08)`);
    grad.addColorStop(1,`hsla(${h},80%,30%,0)`);
    X.fillStyle=grad;X.beginPath();X.arc(px,py,20,0,Math.PI*2);X.fill();
  }

  requestAnimationFrame(draw);
}

lp(0);draw();
</script>
</body>
</html>
