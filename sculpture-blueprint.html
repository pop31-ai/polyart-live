<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyArt — Скульптурная Контуровка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#ccc;font-family:'Segoe UI',sans-serif;overflow-x:hidden}
.hero{text-align:center;padding:40px 20px 20px;border-bottom:1px solid #1a1a2a}
.hero h1{font-size:28px;letter-spacing:10px;text-transform:uppercase;color:#fff;text-shadow:0 0 20px #fff3}
.hero .sub{color:#666;font-size:10px;letter-spacing:4px;margin-top:6px}
.sculpture{display:flex;flex-direction:column;gap:30px;padding:30px 40px;max-width:1400px;margin:0 auto}
.piece{display:grid;grid-template-columns:280px 1fr 220px;gap:20px;background:rgba(255,255,255,0.01);border:1px solid #1a1a2a;border-radius:8px;padding:20px;position:relative}
.piece::before{content:attr(data-num);position:absolute;top:-10px;left:20px;background:#0a0a0f;padding:0 8px;color:#444;font-size:10px;letter-spacing:2px}
.wireframe{height:240px;border:1px solid #1a1a2a;border-radius:4px;position:relative;overflow:hidden;background:#050508}
.wireframe canvas{width:100%;height:100%}
.meta{display:flex;flex-direction:column;gap:10px}
.meta h2{color:#fff;font-size:14px;letter-spacing:3px;text-transform:uppercase}
.meta .desc{color:#888;font-size:11px;line-height:1.6}
.palette{display:flex;gap:3px;margin-top:4px}
.palette .swatch{width:20px;height:20px;border-radius:3px;border:1px solid #222}
.lifecycle{display:flex;flex-direction:column;gap:6px}
.lc{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(255,255,255,0.02);border:1px solid #1a1a2a;border-radius:4px;font-size:10px;letter-spacing:1px}
.lc .num{color:#fff;font-weight:bold;min-width:14px}
.lc .name{color:#aaa;text-transform:uppercase;min-width:90px}
.lc .vis{color:#666;font-style:italic}
.controls{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.ctrl-tag{padding:2px 6px;background:rgba(255,255,255,0.03);border:1px solid #1a1a2a;border-radius:2px;font-size:8px;color:#666;text-transform:uppercase;letter-spacing:1px}
.apply{margin-top:8px;padding:8px 10px;background:rgba(0,255,200,0.03);border:1px solid #0fc2;border-radius:4px;font-size:10px;color:#0fc;line-height:1.5}
.apply b{color:#fff}
</style>
</head>
<body>
<div class="hero">
<h1>Скульптурная Контуровка</h1>
<div class="sub">WIREFRAME BLUEPRINT — КАЖДАЯ ИЛЛЮСТРАЦИЯ КАК СКУЛЬПТУРА</div>
</div>
<div class="sculpture" id="sculpture"></div>
<script>
const pieces=[
{
num:'01',title:'Polynomial Nebula',desc:'Корни полинома как звёзды туманности. Центральная композиция — круговая. Фокус — единственная точка, из которой разрастается система.',
palette:['#0a1a3a','#1a3a6a','#3a6aaa','#6aaaff','#aaddff','#ffffff'],
lifecycle:[
{phase:'BIRTH',vis:'Одна точка в центре чёрного экрана, медленно пульсирует'},
{phase:'GROWTH',vis:'Из точки вырастают ещё 4, между ними — тонкие нити'},
{phase:'EVOLUTION',vis:'Вокруг каждой звезды — многослойное свечение, орбиты'},
{phase:'APPLICATION',vis:'Мини-диаграммы: фильтр, шифр, графика, контроль'},
{phase:'EXPANSION',vis:'Ссылка: «Попробуй Root Mixer»'}
],
controls:['degree','radius','rotation','glow','speed','palette'],
apply:'Теория управления · Криптография · Компьютерная графика · Фильтры сигналов'
},
{
num:'02',title:'Coefficient Symphony',desc:'9 слайдеров как 9 нот. Каждый коэффициент — тембр. Горизонтальная композиция — слои. Фокус — ландшафт, построенный из полинома.',
palette:['#1a0a0a','#3a1a1a','#6a3a1a','#aa6a1a','#ffaa1a','#ffffaa'],
lifecycle:[
{phase:'BIRTH',vis:'Одна волна на горизонте, базовая нота'},
{phase:'GROWTH',vis:'9 волн叠加, каждая свой цвет'},
{phase:'EVOLUTION',vis:'Волны формируют горы, океаны, пещеры'},
{phase:'APPLICATION',vis:'Спектрограмма рядом с ландшафтом'},
{phase:'EXPANSION',vis:'Ссылка: «Polynomial Aurora»'}
],
controls:['a0','a1','a2','a3','a4','a5','a6','a7','a8'],
apply:'Фурье-анализ · Обработка звука · Спектрограммы · Аппроксимация'
},
{
num:'03',title:'Root Garden',desc:'Корни как семена. Из каждого вырастает цветок из кривых-лепестков. Органическая композиция — сад. Фокус — биоморфизм.',
palette:['#0a1a0a','#1a3a1a','#3a6a3a','#6aaa3a','#aaff3a','#ddffaa'],
lifecycle:[
{phase:'BIRTH',vis:'Одно семя — корень, пульсирует'},
{phase:'GROWTH',vis:'Из семени — 6 лепестков (Безье)'},
{phase:'EVOLUTION',vis:'Сад из цветов, ветер, пыльца'},
{phase:'APPLICATION',vis:'Фракталы · Ботаническая иллюстрация · Генеративный арт'},
{phase:'EXPANSION',vis:'Ссылка: «Complex Terrain»'}
],
controls:['degree','petals','growth','wind','depth'],
apply:'Фракталы · Ботаническая иллюстрация · Генеративный арт · L-системы'
},
{
num:'04',title:'Complex Terrain',desc:'3D-поверхность из полинома. Перспективная композиция — сетка с рельефом. Фокус — объём из математики.',
palette:['#1a0a2a','#3a1a4a','#6a3a7a','#aa6aaa','#dd6aff','#ffaaff'],
lifecycle:[
{phase:'BIRTH',vis:'Плоская сетка 40×40'},
{phase:'GROWTH',vis:'Сетка поднимается, появляются высоты'},
{phase:'EVOLUTION',vis:'3D с освещением и палитрой высот'},
{phase:'APPLICATION',vis:'GIS · Игровые миры · Симуляции рельефа'},
{phase:'EXPANSION',vis:'Ссылка: «Polynomial Aurora»'}
],
controls:['height','frequency','tilt','rotation','palette'],
apply:'GIS · Игровые миры · Симуляция рельефа · Метеомодели'
},
{
num:'05',title:'Polynomial Aurora',desc:'Северное сияние из полиномиальных кривых. Горизонтальная композиция — полосы. Фокус — атмосферное свечение.',
palette:['#020a1a','#0a1a3a','#1a3a6a','#3a6aaa','#6aafff','#aaffff'],
lifecycle:[
{phase:'BIRTH',vis:'Одна полоса на тёмном небе'},
{phase:'GROWTH',vis:'5–7 полос, каждая — полином'},
{phase:'EVOLUTION',vis:'Полосы дышат, многослойное свечение'},
{phase:'APPLICATION',vis:'Атмосферная физика · Генеративный дизайн · VJ-сэты'},
{phase:'EXPANSION',vis:'Ссылка: «Root Mixer»'}
],
controls:['bands','amplitude','speed','saturation','degree'],
apply:'Атмосферная физика · Генеративный дизайн · VJ-сэты · Обработка видео'
},
{
num:'06',title:'Root Mixer',desc:'Drag&drop корней. Пиксельная плотность. Фрактальный фокус — каждый пиксель считает.',
palette:['#0a0a1a','#1a1a3a','#3a3a6a','#6a6aaa','#aaff00','#ffff00'],
lifecycle:[
{phase:'BIRTH',vis:'Одна точка на чёрном фоне'},
{phase:'GROWTH',vis:'Второй корень — поле между ними'},
{phase:'EVOLUTION',vis:'3 режима: Density, Iterate, Phase'},
{phase:'APPLICATION',vis:'Фильтры · Стабильность · Машинное обучение'},
{phase:'EXPANSION',vis:'Ссылка: «PolyCrypt»'}
],
controls:['size','detail','brightness','palette','mode×3'],
apply:'Фильтры (полюса) · Стабильность систем · Полиномиальные ядра SVM'
},
{
num:'07',title:'Polynomial Mandala',desc:'Симметрия из корней. Радиальная композиция — круг. Фокус — бесконечная симметрия.',
palette:['#1a0a1a','#3a1a3a','#6a3a6a','#aa6aaa','#ff6aff','#ffaaff'],
lifecycle:[
{phase:'BIRTH',vis:'Пустой круг'},
{phase:'GROWTH',vis:'8 лучей от центра'},
{phase:'EVOLUTION',vis:'Каждый луч обрастает орнаментом'},
{phase:'APPLICATION',vis:'Мозаика Альгамбра · Готические розетки · Фракталы'},
{phase:'EXPANSION',vis:'Ссылка: «Polynomial Symphony»'}
],
controls:['symmetry','layers','degree','rotation','depth','pulse'],
apply:'Мозаика · Готическая архитектура · Фрактальная геометрия · Симметричные группы'
},
{
num:'08',title:'Polynomial Symphony',desc:'Частицы + шифрование. Динамическая композиция — вихри. Фокус — движение как информация.',
palette:['#1a0a0a','#3a1a0a','#6a3a1a','#aa6a1a','#ffaa1a','#ffffff'],
lifecycle:[
{phase:'BIRTH',vis:'Одна частица'},
{phase:'GROWTH',vis:'200 частиц, вихри'},
{phase:'EVOLUTION',vis:'Частицы реагируют на шифрование'},
{phase:'APPLICATION',vis:'Стеганография · Визуализация данных · Арт-генерация'},
{phase:'EXPANSION',vis:'Ссылка: «Hologram»'}
],
controls:['particles','strength','vortices','trail','palette','message'],
apply:'Стеганография · Визуализация данных · Арт-генерация · Физика частиц'
},
{
num:'09',title:'PolyCrypt',desc:'Полиномиальный шифр. Формальная композиция — UI. Фокус — инструмент.',
palette:['#0a0a14','#1a1a2a','#3a3a4a','#6a6a7a','#ffdd00','#ffffff'],
lifecycle:[
{phase:'BIRTH',vis:'Буква → коэффициент (анимация)'},
{phase:'GROWTH',vis:'Коэффициенты → полином'},
{phase:'EVOLUTION',vis:'Полином → корни на графике'},
{phase:'APPLICATION',vis:'Коды Рида-Соломона · BCH · Эллиптические кривые'},
{phase:'EXPANSION',vis:'Ссылка: «Основной polyart репозиторий»'}
],
controls:['message_input','key_input','encrypt','decrypt','visualize'],
apply:'Коды Рида-Соломона · BCH · QR-коды · Эллиптические кривые'
},
{
num:'10',title:'Hologram',desc:'Голографический жизненный цикл. Центральная композиция — голограмма. Фокус — процесс, не продукт.',
palette:['#020a0a','#0a1a1a','#1a3a3a','#3a6a6a','#00ffcc','#ffffff'],
lifecycle:[
{phase:'BIRTH',vis:'Элемент появляется из пустоты, RGB-сдвиг'},
{phase:'GROWTH',vis:'Элемент порождает кластер'},
{phase:'EVOLUTION',vis:'Кластер обрастает деталями'},
{phase:'APPLICATION',vis:'Онтогенез · Филогенез · Жизненные циклы систем'},
{phase:'EXPANSION',vis:'Цикл повторяется, новая система'}
],
controls:['speed','hologram','glitch','depth','life'],
apply:'Онтогенез · Филогенез · Жизненные циклы · Голография данных'
}
];

const container=document.getElementById('sculpture');

pieces.forEach(p=>{
  const div=document.createElement('div');
  div.className='piece';
  div.dataset.num=p.num;

  div.innerHTML=`
    <div class="wireframe"><canvas id="wf${p.num}"></canvas></div>
    <div class="meta">
      <h2>${p.title}</h2>
      <div class="desc">${p.desc}</div>
      <div class="palette">${p.palette.map(c=>`<div class="swatch" style="background:${c}"></div>`).join('')}</div>
      <div class="controls">${p.controls.map(c=>`<span class="ctrl-tag">${c}</span>`).join('')}</div>
      <div class="apply"><b>Применение:</b> ${p.apply}</div>
    </div>
    <div class="lifecycle">
      ${p.lifecycle.map((l,i)=>`<div class="lc"><span class="num">${i+1}</span><span class="name">${l.phase}</span><span class="vis">${l.vis}</span></div>`).join('')}
    </div>
  `;
  container.appendChild(div);
});

let t=0;
function drawWireframes(){
  t+=0.016;
  pieces.forEach(p=>{
    const canvas=document.getElementById('wf'+p.num);
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    canvas.width=canvas.parentElement.clientWidth*2;
    canvas.height=canvas.parentElement.clientHeight*2;
    ctx.scale(2,2);
    const w=canvas.width/2,h=canvas.height/2;
    ctx.fillStyle='#050508';ctx.fillRect(0,0,w,h);

    const idx=parseInt(p.num)-1;
    wireframeFns[idx](ctx,w,h,t);
  });
  requestAnimationFrame(drawWireframes);
}

const wireframeFns=[
// 01 Nebula
(ctx,w,h,t)=>{
  const cx=w/2,cy=h/2;
  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5+t*0.3;
    const r=30+8*Math.sin(t+i);
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    ctx.strokeStyle='rgba(100,170,255,0.3)';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.arc(x,y,15+3*Math.sin(t*2+i),0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(100,170,255,0.8)';ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
    if(i>0){const pa=(i-1)*Math.PI*2/5+t*0.3;ctx.strokeStyle='rgba(100,170,255,0.1)';ctx.beginPath();ctx.moveTo(cx+Math.cos(pa)*(30+8*Math.sin(t+i-1)),cy+Math.sin(pa)*(30+8*Math.sin(t+i-1)));ctx.lineTo(x,y);ctx.stroke();}
  }
},
// 02 Symphony
(ctx,w,h,t)=>{
  for(let l=0;l<5;l++){
    ctx.beginPath();ctx.moveTo(0,h);
    for(let x=0;x<=w;x+=3){const nx=(x/w-0.5)*8;const y=Math.sin(nx*0.5+t*0.5+l)*20+l*15;ctx.lineTo(x,h*0.3+y);}
    ctx.strokeStyle=`hsla(${40+l*20},70%,50%,0.3)`;ctx.lineWidth=1;ctx.stroke();
  }
},
// 03 Garden
(ctx,w,h,t)=>{
  const cx=w/2,cy=h/2;
  for(let i=0;i<3;i++){
    const x=cx+(i-1)*50,y=cy+10*Math.sin(t+i);
    for(let p=0;p<5;p++){
      const a=p*Math.PI*2/5+t*0.3+i;
      ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+Math.cos(a)*20,y+Math.sin(a)*20,x+Math.cos(a)*30,y+Math.sin(a)*30);
      ctx.strokeStyle=`hsla(${100+i*30},60%,50%,0.4)`;ctx.lineWidth=1;ctx.stroke();
    }
    ctx.fillStyle='rgba(100,255,100,0.6)';ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
  }
},
// 04 Terrain
(ctx,w,h,t)=>{
  for(let y=0;y<6;y++){
    ctx.beginPath();
    for(let x=0;x<=w;x+=4){const nx=(x/w-0.5)*6;const v=Math.sin(nx+t*0.5)*Math.cos(y*0.3)*12+Math.sin(nx*2+t)*4;ctx.lineTo(x,y*30+20+v);}
    ctx.strokeStyle=`hsla(${280+y*10},60%,50%,0.3)`;ctx.lineWidth=1;ctx.stroke();
  }
},
// 05 Aurora
(ctx,w,h,t)=>{
  for(let b=0;b<4;b++){
    ctx.beginPath();
    for(let x=0;x<=w;x+=3){const y=h*0.3+b*25+Math.sin(x*0.01+t+b)*15;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.strokeStyle=`hsla(${180+b*30},80%,60%,0.25)`;ctx.lineWidth=2;ctx.stroke();
  }
},
// 06 Mixer
(ctx,w,h,t)=>{
  const cx=w/2,cy=h/2;
  for(let i=0;i<3;i++){
    const a=i*Math.PI*2/3+t*0.2;const r=35;
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    ctx.fillStyle='rgba(255,255,0,0.7)';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
    for(let j=0;j<3;j++){const ja=j*Math.PI*2/3;ctx.strokeStyle='rgba(255,255,0,0.1)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(ja)*50,y+Math.sin(ja)*50);ctx.stroke();}
  }
},
// 07 Mandala
(ctx,w,h,t)=>{
  const cx=w/2,cy=h/2;
  for(let s=0;s<8;s++){
    const a=s*Math.PI/4+t*0.15;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*60,cy+Math.sin(a)*60);
    ctx.strokeStyle='rgba(200,100,255,0.25)';ctx.lineWidth=1;ctx.stroke();
  }
  for(let r=0;r<3;r++){
    ctx.beginPath();
    for(let a=0;a<=Math.PI*2;a+=0.05){const rr=15+r*18+Math.sin(a*8+t)*3;ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}
    ctx.strokeStyle='rgba(200,100,255,0.15)';ctx.lineWidth=0.5;ctx.stroke();
  }
},
// 08 Symphony+
(ctx,w,h,t)=>{
  for(let i=0;i<20;i++){
    const x=(Math.sin(t*0.3+i*2.1)*0.3+0.5)*w;const y=(Math.cos(t*0.2+i*1.7)*0.3+0.5)*h;
    ctx.fillStyle=`hsla(${(t*20+i*18)%360},70%,60%,0.4)`;ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill();
  }
},
// 09 PolyCrypt
(ctx,w,h,t)=>{
  const cx=w/2,cy=h/2;
  const msg='KEY';
  for(let i=0;i<3;i++){
    const a=i*Math.PI*2/3+t*0.4;const r=30;
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    ctx.fillStyle='rgba(255,220,0,0.7)';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(msg[i],x,y);
  }
},
// 10 Hologram
(ctx,w,h,t)=>{
  const cx=w/2,cy=h/2;
  const phase=Math.floor((t*0.5)%5);
  const count=[1,3,6,6,9][phase];
  for(let i=0;i<count;i++){
    const a=i*Math.PI*2/count+t*0.2;const r=20+i*5;
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    ctx.globalCompositeOperation='screen';
    ctx.fillStyle='rgba(0,255,200,0.3)';ctx.beginPath();ctx.arc(x+2,y,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,0,200,0.3)';ctx.beginPath();ctx.arc(x-2,y,4,0,Math.PI*2);ctx.fill();
    ctx.globalCompositeOperation='source-over';
  }
}
];

drawWireframes();
</script>
</body>
</html>
