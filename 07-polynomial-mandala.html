<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polynomial Mandala</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:22px;letter-spacing:8px;text-transform:uppercase;text-shadow:0 0 25px #f8f,0 0 50px #a0f,0 0 80px #60a;z-index:10}
#info{position:absolute;top:50px;left:50%;transform:translateX(-50%);color:#aaf;font-size:11px;letter-spacing:2px;z-index:10;opacity:0.6}
#ui{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10;flex-wrap:wrap;justify-content:center}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#daf;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;text-shadow:0 0 4px #a0f}
.ctrl input[type=range]{width:90px;accent-color:#f0f;cursor:pointer}
.ctrl .val{color:#f0f;font-size:11px;font-weight:bold;text-shadow:0 0 5px #f0f}
#presets{position:absolute;top:14px;right:14px;z-index:10;display:flex;gap:5px;flex-wrap:wrap;max-width:260px;justify-content:flex-end}
.pb{padding:3px 9px;background:rgba(255,0,255,0.05);border:1px solid #f0f3;color:#f8f;font-size:8px;cursor:pointer;border-radius:3px;text-transform:uppercase;letter-spacing:1px;transition:all .2s}
.pb:hover{background:rgba(255,0,255,0.2);text-shadow:0 0 6px #f0f}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Polynomial Mandala</div>
<div id="info">Бесконечная симметрия полиномиальных корней</div>
<div id="presets">
<button class="pb" onclick="lp(0)">Космос</button>
<button class="pb" onclick="lp(1)">Огонь</button>
<button class="pb" onclick="lp(2)">Лёд</button>
<button class="pb" onclick="lp(3)">Жизнь</button>
<button class="pb" onclick="lp(4)">Тьма</button>
<button class="pb" onclick="lp(5)">Золото</button>
</div>
<div id="ui">
<div class="ctrl"><label>Симметрия</label><input type="range" id="sym" min="3" max="24" value="8"><span class="val" id="symV">8</span></div>
<div class="ctrl"><label>Слои</label><input type="range" id="lay" min="1" max="12" value="6"><span class="val" id="layV">6</span></div>
<div class="ctrl"><label>Степень</label><input type="range" id="deg" min="2" max="10" value="5"><span class="val" id="degV">5</span></div>
<div class="ctrl"><label>Вращение</label><input type="range" id="rot" min="1" max="100" value="30"><span class="val" id="rotV">0.30</span></div>
<div class="ctrl"><label>Глубина</label><input type="range" id="dep" min="1" max="8" value="4"><span class="val" id="depV">4</span></div>
<div class="ctrl"><label>Пульс</label><input type="range" id="pul" min="0" max="100" value="50"><span class="val" id="pulV">0.50</span></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

const S={sym:'symV',lay:'layV',deg:'degV',rot:'rotV',dep:'depV',pul:'pulV'};
Object.keys(S).forEach(k=>{
  document.getElementById(k).addEventListener('input',()=>{
    const v=parseFloat(document.getElementById(k).value);
    let t=v+'';if(k==='rot'||k==='pul')t=(v/100).toFixed(2);
    document.getElementById(S[k]).textContent=t;
  });
});

const presets=[
  {sym:8,lay:6,deg:5,rot:30,dep:4,pul:50},
  {sym:6,lay:8,deg:7,rot:40,dep:5,pul:60},
  {sym:10,lay:5,deg:4,rot:20,dep:3,pul:40},
  {sym:7,lay:9,deg:6,rot:35,dep:6,pul:55},
  {sym:12,lay:4,deg:3,rot:15,dep:2,pul:30},
  {sym:5,lay:7,deg:8,rot:45,dep:7,pul:65},
];
function lp(i){const p=presets[i];Object.keys(p).forEach(k=>{document.getElementById(k).value=p[k];document.getElementById(k).dispatchEvent(new Event('input'));});}

function gv(id){return parseFloat(document.getElementById(id).value)}

let t=0;

const stars=Array.from({length:400},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.2+0.2,b:Math.random()}));

const mandalaParticles=Array.from({length:80},()=>({
  angle:Math.random()*Math.PI*2,
  radius:Math.random()*300+20,
  speed:Math.random()*0.005+0.002,
  size:Math.random()*1.5+0.5,
  alpha:Math.random()*0.4+0.1,
  hue:Math.random()*60-30
}));

const sacredGeometry=[];

function draw(){
  const sym=Math.round(gv('sym')),lay=Math.round(gv('lay')),deg=Math.round(gv('deg'));
  const rot=gv('rot')/100,dep=Math.round(gv('dep')),pul=gv('pul')/100;
  t+=0.01;

  X.fillStyle='rgba(5,5,16,0.03)';
  X.fillRect(0,0,W,H);

  const cx=W/2,cy=H/2,sc=Math.min(W,H)/10;

  // Background particles
  mandalaParticles.forEach(p=>{
    p.angle+=p.speed;
    const x=cx+Math.cos(p.angle)*p.radius;
    const y=cy+Math.sin(p.angle)*p.radius;
    const pulse=0.6+0.4*Math.sin(t*3+p.angle*2);
    X.fillStyle=`hsla(${(globalHue+p.hue)%360},50%,60%,${p.alpha*pulse})`;
    X.beginPath();X.arc(x,y,p.size*pulse,0,Math.PI*2);X.fill();
  });

  // Stars
  stars.forEach(s=>{
    const fl=0.2+0.15*Math.sin(t*1.2+s.b*10);
    X.fillStyle=`rgba(180,180,255,${fl*0.3})`;
    X.beginPath();X.arc(s.x*W,s.y*H,s.s,0,Math.PI*2);X.fill();
  });

  const globalHue=(t*10)%360;

  // Sacred geometry lines
  for(let i=0;i<sym;i++){
    const angle=i*Math.PI*2/sym+t*rot;
    const len=sc*2.5;
    const endX=cx+Math.cos(angle)*len;
    const endY=cy+Math.sin(angle)*len;
    const alpha=0.1+0.05*Math.sin(t*2+i);
    X.strokeStyle=`hsla(${(globalHue+i*30)%360},60%,50%,${alpha})`;
    X.lineWidth=0.5;
    X.beginPath();X.moveTo(cx,cy);X.lineTo(endX,endY);X.stroke();
  }

  // Main mandala layers
  for(let layer=0;layer<lay;layer++){
    const layerR=sc*(1+layer*0.7)*(0.9+0.1*Math.sin(t*pul*3+layer));
    const layerHue=(globalHue+layer*45)%360;
    const alpha=0.35-layer*0.02;

    // Petal shapes
    for(let s=0;s<sym;s++){
      const angle=s*Math.PI*2/sym+t*rot+layer*0.1;
      const nextAngle=(s+1)*Math.PI*2/sym+t*rot+layer*0.1;

      const r1=layerR*(0.7+0.3*Math.sin(t*0.5+s*2+layer));
      const r2=layerR*(0.7+0.3*Math.sin(t*0.5+(s+1)*2+layer));

      const p1x=cx+Math.cos(angle)*r1;
      const p1y=cy+Math.sin(angle)*r1;
      const p2x=cx+Math.cos(nextAngle)*r2;
      const p2y=cy+Math.sin(nextAngle)*r2;

      const midAngle=(angle+nextAngle)/2;
      const bulge=1+0.3*Math.sin(t*2+s*1.5+layer*0.7);
      const cpx=cx+Math.cos(midAngle)*layerR*bulge;
      const cpy=cy+Math.sin(midAngle)*layerR*bulge;

      const grad=X.createLinearGradient(p1x,p1y,cpx,cpy);
      grad.addColorStop(0,`hsla(${layerHue},85%,55%,${alpha})`);
      grad.addColorStop(0.5,`hsla(${(layerHue+30)%360},90%,65%,${alpha*0.8})`);
      grad.addColorStop(1,`hsla(${(layerHue+60)%360},80%,50%,${alpha*0.5})`);

      X.beginPath();
      X.moveTo(cx,cy);
      X.lineTo(p1x,p1y);
      X.quadraticCurveTo(cpx,cpy,p2x,p2y);
      X.closePath();
      X.fillStyle=grad;X.fill();

      X.strokeStyle=`hsla(${(layerHue+20)%360},70%,60%,${alpha*0.6})`;
      X.lineWidth=0.8;
      X.stroke();
    }

    // Ornamental rings
    for(let ring=0;ring<dep;ring++){
      const ringR=layerR*(0.3+ring*0.2);
      const ringHue=(layerHue+ring*25)%360;
      X.strokeStyle=`hsla(${ringHue},75%,60%,${0.12-ring*0.01})`;
      X.lineWidth=0.6;
      X.beginPath();
      for(let a=0;a<=Math.PI*2;a+=0.02){
        const wobble=1+0.15*Math.sin(a*sym+t*1.5+ring+layer);
        const rr=ringR*wobble;
        const px=cx+rr*Math.cos(a),py=cy+rr*Math.sin(a);
        a===0?X.moveTo(px,py):X.lineTo(px,py);
      }
      X.closePath();X.stroke();
    }

    // Decorative dots
    for(let s=0;s<sym;s++){
      const angle=s*Math.PI*2/sym+t*rot+layer*0.1;
      const tipR=layerR*(1.1+0.2*Math.sin(t*1.5+s+layer*0.4));
      const tx=cx+Math.cos(angle)*tipR;
      const ty=cy+Math.sin(angle)*tipR;

      const dotPulse=1+0.4*Math.sin(t*3+s*2+layer);
      const dotHue=(layerHue+s*15)%360;
      const grad=X.createRadialGradient(tx,ty,0,tx,ty,6*dotPulse);
      grad.addColorStop(0,`hsla(${dotHue},100%,90%,0.8)`);
      grad.addColorStop(0.5,`hsla(${dotHue},90%,70%,0.3)`);
      grad.addColorStop(1,`hsla(${dotHue},80%,50%,0)`);
      X.fillStyle=grad;X.beginPath();X.arc(tx,ty,6*dotPulse,0,Math.PI*2);X.fill();
    }
  }

  // Outer decorative rings
  for(let ring=0;ring<4;ring++){
    const r=sc*(0.5+ring*0.8);
    const hue=(globalHue+ring*60+90)%360;
    X.strokeStyle=`hsla(${hue},80%,60%,0.06)`;X.lineWidth=2;
    X.beginPath();
    for(let a=0;a<=Math.PI*2;a+=0.01){
      const w=1+0.2*Math.sin(a*sym*2+t*0.8+ring)+0.1*Math.sin(a*3+t*1.2);
      const px=cx+r*w*Math.cos(a),py=cy+r*w*Math.sin(a);
      a===0?X.moveTo(px,py):X.lineTo(px,py);
    }
    X.closePath();X.stroke();
  }

  // Core glow
  const corePulse=1+0.2*Math.sin(t*2);
  const coreGrad=X.createRadialGradient(cx,cy,0,cx,cy,sc*0.8*corePulse);
  coreGrad.addColorStop(0,`hsla(${(globalHue+180)%360},100%,95%,0.15)`);
  coreGrad.addColorStop(0.3,`hsla(${(globalHue+120)%360},90%,70%,0.08)`);
  coreGrad.addColorStop(1,`hsla(${globalHue},80%,40%,0)`);
  X.fillStyle=coreGrad;X.beginPath();X.arc(cx,cy,sc*0.8*corePulse,0,Math.PI*2);X.fill();

  // Central jewel
  const jewelPulse=1+0.3*Math.sin(t*4);
  const jewelGrad=X.createRadialGradient(cx,cy,0,cx,cy,8*jewelPulse);
  jewelGrad.addColorStop(0,'rgba(255,255,255,0.9)');
  jewelGrad.addColorStop(0.3,`hsla(${globalHue},100%,80%,0.6)`);
  jewelGrad.addColorStop(1,`hsla(${globalHue},80%,50%,0)`);
  X.fillStyle=jewelGrad;X.beginPath();X.arc(cx,cy,8*jewelPulse,0,Math.PI*2);X.fill();

  requestAnimationFrame(draw);
}

lp(0);draw();
</script>
</body>
</html>
