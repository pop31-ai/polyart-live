<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>26 — Постройка Дома — PolyArt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10;flex-wrap:wrap;justify-content:center}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#aaa;font-size:9px;text-transform:uppercase;letter-spacing:1.5px}
.ctrl input[type=range]{width:100px;accent-color:#fc0;cursor:pointer}
.ctrl .val{color:#ddd;font-size:11px;font-weight:bold}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 20px #fc05;z-index:10;opacity:0.4}
#stage-label{position:absolute;top:50px;left:50%;transform:translateX(-50%);color:#fc0;font-size:11px;letter-spacing:3px;z-index:10;opacity:0.6;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Постройка Дома</div>
<div id="stage-label"></div>
<div id="ui">
<div class="ctrl"><label>Этап</label><input type="range" id="stage" min="0" max="7" value="0" step="1"><span class="val" id="stageV">0/7</span></div>
<div class="ctrl"><label>Детали</label><input type="range" id="detail" min="0" max="3" value="1" step="1"><span class="val" id="detailV">1</span></div>
<div class="ctrl"><label>Авто</label><button id="autoBtn" style="background:none;border:1px solid #fc0;color:#fc0;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px">СТАРТ</button></div>
</div>
<script>
var C=document.getElementById('c'),X=C.getContext('2d'),W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

var stages=['Фундамент','Каркас','Стены','Перекрытия','Крыша','Инженерия','Отделка','Готово'];
var autoMode=false;
var autoTimer=0;
document.getElementById('stage').oninput=function(){document.getElementById('stageV').textContent=this.value+'/7';};
document.getElementById('detail').oninput=function(){document.getElementById('detailV').textContent=this.value;};
document.getElementById('autoBtn').onclick=function(){autoMode=!autoMode;this.textContent=autoMode?'СТОП':'СТАРТ';};

var t=0;

function F(pts,c){X.fillStyle=c;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.fill();}
function S(pts,c,w){if(w<=0)return;X.strokeStyle=c;X.lineWidth=w;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.stroke();}

function label(text,x,y,color,size){
  X.globalAlpha=0.5;X.font=(size||7)+'px monospace';X.fillStyle=color||'rgba(255,220,180,0.8)';X.textAlign='center';X.fillText(text,x,y);X.textAlign='left';X.globalAlpha=1;
}

function leaderLine(x1,y1,x2,y2,color){
  S([[x1,y1],[x2,y2]],color||'rgba(255,200,100,0.15)',0.3);
  X.fillStyle=color||'rgba(255,200,100,0.2)';X.beginPath();X.arc(x2,y2,1.5,0,Math.PI*2);X.fill();
}

// Stage 0: Foundation
function drawFoundation(cx,bottomY,s,detail){
  // Ground excavation
  F([cx-80*s,bottomY,cx+80*s,bottomY,cx+80*s,bottomY+15*s,cx-80*s,bottomY+15*s],'rgba(60,50,35,0.15)');
  
  // Footing
  F([cx-75*s,bottomY,cx+75*s,bottomY,cx+75*s,bottomY+8*s,cx-75*s,bottomY+8*s],'rgba(160,150,130,0.08)');
  S([cx-75*s,bottomY,cx+75*s,bottomY,cx+75*s,bottomY+8*s,cx-75*s,bottomY+8*s],'rgba(160,150,130,0.25)',0.7);
  
  // Rebar grid
  if(detail>=1){
    for(var rb=0;rb<8;rb++){
      var rbx=cx-70*s+rb*20*s;
      S([[rbx,bottomY+2*s],[rbx,bottomY+6*s]],'rgba(200,100,80,0.15)',0.3);
    }
    S([[cx-72*s,bottomY+4*s],[cx+72*s,bottomY+4*s]],'rgba(200,100,80,0.1)',0.3);
  }
  
  // Concrete pour lines
  if(detail>=2){
    for(var cl=0;cl<5;cl++){
      var clx=cx-60*s+cl*30*s;
      S([[clx,bottomY+1*s],[clx+5*s,bottomY+7*s]],'rgba(140,130,110,0.08)',0.3);
    }
  }
  
  // Labels
  if(detail>=1){
    label('ленточный фундамент',cx,bottomY+20*s,'rgba(200,180,140,0.6)',6);
    if(detail>=2){
      leaderLine(cx+75*s,bottomY+4*s,cx+95*s,bottomY+4*s);
      label('арматура ∅12',cx+110*s,bottomY+4*s,'rgba(200,150,100,0.5)',5);
      leaderLine(cx-75*s,bottomY+12*s,cx-95*s,bottomY+12*s);
      label('бетон М300',cx-110*s,bottomY+12*s,'rgba(180,170,150,0.5)',5);
    }
  }
}

// Stage 1: Frame
function drawFrame(cx,bottomY,s,detail){
  var frameH=60*s;
  var frameW=70*s;
  
  // Vertical posts
  for(var fp=0;fp<5;fp++){
    var fpx=cx-frameW+fp*frameW*0.5;
    S([[fpx,bottomY],[fpx,bottomY-frameH]],'rgba(180,150,100,0.25)',0.8);
    // Post base plate
    S([[fpx-4*s,bottomY],[fpx+4*s,bottomY]],'rgba(180,150,100,0.15)',0.4);
  }
  
  // Top beam
  S([[cx-frameW,bottomY-frameH],[cx+frameW,bottomY-frameH]],'rgba(180,150,100,0.2)',0.6);
  
  // Cross bracing
  if(detail>=1){
    S([[cx-frameW,bottomY],[cx-frameW*0.5,bottomY-frameH]],'rgba(160,130,80,0.1)',0.4);
    S([[cx+frameW,bottomY],[cx+frameW*0.5,bottomY-frameH]],'rgba(160,130,80,0.1)',0.4);
  }
  
  // Labels
  if(detail>=1){
    label('каркас из бруса 150×150',cx,bottomY-frameH-10*s,'rgba(200,180,140,0.6)',6);
    if(detail>=2){
      leaderLine(cx-frameW,bottomY-frameH*0.5,cx-frameW-15*s,bottomY-frameH*0.5);
      label('стойка',cx-frameW-25*s,bottomY-frameH*0.5,'rgba(180,160,120,0.5)',5);
      leaderLine(cx+frameW*0.5,bottomY-frameH,cx+frameW*0.5+5*s,bottomY-frameH-8*s);
      label('балка перекрытия',cx+frameW*0.5+20*s,bottomY-frameH-8*s,'rgba(180,160,120,0.5)',5);
    }
  }
}

// Stage 2: Walls
function drawWalls(cx,bottomY,s,detail){
  var wallH=55*s;
  var wallW=68*s;
  
  // Wall sheathing
  F([cx-wallW,bottomY,cx+wallW,bottomY,cx+wallW,bottomY-wallH,cx-wallW,bottomY-wallH],'rgba(200,190,170,0.04)');
  S([cx-wallW,bottomY,cx+wallW,bottomY,cx+wallW,bottomY-wallH,cx-wallW,bottomY-wallH],'rgba(200,190,170,0.15)',0.6);
  
  // OSB panel lines
  if(detail>=1){
    for(var op=0;op<4;op++){
      var opx=cx-wallW+op*wallW*0.5;
      S([[opx,bottomY],[opx,bottomY-wallH]],'rgba(180,170,150,0.06)',0.3);
    }
    S([[cx-wallW,bottomY-wallH*0.5],[cx+wallW,bottomY-wallH*0.5]],'rgba(180,170,150,0.06)',0.3);
  }
  
  // Window opening
  var winX=cx-15*s;
  var winY=bottomY-wallH*0.7;
  var winW=30*s;
  var winH=20*s;
  F([winX,winY,winX+winW,winY,winX+winW,winY+winH,winX,winY+winH],'rgba(10,15,25,0.2)');
  S([winX,winY,winX+winW,winY,winX+winW,winY+winH,winX,winY+winH],'rgba(180,200,220,0.2)',0.5);
  // Window frame
  S([[winX+winW*0.5,winY],[winX+winW*0.5,winY+winH]],'rgba(180,200,220,0.1)',0.3);
  S([[winX,winY+winH*0.5],[winX+winW,winY+winH*0.5]],'rgba(180,200,220,0.1)',0.3);
  
  // Door opening
  var doorX=cx+25*s;
  var doorY=bottomY;
  var doorW=18*s;
  var doorH=35*s;
  F([doorX,doorY,doorX+doorW,doorY,doorX+doorW,doorY-doorH,doorX,doorY-doorH],'rgba(10,15,25,0.2)');
  S([doorX,doorY,doorX+doorW,doorY,doorX+doorW,doorY-doorH,doorX,doorY-doorH],'rgba(180,160,120,0.2)',0.5);
  
  // Labels
  if(detail>=1){
    label('стены — OSB 12мм',cx,bottomY-wallH-10*s,'rgba(200,180,140,0.6)',6);
    if(detail>=2){
      leaderLine(winX+winW,winY+winH*0.5,winX+winW+15*s,winY+winH*0.5);
      label('проём окна',winX+winW+30*s,winY+winH*0.5,'rgba(180,200,220,0.5)',5);
      leaderLine(doorX+doorW,doorY-doorH*0.5,doorX+doorW+15*s,doorY-doorH*0.5);
      label('проём двери',doorX+doorW+30*s,doorY-doorH*0.5,'rgba(180,160,120,0.5)',5);
    }
    if(detail>=3){
      label('утеплитель 150мм внутри',cx,bottomY-wallH*0.3,'rgba(255,200,100,0.3)',5);
    }
  }
}

// Stage 3: Floor/ceiling joists
function drawJoists(cx,bottomY,s,detail){
  var joistY=bottomY-55*s;
  var joistW=70*s;
  
  // Joists
  for(var ji=0;ji<6;ji++){
    var jx=cx-joistW+ji*joistW*0.4;
    S([[jx,joistY],[jx,joistY-5*s]],'rgba(180,150,100,0.2)',0.5);
    S([[jx-3*s,joistY],[jx+3*s,joistY]],'rgba(180,150,100,0.12)',0.3);
  }
  
  // Subfloor
  F([cx-joistW,joistY-5*s,cx+joistW,joistY-5*s,cx+joistW,joistY-8*s,cx-joistW,joistY-8*s],'rgba(200,190,170,0.04)');
  S([cx-joistW,joistY-5*s,cx+joistW,joistY-5*s,cx+joistW,joistY-8*s,cx-joistW,joistY-8*s],'rgba(200,190,170,0.1)',0.4);
  
  // Labels
  if(detail>=1){
    label('перекрытие — доска 40мм',cx,joistY-15*s,'rgba(200,180,140,0.6)',6);
    if(detail>=2){
      leaderLine(cx+joistW,joistY-6*s,cx+joistW+15*s,joistY-6*s);
      label('лаги 50×150',cx+joistW+30*s,joistY-6*s,'rgba(180,160,120,0.5)',5);
    }
  }
}

// Stage 4: Roof
function drawRoof(cx,bottomY,s,detail){
  var roofBaseY=bottomY-55*s-8*s;
  var roofH=35*s;
  var roofW=80*s;
  
  // Rafters
  S([[cx-roofW,roofBaseY],[cx,roofBaseY-roofH]],'rgba(180,150,100,0.2)',0.7);
  S([[cx+roofW,roofBaseY],[cx,roofBaseY-roofH]],'rgba(180,150,100,0.2)',0.7);
  
  // Roof sheathing
  F([cx-roofW,roofBaseY,cx,roofBaseY-roofH,cx+roofW,roofBaseY],'rgba(160,140,100,0.04)');
  S([cx-roofW,roofBaseY,cx,roofBaseY-roofH,cx+roofW,roofBaseY],'rgba(160,140,100,0.15)',0.5);
  
  // Purlins
  if(detail>=1){
    for(var pl=0;pl<3;pl++){
      var ply=roofBaseY-roofH*(0.3+pl*0.2);
      var plw=roofW*(0.7-pl*0.2);
      S([[cx-plw,ply],[cx+plw,ply]],'rgba(160,140,100,0.1)',0.3);
    }
  }
  
  // Ridge beam
  S([[cx,roofBaseY-roofH],[cx,roofBaseY-roofH-5*s]],'rgba(180,150,100,0.15)',0.5);
  
  // Labels
  if(detail>=1){
    label('стропильная система',cx,roofBaseY-roofH-12*s,'rgba(200,180,140,0.6)',6);
    if(detail>=2){
      leaderLine(cx+roofW,roofBaseY,cx+roofW+10*s,roofBaseY+5*s);
      label('мауэрлат',cx+roofW+25*s,roofBaseY+5*s,'rgba(180,160,120,0.5)',5);
      leaderLine(cx,roofBaseY-roofH,cx+10*s,roofBaseY-roofH-5*s);
      label('конёк',cx+20*s,roofBaseY-roofH-5*s,'rgba(180,160,120,0.5)',5);
    }
  }
}

// Stage 5: Engineering
function drawEngineering(cx,bottomY,s,detail){
  var houseH=55*s+8*s+35*s;
  var houseY=bottomY-houseH;
  
  // Electrical
  if(detail>=1){
    // Wiring path
    S([[cx-40*s,bottomY-20*s],[cx-40*s,houseY+10*s],[cx-20*s,houseY+10*s]],'rgba(255,200,50,0.1)',0.3);
    // Outlet
    F([cx-42*s,bottomY-22*s,cx-38*s,bottomY-22*s,cx-38*s,bottomY-18*s,cx-42*s,bottomY-18*s],'rgba(255,200,50,0.06)');
    S([cx-42*s,bottomY-22*s,cx-38*s,bottomY-22*s,cx-38*s,bottomY-18*s,cx-42*s,bottomY-18*s],'rgba(255,200,50,0.15)',0.3);
  }
  
  // Plumbing
  if(detail>=2){
    S([[cx+30*s,bottomY],[cx+30*s,bottomY-30*s],[cx+20*s,bottomY-30*s]],'rgba(80,150,200,0.1)',0.3);
    S([[cx+30*s,bottomY-30*s],[cx+30*s,houseY+15*s]],'rgba(80,150,200,0.08)',0.3);
    // Pipe marker
    X.fillStyle='rgba(80,150,200,0.08)';X.beginPath();X.arc(cx+30*s,bottomY-30*s,2*s,0,Math.PI*2);X.fill();
  }
  
  // Ventilation
  if(detail>=3){
    S([[cx,bottomY-40*s],[cx,houseY+5*s]],'rgba(120,180,120,0.08)',0.3);
    // Vent opening
    S([[cx-3*s,houseY+5*s],[cx+3*s,houseY+5*s]],'rgba(120,180,120,0.1)',0.3);
  }
  
  // Labels
  if(detail>=1){
    label('инженерные сети',cx,bottomY+15*s,'rgba(200,200,150,0.6)',6);
    if(detail>=2){
      leaderLine(cx-40*s,bottomY-20*s,cx-55*s,bottomY-20*s);
      label('электрика',cx-65*s,bottomY-20*s,'rgba(255,200,50,0.5)',5);
      leaderLine(cx+30*s,bottomY-30*s,cx+45*s,bottomY-30*s);
      label('водоснабжение',cx+60*s,bottomY-30*s,'rgba(80,150,200,0.5)',5);
    }
    if(detail>=3){
      leaderLine(cx,houseY+5*s,cx+10*s,houseY);
      label('вентиляция',cx+25*s,houseY,'rgba(120,180,120,0.5)',5);
    }
  }
}

// Stage 6: Finishing
function drawFinishing(cx,bottomY,s,detail){
  var wallH=55*s;
  var wallW=68*s;
  
  // Exterior finish — siding
  for(var si=0;si<6;si++){
    var sy=bottomY-si*wallH/5.5;
    S([[cx-wallW,sy],[cx+wallW,sy]],'rgba(200,190,170,0.06)',0.3);
  }
  
  // Roofing material
  var roofBaseY=bottomY-wallH-8*s;
  var roofH=35*s;
  for(var ri=0;ri<5;ri++){
    var riy=roofBaseY-roofH*(0.2+ri*0.15);
    var riw=80*s*(0.8-ri*0.15);
    S([[cx-riw,riy+roofH*0.05],[cx+riw,riy+roofH*0.05]],'rgba(120,80,60,0.06)',0.3);
  }
  
  // Landscaping
  if(detail>=1){
    // Bush
    X.fillStyle='rgba(60,100,60,0.06)';X.beginPath();X.arc(cx-90*s,bottomY-8*s,8*s,0,Math.PI*2);X.fill();
    X.fillStyle='rgba(70,110,70,0.05)';X.beginPath();X.arc(cx-85*s,bottomY-12*s,6*s,0,Math.PI*2);X.fill();
    // Path
    S([[cx-20*s,bottomY],[cx-30*s,bottomY+15*s]],'rgba(160,150,130,0.08)',2);
  }
  
  // Labels
  if(detail>=1){
    label('отделка — фасад и кровля',cx,bottomY-wallH-45*s,'rgba(200,180,140,0.6)',6);
    if(detail>=2){
      leaderLine(cx+wallW,bottomY-wallH*0.5,cx+wallW+10*s,bottomY-wallH*0.5);
      label('сайдинг',cx+wallW+25*s,bottomY-wallH*0.5,'rgba(200,190,170,0.5)',5);
      leaderLine(cx+70*s,bottomY-wallH-20*s,cx+80*s,bottomY-wallH-25*s);
      label('металлочерепица',cx+95*s,bottomY-wallH-25*s,'rgba(180,100,80,0.5)',5);
    }
  }
}

// Stage 7: Complete house
function drawComplete(cx,bottomY,s,detail){
  var wallH=55*s;
  var wallW=68*s;
  var roofBaseY=bottomY-wallH-8*s;
  var roofH=35*s;
  
  // Full house silhouette with glow
  X.fillStyle='rgba(255,220,180,0.02)';
  X.beginPath();
  X.moveTo(cx-wallW-5*s,bottomY+2*s);
  X.lineTo(cx-wallW-5*s,roofBaseY);
  X.lineTo(cx,roofBaseY-roofH-5*s);
  X.lineTo(cx+wallW+5*s,roofBaseY);
  X.lineTo(cx+wallW+5*s,bottomY+2*s);
  X.closePath();
  X.fill();
  
  // Window glow
  F([cx-15*s,roofBaseY+wallH*0.3,cx+15*s,roofBaseY+wallH*0.3,cx+15*s,roofBaseY+wallH*0.3+20*s,cx-15*s,roofBaseY+wallH*0.3+20*s],'rgba(255,220,150,0.04)');
  
  // Door
  F([cx+25*s,bottomY,cx+43*s,bottomY,cx+43*s,bottomY-35*s,cx+25*s,bottomY-35*s],'rgba(100,80,60,0.08)');
  
  // Chimney
  S([[cx+40*s,roofBaseY-10*s],[cx+40*s,roofBaseY-roofH+5*s]],'rgba(160,140,120,0.15)',0.8);
  // Smoke
  for(var sm=0;sm<3;sm++){
    var smx=cx+40*s+Math.sin(t*0.5+sm)*3*s;
    var smy=roofBaseY-roofH+5*s-sm*8*s;
    X.fillStyle='rgba(200,200,210,'+(0.03-sm*0.008)+')';
    X.beginPath();X.arc(smx,smy,2*s+sm*s,0,Math.PI*2);X.fill();
  }
  
  // Label
  label('ДОМ ГОТОВ',cx,bottomY+20*s,'rgba(255,220,180,0.7)',8);
  if(detail>=1){
    label('总面积 ~120 м² · 3 комнаты · кухня · санузел',cx,bottomY+30*s,'rgba(200,180,150,0.4)',6);
  }
}

function draw(){
  var stage=parseInt(document.getElementById('stage').value);
  var detail=parseInt(document.getElementById('detail').value);
  
  // Auto advance
  if(autoMode){
    autoTimer+=0.016;
    if(autoTimer>2.5){
      autoTimer=0;
      stage=(stage+1)%8;
      document.getElementById('stage').value=stage;
      document.getElementById('stageV').textContent=stage+'/7';
      if(stage===0)detail=Math.min(detail+1,3);
    }
  }
  
  t+=0.016;
  
  // Background
  X.fillStyle='#080810';X.fillRect(0,0,W,H);
  
  // Ground line
  var groundY=H*0.72;
  S([[0,groundY],[W,groundY]],'rgba(80,70,55,0.1)',0.5);
  
  // Ground fill
  F([0,groundY,W,groundY,W,H,0,H],'rgba(40,35,25,0.08)');
  
  var cx=W/2;
  var s=Math.min(W,H)/600;
  
  // Stage label
  document.getElementById('stage-label').textContent=stages[stage];
  
  // Draw all completed stages
  if(stage>=0)drawFoundation(cx,groundY,s,detail);
  if(stage>=1)drawFrame(cx,groundY,s,detail);
  if(stage>=2)drawWalls(cx,groundY,s,detail);
  if(stage>=3)drawJoists(cx,groundY,s,detail);
  if(stage>=4)drawRoof(cx,groundY,s,detail);
  if(stage>=5)drawEngineering(cx,groundY,s,detail);
  if(stage>=6)drawFinishing(cx,groundY,s,detail);
  if(stage>=7)drawComplete(cx,groundY,s,detail);
  
  // Progress bar
  X.fillStyle='rgba(255,200,100,0.05)';X.fillRect(W*0.1,H-8,W*0.8,3);
  X.fillStyle='rgba(255,200,100,0.15)';X.fillRect(W*0.1,H-8,W*0.8*(stage/7),3);
  
  // Stage markers
  for(var sm2=0;sm2<8;sm2++){
    var smx2=W*0.1+W*0.8*(sm2/7);
    X.fillStyle=sm2<=stage?'rgba(255,200,100,0.3)':'rgba(255,200,100,0.08)';
    X.beginPath();X.arc(smx2,H-6.5,2,0,Math.PI*2);X.fill();
  }
  
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
