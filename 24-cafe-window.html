<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24 — Окно Кафе — PolyArt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0812;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#aaa;font-size:9px;text-transform:uppercase;letter-spacing:1.5px}
.ctrl input[type=range]{width:90px;accent-color:#fc0;cursor:pointer}
.ctrl .val{color:#ddd;font-size:11px;font-weight:bold}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 20px #fc05;z-index:10;opacity:0.4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Окно Кафе</div>
<div id="ui">
<div class="ctrl"><label>Ветер</label><input type="range" id="wind" min="0" max="2" value="1" step="0.1"><span class="val" id="windV">1</span></div>
<div class="ctrl"><label>Свет</label><input type="range" id="light" min="0.3" max="2" value="1" step="0.1"><span class="val" id="lightV">1</span></div>
<div class="ctrl"><label>Люди</label><input type="range" id="crowd" min="0" max="8" value="4" step="1"><span class="val" id="crowdV">4</span></div>
</div>
<script>
var C=document.getElementById('c'),X=C.getContext('2d'),W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

document.getElementById('wind').oninput=function(){document.getElementById('windV').textContent=this.value;};
document.getElementById('light').oninput=function(){document.getElementById('lightV').textContent=this.value;};
document.getElementById('crowd').oninput=function(){document.getElementById('crowdV').textContent=this.value;};

var t=0;

function F(pts,c){X.fillStyle=c;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.fill();}
function S(pts,c,w){if(w<=0)return;X.strokeStyle=c;X.lineWidth=w;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++){var p=pts[i];if(p.length>=6)X.bezierCurveTo(p[0],p[1],p[2],p[3],p[4],p[5]);else if(p.length>=4)X.quadraticCurveTo(p[0],p[1],p[2],p[3]);else X.lineTo(p[0],p[1]);}X.closePath();X.stroke();}

// Coffee cup — first person, on table
function drawCoffeeCup(cx,cy,t2){
  // Saucer
  X.fillStyle='rgba(200,190,170,0.06)';
  X.beginPath();
  X.ellipse(cx,cy+8,28,6,0,0,Math.PI*2);
  X.fill();
  S([[cx-28,cy+8],[cx+28,cy+8]],'rgba(200,190,170,0.2)',0.5);
  
  // Cup body
  X.fillStyle='rgba(220,210,195,0.08)';
  X.beginPath();
  X.moveTo(cx-18,cy-2);
  X.bezierCurveTo(cx-20,cy-18,cx-14,cy-28,cx,cy-30);
  X.bezierCurveTo(cx+14,cy-28,cx+20,cy-18,cx+18,cy-2);
  X.closePath();
  X.fill();
  S([cx-18,cy-2,[cx-20,cy-18,cx-14,cy-28,cx,cy-30],[cx+14,cy-28,cx+20,cy-18,cx+18,cy-2]],'rgba(200,190,175,0.35)',0.7);
  
  // Cup rim
  X.beginPath();
  X.ellipse(cx,cy-2,18,4,0,0,Math.PI*2);
  X.strokeStyle='rgba(200,190,175,0.3)';X.lineWidth=0.6;X.stroke();
  
  // Coffee surface
  X.fillStyle='rgba(80,45,20,0.15)';
  X.beginPath();
  X.ellipse(cx,cy-4,14,3,0,0,Math.PI*2);
  X.fill();
  
  // Coffee swirl
  X.strokeStyle='rgba(120,70,30,0.12)';X.lineWidth=0.4;
  X.beginPath();
  for(var sw=0;sw<Math.PI*4;sw+=0.1){
    var swr=sw*1.2;
    var swx=cx+Math.cos(sw+t2*0.3)*swr*0.08;
    var swy=cy-4+Math.sin(sw+t2*0.3)*swr*0.03;
    if(sw===0)X.moveTo(swx,swy);else X.lineTo(swx,swy);
  }
  X.stroke();
  
  // Handle
  S([cx+18,cy-8,[cx+26,cy-10,cx+28,cy,cx+24,cy+4],[cx+22,cy+6,cx+18,cy+6,cx+18,cy+2]],'rgba(200,190,175,0.25)',0.5);
  
  // Steam
  for(var st=0;st<3;st++){
    var stx=cx-4+st*4;
    var sty=cy-32;
    X.strokeStyle='rgba(220,210,200,'+(0.04+0.02*Math.sin(t2*1.5+st))+')';
    X.lineWidth=0.4;
    X.beginPath();
    for(var sy=0;sy<15;sy++){
      var syy=sty-sy*1.5;
      var sxx=stx+Math.sin(t2*0.8+sy*0.5+st)*3;
      if(sy===0)X.moveTo(sxx,syy);else X.lineTo(sxx,syy);
    }
    X.stroke();
  }
}

// Window frame
function drawWindowFrame(W2,H2){
  // Dark interior walls
  X.fillStyle='rgba(15,10,20,0.4)';
  X.fillRect(0,0,W2*0.15,H2);
  X.fillRect(W2*0.85,0,W2*0.15,H2);
  X.fillRect(0,0,W2,H2*0.12);
  
  // Window glass edge
  X.strokeStyle='rgba(100,90,80,0.15)';X.lineWidth=2;
  X.strokeRect(W2*0.15,H2*0.12,W2*0.7,H2*0.88);
  
  // Cross bar vertical
  S([[W2*0.5,H2*0.12],[W2*0.5,H2]],'rgba(80,70,60,0.12)',1.5);
  // Cross bar horizontal
  S([[W2*0.15,H2*0.5],[W2*0.85,H2*0.5]],'rgba(80,70,60,0.12)',1.5);
}

// Curtain
function drawCurtain(x,y,h,side,wind2,t2){
  var sway=Math.sin(t2*0.4)*8*wind2+Math.sin(t2*0.7)*3*wind2;
  var sway2=Math.sin(t2*0.35+0.5)*6*wind2;
  
  // Fabric
  var dir=side==='left'?1:-1;
  F([x,y,x+dir*35,y+h*0.1,[x+dir*35+sway,y+h*0.5,x+dir*30+sway2,y+h*0.8,x+dir*25,y+h]],'rgba(180,160,140,0.06)');
  S([x,y,x+dir*35,y+h*0.1,[x+dir*35+sway,y+h*0.5,x+dir*30+sway2,y+h*0.8,x+dir*25,y+h]],'rgba(180,160,140,0.18)',0.6);
  
  // Folds
  for(var fl=0;fl<4;fl++){
    var fy=y+h*(0.15+fl*0.2);
    var fx=x+dir*(30-fl*2);
    var fsw=sway*(1-fl*0.15);
    S([[fx,fy],[fx+dir*5+fsw,fy+h*0.05]],'rgba(180,160,140,0.08)',0.3);
  }
  
  // Tie-back
  var tieY=y+h*0.45;
  S([[x+dir*35+sway*0.5,tieY],[x+dir*15,tieY]],'rgba(160,140,120,0.15)',0.4);
}

// Street lamp
function drawStreetLamp(cx,cy,s2,t2){
  // Pole
  S([[cx,cy],[cx,cy-60*s2]],'rgba(120,110,100,0.25)',1.2);
  
  // Arm
  S([[cx,cy-60*s2],[cx+15*s2,cy-65*s2]],'rgba(120,110,100,0.2)',0.8);
  
  // Lamp housing
  F([cx+10*s2,cy-70*s2,cx+20*s2,cy-70*s2,cx+20*s2,cy-62*s2,cx+10*s2,cy-62*s2],'rgba(120,110,100,0.1)');
  S([cx+10*s2,cy-70*s2,cx+20*s2,cy-70*s2,cx+20*s2,cy-62*s2,cx+10*s2,cy-62*s2],'rgba(120,110,100,0.2)',0.5);
  
  // Light glow
  var glow=0.04+Math.sin(t2*0.5)*0.01;
  X.fillStyle='rgba(255,220,150,'+glow+')';
  X.beginPath();X.arc(cx+15*s2,cy-66*s2,18*s2,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(255,230,170,'+(glow*0.5)+')';
  X.beginPath();X.arc(cx+15*s2,cy-66*s2,30*s2,0,Math.PI*2);X.fill();
}

// Tram
function drawTram(startX,cy2,s2,speed,t2){
  var tramX=startX+Math.sin(t2*speed)*W*0.6;
  var tramW=60*s2;
  var tramH=25*s2;
  
  // Body
  F([tramX-tramW/2,cy2-tramH,tramX+tramW/2,cy2-tramH,tramX+tramW/2,cy2,tramX-tramW/2,cy2],'rgba(200,180,100,0.08)');
  S([tramX-tramW/2,cy2-tramH,tramX+tramW/2,cy2-tramH,tramX+tramW/2,cy2,tramX-tramW/2,cy2],'rgba(200,180,100,0.2)',0.7);
  
  // Roof
  S([[tramX-tramW*0.4,cy2-tramH],[tramX-tramW*0.3,cy2-tramH-6*s2],[tramX+tramW*0.3,cy2-tramH-6*s2],[tramX+tramW*0.4,cy2-tramH]],'rgba(180,160,80,0.15)',0.5);
  
  // Windows
  for(var tw=0;tw<4;tw++){
    var twx=tramX-tramW*0.3+tw*tramW*0.2;
    F([twx,cy2-tramH*0.8,twx+tramW*0.12,cy2-tramH*0.8,twx+tramW*0.12,cy2-tramH*0.3,twx,cy2-tramH*0.3],'rgba(255,240,200,0.06)');
    S([twx,cy2-tramH*0.8,twx+tramW*0.12,cy2-tramH*0.8,twx+tramW*0.12,cy2-tramH*0.3,twx,cy2-tramH*0.3],'rgba(255,240,200,0.12)',0.3);
  }
  
  // Wheels
  X.fillStyle='rgba(100,90,80,0.15)';
  X.beginPath();X.arc(tramX-tramW*0.3,cy2+2*s2,3*s2,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(tramX+tramW*0.3,cy2+2*s2,3*s2,0,Math.PI*2);X.fill();
  
  // Overhead wire
  S([[tramX,cy2-tramH-6*s2],[tramX+5*s2,cy2-tramH-25*s2]],'rgba(150,140,130,0.1)',0.3);
}

// Walking person
function drawPerson(px,py,s2,phase,speed2,t2){
  var walkX=px+Math.sin(t2*speed2+phase)*W*0.3;
  var bounce=Math.abs(Math.sin(t2*speed2*2+phase))*3*s2;
  
  // Legs
  var legSwing=Math.sin(t2*speed2*2+phase)*8*s2;
  S([[walkX,py],[walkX-legSwing*0.5,py-12*s2-bounce]],'rgba(180,170,160,0.15)',0.5);
  S([[walkX,py],[walkX+legSwing*0.5,py-12*s2-bounce]],'rgba(180,170,160,0.15)',0.5);
  
  // Body
  S([[walkX,py-12*s2-bounce],[walkX,py-25*s2-bounce]],'rgba(180,170,160,0.2)',0.6);
  
  // Arms
  var armSwing=Math.sin(t2*speed2*2+phase+Math.PI)*6*s2;
  S([[walkX,py-22*s2-bounce],[walkX-armSwing,py-18*s2-bounce]],'rgba(180,170,160,0.15)',0.4);
  S([[walkX,py-22*s2-bounce],[walkX+armSwing,py-18*s2-bounce]],'rgba(180,170,160,0.15)',0.4);
  
  // Head
  X.fillStyle='rgba(180,170,160,0.1)';X.beginPath();X.arc(walkX,py-28*s2-bounce,3*s2,0,Math.PI*2);X.fill();
  X.strokeStyle='rgba(180,170,160,0.15)';X.lineWidth=0.4;
  X.beginPath();X.arc(walkX,py-28*s2-bounce,3*s2,0,Math.PI*2);X.stroke();
}

// Rain drops on glass
function drawRaindrops(t2){
  for(var rd=0;rd<15;rd++){
    var rdx=Math.sin(rd*7.3)*W*0.35+W*0.5;
    var rdy=(t2*20+rd*40)%H;
    var rds=0.5+Math.sin(rd)*0.3;
    X.fillStyle='rgba(180,200,220,'+(0.03+0.01*Math.sin(t2+rd))+')';
    X.beginPath();X.ellipse(rdx,rdy,rds,rds*2,0,0,Math.PI*2);X.fill();
  }
}

// Table surface
function drawTable(H2){
  var tableY=H2*0.78;
  F([0,tableY,W,tableY,W,H,0,H],'rgba(30,25,20,0.3)');
  S([[0,tableY],[W,tableY]],'rgba(100,85,65,0.15)',0.8);
  
  // Wood grain
  for(var wg=0;wg<5;wg++){
    var wy=tableY+10+wg*15;
    S([[W*0.1,wy],[W*0.9,wy+Math.sin(wg)*3]],'rgba(80,65,45,0.04)',0.3);
  }
}

function draw(){
  var wind2=parseFloat(document.getElementById('wind').value);
  var light2=parseFloat(document.getElementById('light').value);
  var crowd=parseInt(document.getElementById('crowd').value);
  t+=0.016;
  
  // Street sky — dark evening
  X.fillStyle='#0c0a14';X.fillRect(0,0,W,H);
  
  // Street ambient glow
  var sg=X.createRadialGradient(W*0.5,H*0.4,0,W*0.5,H*0.4,W*0.5);
  sg.addColorStop(0,'rgba(255,200,120,'+(0.04*light2)+')');
  sg.addColorStop(1,'rgba(255,180,100,0)');
  X.fillStyle=sg;X.fillRect(0,0,W,H);
  
  var cx=W/2;
  var s=Math.min(W,H)/600;
  
  // Street ground
  var groundY=H*0.65;
  F([0,groundY,W,groundY,W,H*0.78,0,H*0.78],'rgba(40,35,30,0.15)');
  
  // Tram tracks
  S([[W*0.05,groundY+8*s],[W*0.95,groundY+8*s]],'rgba(120,110,100,0.08)',0.5);
  S([[W*0.05,groundY+12*s],[W*0.95,groundY+12*s]],'rgba(120,110,100,0.08)',0.5);
  
  // Street lamps
  drawStreetLamp(W*0.2,groundY,s,t);
  drawStreetLamp(W*0.5,groundY,s,t);
  drawStreetLamp(W*0.8,groundY,s,t);
  
  // Trams
  drawTram(W*0.3,groundY-2*s,0.8,0.15,t);
  drawTram(W*0.7,groundY-2*s,0.6,0.12,t+2);
  
  // People walking
  for(var pp=0;pp<crowd;pp++){
    drawPerson(W*0.1+pp*W*0.12,groundY-2*s,0.7,pp*1.5,0.4+pp*0.1,t);
  }
  
  // Distant buildings
  X.globalAlpha=0.04;
  for(var db=0;db<6;db++){
    var dbx=db*W/5.5;
    var dbh=H*0.15+Math.sin(db*1.7)*H*0.04;
    F([dbx,groundY-dbh,dbx+W/6,groundY-dbh,dbx+W/6,groundY,dbx,groundY],'rgba(180,170,160,0.3)');
    // Windows
    for(var dw=0;dw<3;dw++){
      var dwy=groundY-dbh*0.2-dw*dbh*0.25;
      X.fillStyle='rgba(255,230,180,0.15)';X.fillRect(dbx+W/6*0.3,dwy,W/6*0.15,dbh*0.08);
    }
  }
  X.globalAlpha=1;
  
  // Rain on glass
  drawRaindrops(t);
  
  // Table in foreground
  drawTable(H);
  
  // Coffee cup on table
  drawCoffeeCup(W*0.5,H*0.72,t);
  
  // Window frame
  drawWindowFrame(W,H);
  
  // Curtains
  drawCurtain(W*0.15,H*0.12,H*0.4,'left',wind2,t);
  drawCurtain(W*0.85,H*0.12,H*0.4,'right',wind2,t);
  
  // Interior warmth overlay
  X.fillStyle='rgba(40,30,20,0.08)';X.fillRect(0,0,W,H*0.12);
  X.fillRect(0,0,W*0.15,H);
  X.fillRect(W*0.85,0,W*0.15,H);
  
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
