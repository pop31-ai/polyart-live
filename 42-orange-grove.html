<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>42 — Роща Апельсинов — PolyArt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060608;overflow:hidden;font-family:sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10;flex-wrap:wrap;justify-content:center}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#aaa;font-size:9px;text-transform:uppercase;letter-spacing:1.5px}
.ctrl .val{color:#ddd;font-size:11px;font-weight:bold}
button.tog{background:none;border:1px solid #0af;color:#0af;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px;letter-spacing:1px}
button.tog:hover{background:rgba(0,170,255,0.1)}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 20px #0af5;z-index:10;opacity:0.4}
#part-label{position:absolute;top:50px;left:50%;transform:translateX(-50%);color:#0af;font-size:11px;letter-spacing:3px;z-index:10;opacity:0.6;text-align:center;max-width:600px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Роща Апельсинов</div>
<div id="part-label"></div>
<div id="ui">
<div class="ctrl"><label>Этап</label><button class="tog" id="prevBtn">&#9664;</button><span class="val" id="stageV">0/12</span><button class="tog" id="nextBtn">&#9654;</button></div>
<div class="ctrl"><label>Автосборка</label><button class="tog" id="autoBtn">СТАРТ</button></div>
<div class="ctrl"><label>Скорость</label><input type="range" id="speed" min="0" max="100" value="0" style="width:70px;accent-color:#0af"><span class="val" id="speedV">0</span></div>
</div>
<script>
var C=document.getElementById('c'),X=C.getContext('2d'),W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);
var stage=0,autoMode=false,autoTimer=0,maxStage=12,t=0;
document.getElementById('prevBtn').onclick=function(){if(stage>0){stage--;document.getElementById('stageV').textContent=stage+'/'+maxStage}};
document.getElementById('nextBtn').onclick=function(){if(stage<maxStage){stage++;document.getElementById('stageV').textContent=stage+'/'+maxStage}};
document.getElementById('autoBtn').onclick=function(){autoMode=!autoMode;this.textContent=autoMode?'СТОП':'СТАРТ'};
document.getElementById('speed').oninput=function(){document.getElementById('speedV').textContent=this.value};

var pts=['Почва · терракота · pH 6.5 · дренаж · 25°С · кальций','Саженец · 2 года · подвой · цитрус · 40см · корневая','Полив · капельный · 8л/день · таймер · фильтр · минералы','Удобрение · азот · фосфор · калий · магний · 4 раза в год','Обрезка · формирующая · санитарная · 15° · секатор · смола','Цветение · апрель · 500 цветков · аромат · пчёлы · нектар','Завязь · 3 недели · опад 60% · ветер · полив · стресс','Рост · 4 месяца · сок · сахар · кислота · фотосинтез','Созревание · октябрь · каротин · 12°С · сбор · лестница','Сбор · ручной · перчатки · секатор · корзина · 20кг','Сортировка · калибровка · мытьё · воск · упаковка · ящик','Отгрузка · рефрижератор · 4°С · 2000км · полка · магазин'];

function tree(x,y,s2,orangCount){
  // Trunk
  X.strokeStyle='rgba(120,80,40,0.08)';X.lineWidth=3*s2;
  X.beginPath();X.moveTo(x,y);X.lineTo(x,y-25*s2);X.stroke();
  // Branches
  X.lineWidth=1.5*s2;
  X.beginPath();X.moveTo(x,y-20*s2);X.lineTo(x-12*s2,y-30*s2);X.stroke();
  X.beginPath();X.moveTo(x,y-22*s2);X.lineTo(x+10*s2,y-32*s2);X.stroke();
  X.beginPath();X.moveTo(x,y-18*s2);X.lineTo(x-8*s2,y-28*s2);X.stroke();
  // Crown
  var crownR=18*s2;
  X.fillStyle='rgba(40,120,40,0.05)';X.beginPath();X.arc(x,y-30*s2,crownR,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(50,140,50,0.04)';X.beginPath();X.arc(x-5*s2,y-28*s2,crownR*0.8,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(45,130,45,0.03)';X.beginPath();X.arc(x+5*s2,y-32*s2,crownR*0.7,0,Math.PI*2);X.fill();
  // Oranges
  for(var o=0;o<orangCount;o++){
    var oa=o*2.4+Math.sin(o*7.3)*0.5;
    var or2=crownR*0.6;
    var ox=x+Math.cos(oa)*or2*(0.5+Math.sin(o*3.1)*0.3);
    var oy=y-30*s2+Math.sin(oa)*or2*0.5;
    X.fillStyle='rgba(255,160,30,'+(0.08+Math.sin(t+o)*0.02)+')';
    X.beginPath();X.arc(ox,oy,2.5*s2,0,Math.PI*2);X.fill();
    X.strokeStyle='rgba(200,120,20,0.06)';X.lineWidth=0.3;X.beginPath();X.arc(ox,oy,2.5*s2,0,Math.PI*2);X.stroke();
    // Highlight
    X.fillStyle='rgba(255,200,100,0.04)';X.beginPath();X.arc(ox-0.5*s2,oy-0.5*s2,1*s2,0,Math.PI*2);X.fill();
  }
  // Shadow
  X.fillStyle='rgba(0,0,0,0.015)';X.beginPath();X.ellipse(x+5*s2,y+2*s2,crownR*0.8,4*s2,0,0,Math.PI*2);X.fill();
}

function flower(x,y,s2,phase){
  var fAlpha=0.06+Math.sin(t*2+phase)*0.02;
  X.fillStyle='rgba(255,255,255,'+fAlpha+')';
  for(var p=0;p<5;p++){
    var pa=p*Math.PI*2/5;
    X.beginPath();X.ellipse(x+Math.cos(pa)*2*s2,y+Math.sin(pa)*2*s2,2*s2,1*s2,pa,0,Math.PI*2);X.fill();
  }
  X.fillStyle='rgba(255,230,100,'+(fAlpha*1.5)+')';X.beginPath();X.arc(x,y,1*s2,0,Math.PI*2);X.fill();
}

function sunbeam(x,y,w2,h2,angle){
  X.save();X.translate(x,y);X.rotate(angle);
  X.globalAlpha=0.008;X.fillStyle='rgba(255,220,150,1)';
  X.fillRect(-w2/2,0,w2,h2);
  X.globalAlpha=1;
  X.restore();
}

function lbl(t2,x,y,c,sz){X.globalAlpha=0.55;X.font=(sz||6)+'px monospace';X.fillStyle=c||'rgba(255,180,50,0.8)';X.textAlign='center';X.fillText(t2,x,y);X.textAlign='left';X.globalAlpha=1}

function draw(){
  var spd=parseInt(document.getElementById('speed').value);
  if(autoMode){autoTimer+=0.016;if(autoTimer>2.5){autoTimer=0;if(stage<maxStage){stage++;document.getElementById('stageV').textContent=stage+'/'+maxStage}else{autoMode=false;document.getElementById('autoBtn').textContent='СТАРТ'}}}
  t+=0.016;
  X.fillStyle='#060608';X.fillRect(0,0,W,H);
  var cx=W/2,gy=H*0.72,s=Math.min(W,H)/650;

  // Sky
  var sg=X.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'rgba(20,40,80,0.04)');sg.addColorStop(0.5,'rgba(40,80,120,0.03)');sg.addColorStop(1,'rgba(80,120,60,0.02)');
  X.fillStyle=sg;X.fillRect(0,0,W,gy);

  // Sun
  var sunX=W*0.8,sunY=H*0.15;
  X.fillStyle='rgba(255,220,100,0.04)';X.beginPath();X.arc(sunX,sunY,20*s,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(255,240,180,0.06)';X.beginPath();X.arc(sunX,sunY,12*s,0,Math.PI*2);X.fill();
  // Sunbeams
  for(var sb=0;sb<5;sb++){
    sunbeam(sunX,sunY,8*s+sb*3*s,200*s,sb*0.15+0.2);
  }

  // Hills
  X.fillStyle='rgba(60,100,40,0.02)';X.beginPath();
  X.moveTo(0,gy);X.quadraticCurveTo(W*0.3,gy-20*s,W*0.5,gy-5*s);
  X.quadraticCurveTo(W*0.7,gy+10*s,W,gy-10*s);X.lineTo(W,H);X.lineTo(0,H);X.fill();

  // Ground
  X.fillStyle='rgba(80,60,30,0.03)';X.fillRect(0,gy,W,H-gy);

  // === STAGE 0: Soil ===
  if(stage>=0){
    // Soil cross-section
    var soilX=cx-40*s,soilY=gy;
    X.fillStyle='rgba(150,80,40,0.04)';X.fillRect(soilX,soilY,80*s,30*s);
    // Layers
    X.fillStyle='rgba(120,70,30,0.03)';X.fillRect(soilX,soilY,80*s,8*s);
    X.fillStyle='rgba(100,60,25,0.03)';X.fillRect(soilX,soilY+8*s,80*s,10*s);
    X.fillStyle='rgba(80,50,20,0.03)';X.fillRect(soilX,soilY+18*s,80*s,12*s);
    // Stones
    for(var st=0;st<5;st++){
      X.fillStyle='rgba(140,130,120,0.04)';
      X.beginPath();X.arc(soilX+10*s+st*15*s,soilY+25*s,2*s,0,Math.PI*2);X.fill();
    }
    // pH indicator
    X.font=(3*s)+'px monospace';X.fillStyle='rgba(200,180,50,0.12)';X.textAlign='center';
    X.fillText('pH 6.5 · 25°С · кальций',cx,soilY+38*s);X.textAlign='left';
    lbl('почва · терракота · pH 6.5 · дренаж · кальций',cx,soilY-8*s,'rgba(200,180,50,0.5)',6);
  }

  // === STAGE 1: Seedling ===
  if(stage>=1){
    var seedX=cx,seedY=gy;
    // Small seedling
    X.strokeStyle='rgba(80,150,50,0.08)';X.lineWidth=1.5*s;
    X.beginPath();X.moveTo(seedX,seedY);X.lineTo(seedX,seedY-15*s);X.stroke();
    // Leaves
    X.fillStyle='rgba(60,140,40,0.06)';
    X.beginPath();X.ellipse(seedX-5*s,seedY-12*s,5*s,3*s,-0.3,0,Math.PI*2);X.fill();
    X.beginPath();X.ellipse(seedX+5*s,seedY-14*s,5*s,3*s,0.3,0,Math.PI*2);X.fill();
    // Pot
    X.fillStyle='rgba(180,100,50,0.04)';X.fillRect(seedX-8*s,seedY-2*s,16*s,8*s);
    X.strokeStyle='rgba(200,120,60,0.06)';X.lineWidth=0.4;X.strokeRect(seedX-8*s,seedY-2*s,16*s,8*s);
    // Root system
    X.strokeStyle='rgba(150,120,80,0.04)';X.lineWidth=0.5;
    X.beginPath();X.moveTo(seedX,seedY+6*s);X.lineTo(seedX-5*s,seedY+15*s);X.stroke();
    X.beginPath();X.moveTo(seedX,seedY+6*s);X.lineTo(seedX+5*s,seedY+15*s);X.stroke();
    X.beginPath();X.moveTo(seedX,seedY+6*s);X.lineTo(seedX,seedY+18*s);X.stroke();
    // Measurement
    X.strokeStyle='rgba(200,180,50,0.06)';X.lineWidth=0.3;
    X.beginPath();X.moveTo(seedX-12*s,seedY);X.lineTo(seedX-12*s,seedY-15*s);X.stroke();
    X.font=(2.5*s)+'px monospace';X.fillStyle='rgba(200,180,50,0.12)';X.textAlign='center';
    X.fillText('40см',seedX-18*s,seedY-7*s);X.textAlign='left';
    lbl('саженец · 2 года · подвой · 40см · корневая',cx,seedY-22*s,'rgba(200,180,50,0.5)',6);
  }

  // === STAGE 2: Drip irrigation ===
  if(stage>=2){
    // Main pipe
    X.strokeStyle='rgba(100,100,110,0.06)';X.lineWidth=2*s;
    X.beginPath();X.moveTo(W*0.1,gy+5*s);X.lineTo(W*0.9,gy+5*s);X.stroke();
    // Drip points
    for(var dp=0;dp<8;dp++){
      var dpX=W*0.15+dp*W*0.1;
      X.fillStyle='rgba(0,150,200,0.05)';X.beginPath();X.arc(dpX,gy+5*s,2*s,0,Math.PI*2);X.fill();
      // Water drops
      var dropY=gy+8*s+((t*15+dp*5)%15)*s;
      if(dropY<gy+22*s){
        X.fillStyle='rgba(0,150,200,'+(0.06*(1-(dropY-gy-8*s)/(14*s)))+')';
        X.beginPath();X.arc(dpX,dropY,1.5*(1-(dropY-gy-8*s)/(14*s)),0,Math.PI*2);X.fill();
      }
    }
    // Timer
    X.fillStyle='rgba(50,50,60,0.04)';X.fillRect(W*0.05,gy-5*s,12*s,10*s);
    X.strokeStyle='rgba(70,70,80,0.06)';X.lineWidth=0.3;X.strokeRect(W*0.05,gy-5*s,12*s,10*s);
    X.font=(2.5*s)+'px monospace';X.fillStyle='rgba(0,150,200,0.12)';X.textAlign='center';
    X.fillText('8л/день',W*0.11,gy+2*s);X.textAlign='left';
    lbl('полив · капельный · 8л/день · таймер · минералы',cx,gy+18*s,'rgba(0,150,200,0.5)',6);
  }

  // === STAGE 3: Fertilizer ===
  if(stage>=3){
    // NPKMg display
    var nuteX=cx,nuteY=gy-25*s;
    var nutrients=[['N','Азот',15],['P','Фосфор',8],['K','Калий',12],['Mg','Магний',5]];
    for(var n=0;n<nutrients.length;n++){
      var nx=nuteX-30*s+n*20*s;
      // Bottle
      X.fillStyle='rgba('+([80,120,150,100][n])+','+([80,60,40,70][n])+',50,0.04)';
      X.fillRect(nx-4*s,nuteY-10*s,8*s,15*s);
      X.strokeStyle='rgba('+([100,140,170,120][n])+','+([100,80,60,90][n])+',70,0.06)';
      X.lineWidth=0.3;X.strokeRect(nx-4*s,nuteY-10*s,8*s,15*s);
      // Liquid level
      X.fillStyle='rgba('+([80,120,150,100][n])+','+([80,60,40,70][n])+',50,'+(0.03+nutrients[n][2]/100*0.03)+')';
      X.fillRect(nx-3*s,nuteY+5*s-nutrients[n][2]/10*3*s,6*s,nutrients[n][2]/10*3*s);
      // Label
      X.font=(3*s)+'px monospace';X.fillStyle='rgba(200,180,50,0.12)';X.textAlign='center';
      X.fillText(nutrients[n][0],nx,nuteY+12*s);
    }
    X.textAlign='left';
    lbl('удобрение · N P K Mg · 4 раза в год',nuteY+20*s,'rgba(200,180,50,0.5)',6);
  }

  // === STAGE 4: Pruning ===
  if(stage>=4){
    var prX=cx,prY=gy-30*s;
    tree(prX,gy,s,8);
    // Pruning shears
    var shearsX=prX+15*s,shearsY=prY-15*s;
    X.strokeStyle='rgba(150,150,160,0.08)';X.lineWidth=1*s;
    X.beginPath();X.moveTo(shearsX,shearsY);X.lineTo(shearsX+8*s,shearsY-5*s);X.stroke();
    X.beginPath();X.moveTo(shearsX,shearsY);X.lineTo(shearsX+8*s,shearsY+5*s);X.stroke();
    // Cut branch falling
    X.strokeStyle='rgba(80,150,50,0.04)';X.lineWidth=0.8;
    X.beginPath();X.moveTo(prX+10*s,prY-25*s);X.lineTo(prX+15*s+Math.sin(t)*3*s,prY-20*s+Math.sin(t*0.5)*2*s);X.stroke();
    // Sap滴
    X.fillStyle='rgba(150,200,100,'+(0.04+Math.sin(t*2)*0.02)+')';
    X.beginPath();X.arc(prX+10*s,prY-25*s+2*s,1,0,Math.PI*2);X.fill();
    lbl('обрезка · формирующая · секатор · смола',prX,gy+18*s,'rgba(200,180,50,0.5)',6);
  }

  // === STAGE 5: Flowering ===
  if(stage>=5){
    // Multiple trees with flowers
    tree(W*0.2,gy,s,5);tree(W*0.5,gy,s,5);tree(W*0.8,gy,s,5);
    // Flowers everywhere
    for(var fl=0;fl<30;fl++){
      var flX=W*0.15+Math.sin(fl*3.7)*W*0.35+W*0.35;
      var flY=gy-30*s+Math.cos(fl*2.3)*12*s;
      flower(flX,flY,s,fl);
    }
    // Bees
    for(var bz=0;bz<4;bz++){
      var bzX=W*0.3+bz*W*0.15+Math.sin(t*2+bz)*10*s;
      var bzY=gy-35*s+Math.cos(t*3+bz)*5*s;
      X.fillStyle='rgba(255,220,50,0.05)';X.beginPath();X.arc(bzX,bzY,2*s,0,Math.PI*2);X.fill();
      // Wings
      X.fillStyle='rgba(200,200,255,0.03)';
      X.beginPath();X.ellipse(bzX-2*s,bzY-2*s,2*s,1*s,t*10,0,Math.PI*2);X.fill();
      X.beginPath();X.ellipse(bzX+2*s,bzY-2*s,2*s,1*s,t*10+1,0,Math.PI*2);X.fill();
    }
    // Aromatic waves
    for(var aw=0;aw<5;aw++){
      X.strokeStyle='rgba(255,200,255,'+(0.02-aw*0.003)+')';X.lineWidth=0.3;
      X.beginPath();X.arc(cx,gy-30*s,20*s+aw*8*s+Math.sin(t+aw)*3,Math.PI*1.2,Math.PI*1.8);X.stroke();
    }
    lbl('цветение · апрель · 500 цветков · аромат · пчёлы',cx,gy+18*s,'rgba(255,200,255,0.5)',6);
  }

  // === STAGE 6: Fruit set ===
  if(stage>=6){
    tree(cx,gy,s,0);
    // Small green fruits
    for(var gf=0;gf<12;gf++){
      var gfa=gf*2.1+Math.sin(gf*5.3)*0.4;
      var gr=14*s;
      var gfx=cx+Math.cos(gfa)*gr*0.5;
      var gfy=gy-30*s+Math.sin(gfa)*gr*0.4;
      X.fillStyle='rgba(100,180,50,0.06)';X.beginPath();X.arc(gfx,gfy,2*s,0,Math.PI*2);X.fill();
    }
    // Falling fruits
    for(var ff=0;ff<4;ff++){
      var ffa=ff*1.5+0.5;
      var ffx=cx+Math.cos(ffa)*14*s*0.5;
      var ffy=gy-20*s+((t*10+ff*8)%30)*s;
      if(ffy<gy+5*s){
        X.fillStyle='rgba(100,180,50,'+(0.04*(1-ffy/gy))+')';X.beginPath();X.arc(ffx,ffy,1.5,0,Math.PI*2);X.fill();
      }
    }
    // 60% opad label
    X.font=(3*s)+'px monospace';X.fillStyle='rgba(200,180,50,0.12)';X.textAlign='center';
    X.fillText('опад 60% · 3 недели',cx,gy+15*s);X.textAlign='left';
    lbl('завязь · 3 недели · опад 60% · стресс',cx,gy+22*s,'rgba(200,180,50,0.5)',6);
  }

  // === STAGE 7: Growth ===
  if(stage>=7){
    tree(cx,gy,s,8);
    // Sugar/acid visualization
    var gaX=cx+35*s,gaY=gy-25*s;
    // Growing fruit cross-section
    X.fillStyle='rgba(255,180,50,0.04)';X.beginPath();X.arc(gaX,gaY,8*s,0,Math.PI*2);X.fill();
    X.strokeStyle='rgba(255,160,30,0.06)';X.lineWidth=0.4;X.beginPath();X.arc(gaX,gaY,8*s,0,Math.PI*2);X.stroke();
    // Segments
    for(var sg2=0;sg2<8;sg2++){
      var sga=sg2*Math.PI/4;
      X.strokeStyle='rgba(255,200,100,0.04)';X.lineWidth=0.2;
      X.beginPath();X.moveTo(gaX,gaY);X.lineTo(gaX+Math.cos(sga)*7*s,gaY+Math.sin(sga)*7*s);X.stroke();
    }
    // Growth indicator
    var growth=40+Math.sin(t*0.3)*10;
    X.font=(2.5*s)+'px monospace';X.fillStyle='rgba(255,180,50,0.12)';X.textAlign='center';
    X.fillText('сахар '+growth.toFixed(0)+'%',gaX,gaY+14*s);X.fillText('4 месяца',gaX,gaY+18*s);X.textAlign='left';
    lbl('рост · 4 месяца · сок · сахар · фотосинтез',cx,gy+18*s,'rgba(255,180,50,0.5)',6);
  }

  // === STAGE 8: Ripening ===
  if(stage>=8){
    tree(cx,gy,s,12);
    // October color shift
    X.fillStyle='rgba(255,140,20,0.02)';X.fillRect(0,0,W,gy);
    // Ladder
    var ladX=cx+20*s,ladY=gy;
    X.strokeStyle='rgba(120,80,40,0.06)';X.lineWidth=1;
    X.beginPath();X.moveTo(ladX,ladY);X.lineTo(ladX-5*s,gy-40*s);X.stroke();
    X.beginPath();X.moveTo(ladX+8*s,ladY);X.lineTo(ladX+3*s,gy-40*s);X.stroke();
    // Rungs
    for(var rg=0;rg<5;rg++){
      var rgY=gy-5*s-rg*7*s;
      X.beginPath();X.moveTo(ladX+rg*0.5*s-2*s,rgY);X.lineTo(ladX+8*s+rg*0.5*s-2*s,rgY);X.stroke();
    }
    // Temperature
    X.font=(3*s)+'px monospace';X.fillStyle='rgba(255,140,50,0.12)';X.textAlign='center';
    X.fillText('октябрь · 12°С · каротин',cx,gy+15*s);X.textAlign='left';
    lbl('созревание · октябрь · 12°С · сбор · лестница',cx,gy+22*s,'rgba(255,140,50,0.5)',6);
  }

  // === STAGE 9: Harvest ===
  if(stage>=9){
    tree(cx-40*s,gy,s,10);tree(cx+40*s,gy,s,10);
    // Basket
    var basX=cx,basY=gy+5*s;
    X.fillStyle='rgba(160,120,60,0.04)';X.beginPath();
    X.moveTo(basX-12*s,basY);X.lineTo(basX-15*s,basY+10*s);X.lineTo(basX+15*s,basY+10*s);X.lineTo(basX+12*s,basY);X.closePath();X.fill();
    X.strokeStyle='rgba(180,140,80,0.06)';X.lineWidth=0.4;X.stroke();
    // Oranges in basket
    for(var ob=0;ob<8;ob++){
      var obx=basX-10*s+ob*3*s;
      var oby=basY+3*s+Math.sin(ob)*2*s;
      X.fillStyle='rgba(255,160,30,0.06)';X.beginPath();X.arc(obx,oby,2*s,0,Math.PI*2);X.fill();
    }
    // Gloved hand
    X.fillStyle='rgba(200,180,150,0.05)';X.beginPath();X.arc(basX+18*s,basY-5*s,3*s,0,Math.PI*2);X.fill();
    // Scissors
    X.strokeStyle='rgba(150,150,160,0.06)';X.lineWidth=0.8;
    X.beginPath();X.moveTo(basX+15*s,basY-8*s);X.lineTo(basX+20*s,basY-12*s);X.stroke();
    X.beginPath();X.moveTo(basX+15*s,basY-8*s);X.lineTo(basX+20*s,basY-5*s);X.stroke();
    // Weight
    X.font=(3*s)+'px monospace';X.fillStyle='rgba(255,160,30,0.12)';X.textAlign='center';
    X.fillText('20кг',basX,basY+18*s);X.textAlign='left';
    lbl('сбор · ручной · перчатки · секатор · 20кг',cx,gy+25*s,'rgba(255,160,30,0.5)',6);
  }

  // === STAGE 10: Sorting ===
  if(stage>=10){
    // Sorting line
    X.strokeStyle='rgba(100,100,110,0.05)';X.lineWidth=2;
    X.beginPath();X.moveTo(W*0.2,gy-5*s);X.lineTo(W*0.8,gy-5*s);X.stroke();
    // Oranges on belt
    for(var so=0;so<10;so++){
      var soX=W*0.2+so*W*0.06+Math.sin(t+so)*2;
      X.fillStyle='rgba(255,160,30,0.06)';X.beginPath();X.arc(soX,gy-8*s,3*s,0,Math.PI*2);X.fill();
    }
    // Washing spray
    for(var ws=0;ws<5;ws++){
      var wsX=W*0.4+ws*5*s;
      X.strokeStyle='rgba(100,200,255,'+(0.03+Math.sin(t*3+ws)*0.01)+')';X.lineWidth=0.3;
      X.beginPath();X.moveTo(wsX,gy-18*s);X.lineTo(wsX+Math.sin(t+ws)*3,gy-8*s);X.stroke();
    }
    // Wax coating
    X.fillStyle='rgba(255,255,200,0.02)';X.fillRect(W*0.6,gy-12*s,20*s,8*s);
    // Boxes
    for(var bx2=0;bx2<3;bx2++){
      var boxX=W*0.7+bx2*15*s;
      X.fillStyle='rgba(160,120,60,0.04)';X.fillRect(boxX-5*s,gy+2*s,10*s,8*s);
      X.strokeStyle='rgba(180,140,80,0.06)';X.lineWidth=0.3;X.strokeRect(boxX-5*s,gy+2*s,10*s,8*s);
    }
    lbl('сортировка · калибровка · мытьё · воск · упаковка',cx,gy+18*s,'rgba(200,180,50,0.5)',6);
  }

  // === STAGE 11: Final ===
  if(stage>=11){
    // Refrigerated truck
    var trX=W*0.5,trY=gy+10*s;
    X.fillStyle='rgba(200,200,210,0.04)';X.fillRect(trX-30*s,trY-15*s,60*s,18*s);
    X.strokeStyle='rgba(180,180,190,0.06)';X.lineWidth=0.5;X.strokeRect(trX-30*s,trY-15*s,60*s,18*s);
    // Cab
    X.fillStyle='rgba(180,180,190,0.04)';X.fillRect(trX+30*s,trY-12*s,15*s,15*s);
    // Wheels
    X.fillStyle='rgba(60,60,70,0.05)';X.beginPath();X.arc(trX-20*s,trY+5*s,4*s,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(trX+15*s,trY+5*s,4*s,0,Math.PI*2);X.fill();
    // Temperature
    X.font=(3*s)+'px monospace';X.fillStyle='rgba(100,200,255,0.12)';X.textAlign='center';
    X.fillText('4°С · 2000км',trX,trY-2*s);X.textAlign='left';
    // Boxes inside
    for(var tb=0;tb<5;tb++){
      X.fillStyle='rgba(160,120,60,0.03)';X.fillRect(trX-25*s+tb*10*s,trY-12*s,8*s,10*s);
    }
    // Store shelf
    var shX=W*0.85,shY=gy-10*s;
    X.strokeStyle='rgba(150,150,160,0.05)';X.lineWidth=0.5;
    X.beginPath();X.moveTo(shX-10*s,shY);X.lineTo(shX+10*s,shY);X.stroke();
    X.beginPath();X.moveTo(shX-10*s,shY+8*s);X.lineTo(shX+10*s,shY+8*s);X.stroke();
    // Oranges on shelf
    for(var os=0;os<4;os++){
      X.fillStyle='rgba(255,160,30,0.05)';X.beginPath();X.arc(shX-6*s+os*4*s,shY-2*s,2*s,0,Math.PI*2);X.fill();
      X.beginPath();X.arc(shX-6*s+os*4*s,shY+6*s,2*s,0,Math.PI*2);X.fill();
    }
    // Price tag
    X.font=(2.5*s)+'px monospace';X.fillStyle='rgba(255,200,100,0.1)';X.textAlign='center';
    X.fillText('₽/кг',shX,shY+15*s);X.textAlign='left';
    lbl('рефрижератор · 4°С · 2000км · полка · магазин',cx,gy+25*s,'rgba(255,160,30,0.6)',7);
  }

  document.getElementById('part-label').textContent=pts[stage]||'';
  X.fillStyle='rgba(255,160,30,0.04)';X.fillRect(W*0.1,H-8,W*0.8,3);
  X.fillStyle='rgba(255,160,30,0.12)';X.fillRect(W*0.1,H-8,W*0.8*(stage/maxStage),3);
  for(var sd=0;sd<=maxStage;sd++){X.fillStyle=sd<=stage?'rgba(255,160,30,0.25)':'rgba(255,160,30,0.06)';X.beginPath();X.arc(W*0.1+W*0.8*(sd/maxStage),H-6.5,2,0,Math.PI*2);X.fill()}
  requestAnimationFrame(draw);
}
draw();
</script></body></html>
