<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polynomial Ocean</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020810;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10;flex-wrap:wrap;justify-content:center}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:3px}
.ctrl label{color:#8cf;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;text-shadow:0 0 6px #08f}
.ctrl input[type=range]{width:100px;accent-color:#0ff;cursor:pointer}
.ctrl .val{color:#0ff;font-size:12px;font-weight:bold;text-shadow:0 0 8px #0ff}
#title{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:20px;letter-spacing:6px;text-transform:uppercase;text-shadow:0 0 20px #0af,0 0 40px #08f;z-index:10}
#preset{position:absolute;top:16px;right:16px;z-index:10;display:flex;gap:6px;flex-wrap:wrap;max-width:220px;justify-content:flex-end}
.pb{padding:4px 10px;background:rgba(0,150,255,0.06);border:1px solid #0af3;color:#0cf;font-size:9px;cursor:pointer;border-radius:3px;text-transform:uppercase;letter-spacing:1px;transition:all .2s}
.pb:hover{background:rgba(0,150,255,0.2);text-shadow:0 0 6px #0af}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Polynomial Ocean</div>
<div id="preset">
<button class="pb" onclick="lp(0)">Спокойствие</button>
<button class="pb" onclick="lp(1)">Шторм</button>
<button class="pb" onclick="lp(2)">Прибой</button>
<button class="pb" onclick="lp(3)">Глубина</button>
</div>
<div id="ui">
<div class="ctrl"><label>Волны</label><input type="range" id="waves" min="3" max="12" value="6"><span class="val" id="wavesV">6</span></div>
<div class="ctrl"><label>Высота</label><input type="range" id="height" min="10" max="80" value="35"><span class="val" id="heightV">35</span></div>
<div class="ctrl"><label>Скорость</label><input type="range" id="speed" min="1" max="100" value="40"><span class="val" id="speedV">0.40</span></div>
<div class="ctrl"><label>Пена</label><input type="range" id="foam" min="0" max="100" value="50"><span class="val" id="foamV">0.50</span></div>
<div class="ctrl"><label>Глубина</label><input type="range" id="depth" min="1" max="6" value="3"><span class="val" id="depthV">3</span></div>
<div class="ctrl"><label>Палитра</label><input type="range" id="hue" min="180" max="240" value="210"><span class="val" id="hueV">210°</span></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

const S={waves:'wavesV',height:'heightV',speed:'speedV',foam:'foamV',depth:'depthV',hue:'hueV'};
Object.keys(S).forEach(k=>{
  document.getElementById(k).addEventListener('input',()=>{
    const v=parseFloat(document.getElementById(k).value);
    let t=v+'';if(k==='speed'||k==='foam')t=(v/100).toFixed(2);
    document.getElementById(S[k]).textContent=t;
  });
});

const presets=[
  {waves:6,height:35,speed:40,foam:50,depth:3,hue:210},
  {waves:10,height:60,speed:70,foam:30,depth:4,hue:200},
  {waves:8,height:45,speed:55,foam:60,depth:2,hue:195},
  {waves:4,height:25,speed:25,foam:70,depth:6,hue:220},
];
function lp(i){const p=presets[i];Object.keys(p).forEach(k=>{document.getElementById(k).value=p[k];document.getElementById(k).dispatchEvent(new Event('input'));});}

function gv(id){return parseFloat(document.getElementById(id).value)}

let t=0;
const bubbles=Array.from({length:50},()=>({
  x:Math.random()*2000,y:Math.random()*1000+500,
  size:Math.random()*4+1,
  speed:Math.random()*0.5+0.2,
  wobble:Math.random()*Math.PI*2
}));

const fish=Array.from({length:8},()=>({
  x:Math.random()*2000,y:Math.random()*400+600,
  speed:Math.random()*1+0.5,
  size:Math.random()*8+4,
  dir:Math.random()>0.5?1:-1,
  hue:Math.random()*60+30
}));

function draw(){
  const nWaves=Math.round(gv('waves')),hMax=gv('height'),spd=gv('speed')/100,foam=gv('foam')/100,dep=Math.round(gv('depth')),hue=gv('hue');
  t+=spd*0.016;

  // Sky gradient
  const skyGrad=X.createLinearGradient(0,0,0,H*0.5);
  skyGrad.addColorStop(0,`hsl(${hue-30},40%,8%)`);
  skyGrad.addColorStop(0.5,`hsl(${hue-15},50%,12%)`);
  skyGrad.addColorStop(1,`hsl(${hue},60%,18%)`);
  X.fillStyle=skyGrad;X.fillRect(0,0,W,H*0.5);

  // Stars
  for(let i=0;i<100;i++){
    const sx=(i*137.5)%W,sy=(i*97.3)%Math.floor(H*0.4);
    const fl=0.3+0.2*Math.sin(t*2+i);
    X.fillStyle=`rgba(200,200,255,${fl*0.4})`;
    X.beginPath();X.arc(sx,sy,0.8,0,Math.PI*2);X.fill();
  }

  // Moon
  const moonX=W*0.8,moonY=H*0.12;
  const moonGrad=X.createRadialGradient(moonX,moonY,0,moonX,moonY,40);
  moonGrad.addColorStop(0,'rgba(255,255,220,0.9)');
  moonGrad.addColorStop(0.3,'rgba(255,255,200,0.4)');
  moonGrad.addColorStop(1,'rgba(255,255,180,0)');
  X.fillStyle=moonGrad;X.beginPath();X.arc(moonX,moonY,40,0,Math.PI*2);X.fill();

  // Moon reflection on water
  const reflY=H*0.55;
  X.fillStyle=`hsla(${hue},60%,60%,0.03)`;
  for(let i=0;i<20;i++){
    const rx=moonX+(Math.random()-0.5)*30;
    const ry=reflY+Math.random()*100;
    X.beginPath();X.arc(rx,ry,Math.random()*3+1,0,Math.PI*2);X.fill();
  }

  // Ocean waves
  for(let layer=0;layer<dep;layer++){
    const layerY=H*0.45+layer*35;
    const layerHue=(hue+layer*10)%360;
    const alpha=0.6-layer*0.08;

    X.beginPath();
    X.moveTo(0,H);
    for(let x=0;x<=W;x+=3){
      let y=layerY;
      for(let w=0;w<nWaves;w++){
        const freq=0.003+w*0.002+layer*0.001;
        const amp=hMax*(0.5+w*0.15)*(0.8+0.2*Math.sin(t*0.3+w));
        const phase=t*(0.8+w*0.3)+w*1.5+layer*0.5;
        y+=Math.sin(x*freq+phase)*amp;
      }
      X.lineTo(x,y);
    }
    X.lineTo(W,H);X.closePath();

    const waveGrad=X.createLinearGradient(0,layerY-20,0,layerY+60);
    waveGrad.addColorStop(0,`hsla(${layerHue},70%,45%,${alpha})`);
    waveGrad.addColorStop(0.5,`hsla(${layerHue+10},65%,35%,${alpha*0.8})`);
    waveGrad.addColorStop(1,`hsla(${layerHue+20},50%,20%,${alpha*0.5})`);
    X.fillStyle=waveGrad;X.fill();

    // Foam on crests
    if(foam>0){
      for(let x=0;x<W;x+=8){
        let y=layerY;
        for(let w=0;w<nWaves;w++){
          const freq=0.003+w*0.002+layer*0.001;
          const amp=hMax*(0.5+w*0.15)*(0.8+0.2*Math.sin(t*0.3+w));
          const phase=t*(0.8+w*0.3)+w*1.5+layer*0.5;
          y+=Math.sin(x*freq+phase)*amp;
        }
        const slope=Math.cos(x*0.003+t+layer)*0.5+0.5;
        if(slope>0.6){
          const foamAlpha=(slope-0.6)*foam*2;
          X.fillStyle=`rgba(200,220,255,${foamAlpha*0.3})`;
          X.beginPath();X.arc(x,y-2,2+slope*3,0,Math.PI*2);X.fill();
        }
      }
    }
  }

  // Underwater scene
  const waterTop=H*0.45+dep*35;

  // Underwater gradient
  const underGrad=X.createLinearGradient(0,waterTop,0,H);
  underGrad.addColorStop(0,`hsla(${hue},60%,25%,0.3)`);
  underGrad.addColorStop(1,`hsla(${hue+20},70%,10%,0.8)`);
  X.fillStyle=underGrad;X.fillRect(0,waterTop,W,H-waterTop);

  // Bubbles
  bubbles.forEach(b=>{
    b.y-=b.speed;
    b.x+=Math.sin(t*2+b.wobble)*0.5;
    if(b.y<waterTop){b.y=H;b.x=Math.random()*W;}
    const alpha=0.3+0.2*Math.sin(t+b.wobble);
    X.fillStyle=`hsla(${hue},50%,80%,${alpha})`;
    X.beginPath();X.arc(b.x,b.y,b.size,0,Math.PI*2);X.fill();
    X.strokeStyle=`hsla(${hue},60%,90%,${alpha*0.5})`;X.lineWidth=0.5;
    X.beginPath();X.arc(b.x,b.y,b.size,0,Math.PI*2);X.stroke();
  });

  // Fish
  fish.forEach(f=>{
    f.x+=f.speed*f.dir;
    if(f.x>W+50)f.x=-50;
    if(f.x<-50)f.x=W+50;
    f.y+=Math.sin(t*2+f.x*0.01)*0.3;

    X.save();
    X.translate(f.x,f.y);
    X.scale(f.dir,1);

    // Body
    X.fillStyle=`hsla(${f.hue},70%,55%,0.6)`;
    X.beginPath();
    X.ellipse(0,0,f.size,f.size*0.4,0,0,Math.PI*2);
    X.fill();

    // Tail
    X.beginPath();
    X.moveTo(-f.size,0);
    X.lineTo(-f.size-6,-4);
    X.lineTo(-f.size-6,4);
    X.closePath();
    X.fillStyle=`hsla(${f.hue},60%,45%,0.5)`;
    X.fill();

    // Eye
    X.fillStyle='rgba(255,255,255,0.8)';
    X.beginPath();X.arc(f.size*0.5,-1,1.5,0,Math.PI*2);X.fill();

    X.restore();
  });

  // Seaweed
  for(let i=0;i<15;i++){
    const sx=i*W/15+Math.sin(i*2)*20;
    const baseY=H-10;
    X.strokeStyle=`hsla(${120+i*5},50%,30%,0.3)`;
    X.lineWidth=2;
    X.beginPath();X.moveTo(sx,baseY);
    for(let y=0;y<60;y+=5){
      const sway=Math.sin(t*1.5+i+y*0.1)*8*(y/60);
      X.lineTo(sx+sway,baseY-y);
    }
    X.stroke();
  }

  requestAnimationFrame(draw);
}

lp(0);draw();
</script>
</body>
</html>
