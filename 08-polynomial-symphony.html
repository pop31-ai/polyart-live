<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polynomial Symphony</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08040e;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:22px;letter-spacing:8px;text-transform:uppercase;text-shadow:0 0 25px #ff0,0 0 50px #fa0,0 0 80px #f60;z-index:10}
#ui{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;flex-wrap:wrap;justify-content:center}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#ff8;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;text-shadow:0 0 4px #a60}
.ctrl input[type=range]{width:90px;accent-color:#ff0;cursor:pointer}
.ctrl .val{color:#ff0;font-size:11px;font-weight:bold;text-shadow:0 0 5px #ff0}
#presets{position:absolute;top:14px;right:14px;z-index:10;display:flex;gap:5px;flex-wrap:wrap;max-width:280px;justify-content:flex-end}
.pb{padding:3px 9px;background:rgba(255,200,0,0.05);border:1px solid #ff03;color:#ff8;font-size:8px;cursor:pointer;border-radius:3px;text-transform:uppercase;letter-spacing:1px;transition:all .2s}
.pb:hover{background:rgba(255,200,0,0.2);text-shadow:0 0 6px #ff0}
#encrypt{position:absolute;top:14px;left:14px;z-index:10;display:flex;flex-direction:column;gap:6px}
#encrypt input{background:rgba(255,255,255,0.05);border:1px solid #ff03;color:#ff0;padding:4px 8px;font-size:11px;border-radius:3px;width:200px;letter-spacing:1px}
#encrypt input::placeholder{color:#664}
#encrypt button{padding:4px 10px;background:rgba(255,200,0,0.08);border:1px solid #ff03;color:#ff0;font-size:9px;cursor:pointer;border-radius:3px;text-transform:uppercase;letter-spacing:1px}
#encrypt button:hover{background:rgba(255,200,0,0.25)}
#secret{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff0;font-size:28px;letter-spacing:8px;text-transform:uppercase;text-shadow:0 0 30px #ff0,0 0 60px #fa0;z-index:20;opacity:0;pointer-events:none;transition:opacity 1.5s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Polynomial Symphony</div>
<div id="encrypt">
<input type="text" id="msg" placeholder="Секретное сообщение..." maxlength="20">
<button onclick="encodeMsg()">Зашифровать</button>
</div>
<div id="secret"></div>
<div id="presets">
<button class="pb" onclick="lp(0)">Космос</button>
<button class="pb" onclick="lp(1)">Закат</button>
<button class="pb" onclick="lp(2)">Океан</button>
<button class="pb" onclick="lp(3)">Взрыв</button>
</div>
<div id="ui">
<div class="ctrl"><label>Частицы</label><input type="range" id="part" min="50" max="500" value="200"><span class="val" id="partV">200</span></div>
<div class="ctrl"><label>Сила</label><input type="range" id="pow" min="1" max="100" value="50"><span class="val" id="powV">50</span></div>
<div class="ctrl"><label>Вихри</label><input type="range" id="vort" min="1" max="20" value="5"><span class="val" id="vortV">5</span></div>
<div class="ctrl"><label>Шлейф</label><input type="range" id="trail" min="1" max="100" value="70"><span class="val" id="trailV">70</span></div>
<div class="ctrl"><label>Палитра</label><input type="range" id="pal" min="0" max="4" value="0"><span class="val" id="palV">0</span></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

const S={part:'partV',pow:'powV',vort:'vortV',trail:'trailV',pal:'palV'};
Object.keys(S).forEach(k=>{
  document.getElementById(k).addEventListener('input',()=>{
    const v=parseFloat(document.getElementById(k).value);
    document.getElementById(S[k]).textContent=v;
    initParticles();
  });
});

const presets=[
  {part:200,pow:50,vort:5,trail:70,pal:0},
  {part:300,pow:40,vort:8,trail:80,pal:1},
  {part:150,pow:60,vort:3,trail:60,pal:2},
  {part:400,pow:80,vort:12,trail:50,pal:3},
];
function lp(i){const p=presets[i];Object.keys(p).forEach(k=>{document.getElementById(k).value=p[k];document.getElementById(k).dispatchEvent(new Event('input'));});}

function gv(id){return parseFloat(document.getElementById(id).value)}

let encodedCoeffs=null;
let secretText='';
let revealPhase=0;

function encodeMsg(){
  const msg=document.getElementById('msg').value.trim();
  if(!msg)return;
  secretText=msg;
  encodedCoeffs=[];
  for(let i=0;i<msg.length;i++){
    encodedCoeffs.push(msg.charCodeAt(i)/127-0.5);
  }
  revealPhase=0;
}

let particles=[];
function initParticles(){
  const n=Math.round(gv('part'));
  particles=[];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*Math.min(W,H)*0.4;
    particles.push({
      x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,
      vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,
      life:Math.random(),maxLife:0.5+Math.random()*0.5,
      size:Math.random()*2+0.5,
      hue:Math.random()*360
    });
  }
}
initParticles();

const palettes=[
  (h)=>[h,85,65],
  (h)=>[(h*0.3+180)%360,80,55],
  (h)=>[(h*0.5+200)%360,75,50],
  (h)=>[h%60,90,60],
  (h)=>[(h*0.7+30)%360,70,45],
];

let t=0;
function draw(){
  const pow=gv('pow')/100,vortN=Math.round(gv('vort')),trail=gv('trail')/100;
  const palIdx=Math.round(gv('pal'))%5;
  const pal=palettes[palIdx];
  t+=0.016;

  X.fillStyle=`rgba(8,4,14,${0.03+trail*0.08})`;
  X.fillRect(0,0,W,H);

  const cx=W/2,cy=H/2;

  const vortices=[];
  for(let i=0;i<vortN;i++){
    const a=i*Math.PI*2/vortN+t*0.15;
    const r=Math.min(W,H)*0.2*(0.6+0.4*Math.sin(t*0.3+i*1.5));
    vortices.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,strength:pow*80});
  }

  if(encodedCoeffs){
    revealPhase=Math.min(1,revealPhase+0.003);
    const el=document.getElementById('secret');
    const chars=Math.floor(secretText.length*revealPhase);
    el.textContent=secretText.substring(0,chars);
    el.style.opacity=Math.min(1,revealPhase*1.5);
  }

  particles.forEach(p=>{
    let fx=0,fy=0;
    vortices.forEach(v=>{
      const dx=v.x-p.x,dy=v.y-p.y;
      const d=Math.max(Math.hypot(dx,dy),10);
      fx+=(-dy/d)*v.strength/(d*d)*50;
      fy+=(dx/d)*v.strength/(d*d)*50;
    });

    if(encodedCoeffs){
      const phase=t*0.5;
      for(let i=0;i<encodedCoeffs.length;i++){
        const ca=i*Math.PI*2/encodedCoeffs.length+phase;
        const cr=50+i*15;
        const vx=cx+Math.cos(ca)*cr-p.x;
        const vy=cy+Math.sin(ca)*cr-p.y;
        const vd=Math.max(Math.hypot(vx,vy),5);
        const force=encodedCoeffs[i]*30*revealPhase;
        fx+=(vx/vd)*force/vd;
        fy+=(vy/vd)*force/vd;
      }
    }

    p.vx+=fx*0.016;
    p.vy+=fy*0.016;
    p.vx*=0.98;
    p.vy*=0.98;
    p.x+=p.vx;
    p.y+=p.vy;
    p.life+=0.003;

    if(p.life>p.maxLife||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50){
      const a=Math.random()*Math.PI*2;
      const r=Math.random()*Math.min(W,H)*0.3;
      p.x=cx+Math.cos(a)*r;
      p.y=cy+Math.sin(a)*r;
      p.vx=(Math.random()-0.5)*2;
      p.vy=(Math.random()-0.5)*2;
      p.life=0;
      p.hue=Math.random()*360;
    }

    const lifeFrac=1-Math.abs(p.life/p.maxLife-0.5)*2;
    const [ph,ps,pl]=pal(p.hue+t*10);
    const alpha=lifeFrac*0.7;
    const sz=p.size*(0.5+lifeFrac*0.5);

    X.fillStyle=`hsla(${ph},${ps}%,${pl}%,${alpha})`;
    X.beginPath();X.arc(p.x,p.y,sz,0,Math.PI*2);X.fill();

    if(lifeFrac>0.3){
      const grad=X.createRadialGradient(p.x,p.y,0,p.x,p.y,sz*4);
      grad.addColorStop(0,`hsla(${ph},${ps}%,${pl+10}%,${alpha*0.15})`);
      grad.addColorStop(1,`hsla(${ph},${ps}%,${pl}%,0)`);
      X.fillStyle=grad;X.beginPath();X.arc(p.x,p.y,sz*4,0,Math.PI*2);X.fill();
    }
  });

  vortices.forEach((v,i)=>{
    const pulse=1+0.15*Math.sin(t*2+i);
    const hue=(t*15+i*60)%360;
    const grad=X.createRadialGradient(v.x,v.y,0,v.x,v.y,30*pulse);
    grad.addColorStop(0,`hsla(${hue},90%,80%,0.2)`);
    grad.addColorStop(0.5,`hsla(${hue+30},80%,60%,0.08)`);
    grad.addColorStop(1,`hsla(${hue+60},70%,40%,0)`);
    X.fillStyle=grad;X.beginPath();X.arc(v.x,v.y,30*pulse,0,Math.PI*2);X.fill();
  });

  if(encodedCoeffs){
    X.strokeStyle=`rgba(255,200,0,${0.08*revealPhase})`;
    X.lineWidth=1;
    X.beginPath();
    for(let i=0;i<encodedCoeffs.length;i++){
      const a=i*Math.PI*2/encodedCoeffs.length+t*0.3;
      const r=Math.min(W,H)*0.15+encodedCoeffs[i]*100*revealPhase;
      const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
      i===0?X.moveTo(px,py):X.lineTo(px,py);
    }
    X.closePath();X.stroke();
  }

  for(let i=0;i<particles.length-1;i++){
    for(let j=i+1;j<Math.min(i+5,particles.length);j++){
      const d=Math.hypot(particles[i].x-particles[j].x,particles[i].y-particles[j].y);
      if(d<40){
        const al=0.04*(1-d/40);
        X.strokeStyle=`rgba(255,200,100,${al})`;X.lineWidth=0.5;
        X.beginPath();
        X.moveTo(particles[i].x,particles[i].y);
        X.lineTo(particles[j].x,particles[j].y);
        X.stroke();
      }
    }
  }

  requestAnimationFrame(draw);
}

lp(0);draw();
</script>
</body>
</html>
