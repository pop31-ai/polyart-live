<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polynomial Nebula</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:10;flex-wrap:wrap;justify-content:center;padding:0 10px}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:3px}
.ctrl label{color:#8af;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;text-shadow:0 0 6px #08f}
.ctrl input[type=range]{width:110px;accent-color:#0ff;cursor:pointer}
.ctrl .val{color:#0ff;font-size:12px;font-weight:bold;text-shadow:0 0 8px #0ff}
#title{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:20px;letter-spacing:6px;text-transform:uppercase;text-shadow:0 0 20px #a0f,0 0 40px #08f;z-index:10}
#preset{position:absolute;top:16px;right:16px;z-index:10;display:flex;gap:6px;flex-wrap:wrap;max-width:220px;justify-content:flex-end}
.pb{padding:4px 10px;background:rgba(0,255,255,0.06);border:1px solid #0ff3;color:#0af;font-size:9px;cursor:pointer;border-radius:3px;text-transform:uppercase;letter-spacing:1px;transition:all .2s}
.pb:hover{background:rgba(0,255,255,0.2);text-shadow:0 0 6px #0ff}
#info{position:absolute;top:52px;left:50%;transform:translateX(-50%);color:#666;font-size:10px;letter-spacing:2px;z-index:10}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Polynomial Nebula</div>
<div id="info">Звёзды как корни полинома — каждая пульсирует, излучает, живёт</div>
<div id="preset">
<button class="pb" onclick="lp(0)">Звезда</button>
<button class="pb" onclick="lp(1)">Спираль</button>
<button class="pb" onclick="lp(2)">Кольцо</button>
<button class="pb" onclick="lp(3)">Вихрь</button>
<button class="pb" onclick="lp(4)">Сетка</button>
<button class="pb" onclick="lp(5)">Взрыв</button>
</div>
<div id="ui">
<div class="ctrl"><label>Степень</label><input type="range" id="deg" min="2" max="14" value="6"><span class="val" id="degV">6</span></div>
<div class="ctrl"><label>Радиус</label><input type="range" id="rad" min="0.5" max="6" value="3" step="0.1"><span class="val" id="radV">3.0</span></div>
<div class="ctrl"><label>Вращение</label><input type="range" id="rot" min="0" max="100" value="35"><span class="val" id="rotV">0.35</span></div>
<div class="ctrl"><label>Свечение</label><input type="range" id="glow" min="1" max="12" value="6"><span class="val" id="glowV">6</span></div>
<div class="ctrl"><label>Скорость</label><input type="range" id="spd" min="1" max="100" value="45"><span class="val" id="spdV">0.45</span></div>
<div class="ctrl"><label>Палитра</label><input type="range" id="hue" min="0" max="360" value="210"><span class="val" id="hueV">210°</span></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

const S={deg:'degV',rad:'radV',rot:'rotV',glow:'glowV',spd:'spdV',hue:'hueV'};
Object.keys(S).forEach(k=>{
  document.getElementById(k).addEventListener('input',()=>{
    const v=parseFloat(document.getElementById(k).value);
    let t=v+'';if(k==='rad')t=v.toFixed(1);if(k==='rot'||k==='spd')t=(v/100).toFixed(2);if(k==='hue')t=v+'°';
    document.getElementById(S[k]).textContent=t;
  });
});

const presets=[
  {deg:6,rad:3,rot:35,glow:6,spd:45,hue:210},
  {deg:8,rad:2.5,rot:55,glow:7,spd:55,hue:280},
  {deg:10,rad:4,rot:20,glow:5,spd:30,hue:160},
  {deg:7,rad:3.5,rot:75,glow:8,spd:65,hue:330},
  {deg:4,rad:5,rot:10,glow:3,spd:25,hue:50},
  {deg:12,rad:2,rot:45,glow:9,spd:75,hue:10},
];
function lp(i){const p=presets[i];Object.keys(p).forEach(k=>{document.getElementById(k).value=p[k];document.getElementById(k).dispatchEvent(new Event('input'));});}

function gv(id){return parseFloat(document.getElementById(id).value)}

function solveRoots(coeffs){
  const n=coeffs.length-1;if(n<=0)return[];
  const roots=[];
  for(let att=0;att<n*20&&roots.length<n;att++){
    let re=(Math.random()-0.5)*8,im=(Math.random()-0.5)*8;
    for(let it=0;it<150;it++){
      let zr=re,zi=im,pr=1,pi=0,fr=0,fi=0;
      for(let k=n;k>=0;k--){
        const nr=fr*zr-fi*zi+coeffs[k],ni=fr*zi+fi*zr+0;
        fr=nr;fi=ni;
        if(k>0){const t=pr*zr-pi*zi;pi=pr*zi+pi*zr;pr=t;}
      }
      const d=pr*pr+pi*pi;if(d<1e-24)break;
      re-=(fr*pr+fi*pi)/d;im-=(fi*pr-fr*pi)/d;
    }
    let ok=true;
    for(const r of roots)if(Math.hypot(re-r[0],im-r[1])<0.05){ok=false;break;}
    if(ok&&Math.hypot(re,im)<30)roots.push([re,im]);
  }
  return roots;
}

let t=0;

const stars=Array.from({length:600},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.8+0.2,b:Math.random(),h:Math.random()*60-30}));

const dustParticles=Array.from({length:120},()=>({
  angle:Math.random()*Math.PI*2,
  radius:Math.random()*400+50,
  speed:Math.random()*0.003+0.001,
  size:Math.random()*2+0.5,
  alpha:Math.random()*0.3+0.05,
  hue:Math.random()*40-20,
  drift:Math.random()*0.5+0.2
}));

const cometTrails=[];
for(let i=0;i<8;i++){
  cometTrails.push({
    angle:Math.random()*Math.PI*2,
    radius:Math.random()*200+80,
    speed:Math.random()*0.02+0.01,
    size:Math.random()*2+1,
    trail:[],
    maxTrail:Math.floor(Math.random()*20+10),
    hue:Math.random()*60
  });
}

function draw(){
  const deg=Math.round(gv('deg')),rad=gv('rad'),rot=gv('rot')/100,gl=gv('glow'),spd=gv('spd')/100,hue=gv('hue');
  t+=spd*0.016;

  X.fillStyle='rgba(2,0,8,0.04)';
  X.fillRect(0,0,W,H);

  const cx=W/2,cy=H/2,sc=Math.min(W,H)/10;

  // Deep space dust
  dustParticles.forEach(d=>{
    d.angle+=d.speed;
    const x=cx+Math.cos(d.angle)*d.radius;
    const y=cy+Math.sin(d.angle)*d.radius*d.drift;
    const pulse=0.6+0.4*Math.sin(t*2+d.angle*3);
    X.fillStyle=`hsla(${(hue+d.hue)%360},40%,60%,${d.alpha*pulse})`;
    X.beginPath();X.arc(x,y,d.size*pulse,0,Math.PI*2);X.fill();
  });

  // Background stars with depth
  stars.forEach(s=>{
    const fl=0.3+0.3*Math.sin(t*1.5+s.b*12)+0.2*Math.sin(t*0.7+s.b*7);
    const twinkle=0.7+0.3*Math.sin(t*8+s.b*20);
    X.fillStyle=`hsla(${hue+s.h},50%,85%,${fl*0.5*twinkle})`;
    X.beginPath();X.arc(s.x*W,s.y*H,s.s*(0.8+0.4*fl),0,Math.PI*2);X.fill();
  });

  // Comet trails
  cometTrails.forEach(c=>{
    c.angle+=c.speed;
    const x=cx+Math.cos(c.angle)*c.radius;
    const y=cy+Math.sin(c.angle)*c.radius*0.6;
    c.trail.unshift({x,y});
    if(c.trail.length>c.maxTrail)c.trail.pop();
    for(let i=0;i<c.trail.length;i++){
      const alpha=1-i/c.trail.length;
      X.fillStyle=`hsla(${(hue+c.hue)%360},80%,70%,${alpha*0.3})`;
      X.beginPath();X.arc(c.trail[i].x,c.trail[i].y,c.size*alpha,0,Math.PI*2);X.fill();
    }
  });

  const coeffs=[1];
  for(let i=0;i<deg;i++){
    const a=i*Math.PI*2/deg+t*rot;
    const r=rad*(0.8+0.4*Math.sin(t*0.4+i*1.3));
    coeffs.push(-(r*Math.cos(a)));
  }

  const roots=solveRoots(coeffs);

  // Nebula clouds
  roots.forEach((root,i)=>{
    const px=cx+root[0]*sc,py=cy-root[1]*sc;
    const d=Math.hypot(root[0],root[1]);
    const h=(hue+i*360/roots.length+d*15)%360;
    const pulse=1+0.35*Math.sin(t*2.5+i*1.7);

    // Outer nebula cloud
    for(let g=gl;g>0;g--){
      const rr=g*12*pulse;
      const grad=X.createRadialGradient(px,py,0,px,py,rr);
      grad.addColorStop(0,`hsla(${h},95%,75%,${0.12/g})`);
      grad.addColorStop(0.3,`hsla(${h+25},85%,55%,${0.06/g})`);
      grad.addColorStop(0.6,`hsla(${h+50},70%,30%,${0.03/g})`);
      grad.addColorStop(1,`hsla(${h+80},50%,15%,0)`);
      X.fillStyle=grad;X.beginPath();X.arc(px,py,rr,0,Math.PI*2);X.fill();
    }

    // Inner glow ring
    X.strokeStyle=`hsla(${h},80%,65%,${0.15*pulse})`;
    X.lineWidth=1.5;
    X.beginPath();X.arc(px,py,8*pulse,0,Math.PI*2);X.stroke();

    // Star core
    const coreGrad=X.createRadialGradient(px,py,0,px,py,5*pulse);
    coreGrad.addColorStop(0,'rgba(255,255,255,0.95)');
    coreGrad.addColorStop(0.3,`hsla(${h},100%,90%,0.7)`);
    coreGrad.addColorStop(1,`hsla(${h},80%,50%,0)`);
    X.fillStyle=coreGrad;X.beginPath();X.arc(px,py,5*pulse,0,Math.PI*2);X.fill();

    // Orbital rings
    for(let r=0;r<3;r++){
      const orbR=15+r*12+3*Math.sin(t*1.5+i+r);
      X.strokeStyle=`hsla(${(h+r*30)%360},60%,50%,${0.08-r*0.02})`;
      X.lineWidth=0.5;
      X.beginPath();X.arc(px,py,orbR,0,Math.PI*2);X.stroke();
    }

    // Connection lines between nearby roots
    for(let j=i+1;j<roots.length;j++){
      const d2=Math.hypot(roots[j][0]-root[0],roots[j][1]-root[1]);
      if(d2<3.5){
        const al=0.2*(1-d2/3.5);
        const lh=(hue+i*40)%360;
        X.strokeStyle=`hsla(${lh},70%,60%,${al})`;
        X.lineWidth=0.8;
        X.beginPath();
        X.moveTo(cx+root[0]*sc,cy-root[1]*sc);
        X.lineTo(cx+roots[j][0]*sc,cy-roots[j][1]*sc);
        X.stroke();

        // Energy particles along connections
        const mx=(root[0]+roots[j][0])*sc/2+cx;
        const my=-(root[1]+roots[j][1])*sc/2+cy;
        const ep=0.5+0.5*Math.sin(t*5+i+j);
        X.fillStyle=`hsla(${lh},90%,80%,${al*ep})`;
        X.beginPath();X.arc(mx,my,1.5*ep,0,Math.PI*2);X.fill();
      }
    }
  });

  // Central polynomial curve
  const ch=(hue+80)%360;
  X.strokeStyle=`hsla(${ch},55%,50%,0.06)`;X.lineWidth=1.5;
  X.beginPath();
  for(let a=0;a<=Math.PI*2;a+=0.01){
    const rr=sc*(1+0.6*Math.sin(a*deg*0.5+t*0.8));
    const px=cx+rr*Math.cos(a),py=cy+rr*Math.sin(a);
    a===0?X.moveTo(px,py):X.lineTo(px,py);
  }
  X.closePath();X.stroke();

  // Outer ring
  X.strokeStyle=`hsla(${(hue+120)%360},40%,40%,0.04)`;X.lineWidth=2;
  X.beginPath();
  for(let a=0;a<=Math.PI*2;a+=0.01){
    const rr=sc*(1.8+0.3*Math.sin(a*6+t*0.3));
    const px=cx+rr*Math.cos(a),py=cy+rr*Math.sin(a);
    a===0?X.moveTo(px,py):X.lineTo(px,py);
  }
  X.closePath();X.stroke();

  requestAnimationFrame(draw);
}

lp(0);draw();
</script>
</body>
</html>
