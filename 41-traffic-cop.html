<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>41 — 15 Минут Регулировщика — PolyArt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060608;overflow:hidden;font-family:sans-serif}
canvas{display:block}
#ui{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10;flex-wrap:wrap;justify-content:center}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl label{color:#aaa;font-size:9px;text-transform:uppercase;letter-spacing:1.5px}
.ctrl .val{color:#ddd;font-size:11px;font-weight:bold}
button.tog{background:none;border:1px solid #0af;color:#0af;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px;letter-spacing:1px}
button.tog:hover{background:rgba(0,170,255,0.1)}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 20px #0af5;z-index:10;opacity:0.4}
#part-label{position:absolute;top:50px;left:50%;transform:translateX(-50%);color:#0af;font-size:11px;letter-spacing:3px;z-index:10;opacity:0.6;text-align:center;max-width:600px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">15 Минут Регулировщика</div>
<div id="part-label"></div>
<div id="ui">
<div class="ctrl"><label>Этап</label><button class="tog" id="prevBtn">&#9664;</button><span class="val" id="stageV">0/12</span><button class="tog" id="nextBtn">&#9654;</button></div>
<div class="ctrl"><label>Автосборка</label><button class="tog" id="autoBtn">СТАРТ</button></div>
<div class="ctrl"><label>Скорость</label><input type="range" id="speed" min="0" max="100" value="0" style="width:70px;accent-color:#0af"><span class="val" id="speedV">0</span></div>
</div>
<script>
var C=document.getElementById('c'),X=C.getContext('2d'),W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);
var stage=0,autoMode=false,autoTimer=0,maxStage=12,t=0;
document.getElementById('prevBtn').onclick=function(){if(stage>0){stage--;document.getElementById('stageV').textContent=stage+'/'+maxStage}};
document.getElementById('nextBtn').onclick=function(){if(stage<maxStage){stage++;document.getElementById('stageV').textContent=stage+'/'+maxStage}};
document.getElementById('autoBtn').onclick=function(){autoMode=!autoMode;this.textContent=autoMode?'СТОП':'СТАРТ'};
document.getElementById('speed').oninput=function(){document.getElementById('speedV').textContent=this.value};

var pts=['00:00 — Выход на смену · суп · пустая улица · тишина','00:03 — Установка · перекрёсток · фонарь · жест «стоп»','00:05 — Первый поток · такси · фары · скользят по мокрому','00:07 — Аптека · зелёный крест · одинокий прохожий · дождь','00:09 — Спор · два водителя · регулировщик разводит · жест','00:10 — Сирена · скорая · регулировщик расступается · кивок','00:11 — Птицы · голуби на проводе · город засыпает','00:12 — Дождь усиливается · лужи · отражения фар','00:13 — Полночь · часы · куранты · регулировщик стоит','00:14 — Утро близко · первые лучи · фонарь гаснет','00:15 — Смена · новый регулировщик · кивок · уходит'];

function streetlight(x,y,h,s2){
  // Pole
  X.strokeStyle='rgba(120,120,130,0.08)';X.lineWidth=1.5*s2;
  X.beginPath();X.moveTo(x,y);X.lineTo(x,y-h);X.stroke();
  // Arm
  X.lineWidth=1*s2;
  X.beginPath();X.moveTo(x,y-h);X.lineTo(x+12*s2,y-h-2*s2);X.stroke();
  // Lamp
  X.fillStyle='rgba(255,220,150,0.06)';X.beginPath();X.arc(x+12*s2,y-h-4*s2,4*s2,0,Math.PI*2);X.fill();
  // Light cone
  X.globalAlpha=0.015;X.fillStyle='rgba(255,220,150,1)';
  X.beginPath();X.moveTo(x+12*s2,y-h-4*s2);X.lineTo(x-15*s2,y+5*s2);X.lineTo(x+40*s2,y+5*s2);X.closePath();X.fill();
  X.globalAlpha=1;
}

function car(x,y,dir2,speed2){
  var w2=25*s,h2=10*s;
  X.fillStyle='rgba(60,60,70,0.06)';
  if(dir2>0){X.fillRect(x,y-h2/2,w2,h2)}else{X.fillRect(x-w2,y-h2/2,w2,h2)}
  // Roof
  X.fillStyle='rgba(50,50,60,0.05)';
  if(dir2>0){X.fillRect(x+4*s,y-h2/2-5*s,14*s,5*s)}else{X.fillRect(x-w2-4*s+7*s,y-h2/2-5*s,14*s,5*s)}
  // Headlights
  var hlX=dir2>0?x+w2:x-w2;
  X.fillStyle='rgba(255,240,200,'+(0.06+Math.sin(t*2)*0.02)+')';
  X.beginPath();X.arc(hlX,y-2*s,2*s,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(hlX,y+2*s,2*s,0,Math.PI*2);X.fill();
  // Headlight beam
  X.globalAlpha=0.008;X.fillStyle='rgba(255,240,200,1)';
  X.beginPath();X.moveTo(hlX,y);X.lineTo(hlX+dir2*60*s,y-15*s);X.lineTo(hlX+dir2*60*s,y+15*s);X.closePath();X.fill();
  X.globalAlpha=1;
  // Tail lights
  var tlX=dir2>0?x:x-w2;
  X.fillStyle='rgba(255,50,50,0.05)';X.beginPath();X.arc(tlX,y-2*s,1.5,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(tlX,y+2*s,1.5,0,Math.PI*2);X.fill();
}

function pharmacyCross(x,y,s2){
  // Green cross
  X.fillStyle='rgba(50,220,100,0.08)';
  X.fillRect(x-3*s2,y-10*s2,6*s2,20*s2);
  X.fillRect(x-8*s2,y-3*s2,16*s2,6*s2);
  // Glow
  X.globalAlpha=0.02;X.fillStyle='rgba(50,220,100,1)';
  X.beginPath();X.arc(x,y,15*s2,0,Math.PI*2);X.fill();
  X.globalAlpha=1;
  // Reflection on wet ground
  X.globalAlpha=0.01;X.fillStyle='rgba(50,220,100,1)';
  X.beginPath();X.ellipse(x,y+20*s2,12*s2,3*s2,0,0,Math.PI*2);X.fill();
  X.globalAlpha=1;
}

function cop(x,y,s2,armAngle){
  // Legs
  X.strokeStyle='rgba(255,255,255,0.07)';X.lineWidth=2*s2;
  X.beginPath();X.moveTo(x-3*s2,y);X.lineTo(x-4*s2,y+15*s2);X.stroke();
  X.beginPath();X.moveTo(x+3*s2,y);X.lineTo(x+4*s2,y+15*s2);X.stroke();
  // Body - white uniform
  X.fillStyle='rgba(255,255,255,0.06)';X.fillRect(x-5*s2,y-15*s2,10*s2,15*s2);
  // Belt
  X.fillStyle='rgba(200,180,50,0.05)';X.fillRect(x-5*s2,y-3*s2,10*s2,2*s2);
  // Head
  X.fillStyle='rgba(255,255,255,0.06)';X.beginPath();X.arc(x,y-20*s2,5*s2,0,Math.PI*2);X.fill();
  // Cap
  X.fillStyle='rgba(50,50,150,0.06)';X.fillRect(x-6*s2,y-25*s2,12*s2,5*s2);
  // Arm with baton
  X.strokeStyle='rgba(255,255,255,0.07)';X.lineWidth=2*s2;
  var shoulderX=x+5*s2,shoulderY=y-12*s2;
  var handX=shoulderX+Math.cos(armAngle)*20*s2;
  var handY=shoulderY+Math.sin(armAngle)*20*s2;
  X.beginPath();X.moveTo(shoulderX,shoulderY);X.lineTo(handX,handY);X.stroke();
  // Baton
  X.strokeStyle='rgba(255,200,100,0.08)';X.lineWidth=1.5*s2;
  X.beginPath();X.moveTo(handX,handY);X.lineTo(handX+Math.cos(armAngle)*12*s2,handY+Math.sin(armAngle)*12*s2);X.stroke();
  // Baton glow tip
  X.fillStyle='rgba(255,100,50,'+(0.04+Math.sin(t*3)*0.02)+')';
  X.beginPath();X.arc(handX+Math.cos(armAngle)*12*s2,handY+Math.sin(armAngle)*12*s2,2*s2,0,Math.PI*2);X.fill();
}

function rain(w2,h2,s2){
  for(var r=0;r<80;r++){
    var rx=(Math.sin(r*13.7)*0.5+0.5)*w2;
    var ry=((t*80+r*12)%(h2*0.8));
    X.strokeStyle='rgba(150,180,220,'+(0.02+Math.sin(r)*0.01)+')';
    X.lineWidth=0.3;
    X.beginPath();X.moveTo(rx,ry);X.lineTo(rx-1*s2,ry+6*s2);X.stroke();
  }
}

function puddle(x,y,r2,s2){
  X.fillStyle='rgba(40,60,100,0.03)';X.beginPath();X.ellipse(x,y,r2*s2,r2*0.3*s2,0,0,Math.PI*2);X.fill();
  // Ripple
  var rippleR=(t*8+r*5)%(r2*0.8);
  X.strokeStyle='rgba(100,150,220,'+(0.03*(1-rippleR/(r2*0.8)))+')';
  X.lineWidth=0.2;X.beginPath();X.ellipse(x,y,rippleR*s2,rippleR*0.2*s2,0,0,Math.PI*2);X.stroke();
}

function lbl(t2,x,y,c,sz){X.globalAlpha=0.55;X.font=(sz||6)+'px monospace';X.fillStyle=c||'rgba(200,200,220,0.8)';X.textAlign='center';X.fillText(t2,x,y);X.textAlign='left';X.globalAlpha=1}

function draw(){
  var spd=parseInt(document.getElementById('speed').value);
  if(autoMode){autoTimer+=0.016;if(autoTimer>2.5){autoTimer=0;if(stage<maxStage){stage++;document.getElementById('stageV').textContent=stage+'/'+maxStage}else{autoMode=false;document.getElementById('autoBtn').textContent='СТАРТ'}}}
  t+=0.016;
  X.fillStyle='#060608';X.fillRect(0,0,W,H);
  var cx=W/2,gy=H*0.72,s=Math.min(W,H)/650;

  // Night sky
  var sg=X.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'rgba(8,10,20,0.06)');sg.addColorStop(1,'rgba(12,15,25,0.03)');
  X.fillStyle=sg;X.fillRect(0,0,W,gy);

  // Stars
  for(var st=0;st<15;st++){
    X.fillStyle='rgba(255,255,255,'+(0.01+0.005*Math.sin(t+st))+')';
    X.beginPath();X.arc((Math.sin(st*7.3)*0.4+0.5)*W,(Math.cos(st*4.7)*0.2+0.05)*H,0.3,0,Math.PI*2);X.fill();
  }

  // Wet asphalt
  X.fillStyle='rgba(20,25,35,0.04)';X.fillRect(0,gy,W,H-gy);
  // Road markings
  for(var rm=0;rm<W;rm+=40*s){
    X.fillStyle='rgba(255,255,255,0.015)';X.fillRect(rm,gy-1,20*s,2);
  }

  // Buildings silhouettes
  var blds=[[0.08,90],[0.18,110],[0.28,80],[0.38,120],[0.48,95],[0.58,105],[0.68,85],[0.78,115],[0.88,75]];
  for(var b=0;b<blds.length;b++){
    var bx=W*blds[b][0],bh=blds[b][1]*s;
    X.fillStyle='rgba(25,28,35,0.05)';X.fillRect(bx-15*s,gy-bh,30*s,bh);
    // Windows
    for(var bw=0;bw<4;bw++){
      for(var bh2=0;bh2<Math.floor(bh/(8*s));bh2++){
        var winOn=Math.sin(b*3.7+bw*2.1+bh2*1.3+t*0.1)>0.3;
        if(winOn){
          X.fillStyle='rgba(255,200,100,'+(0.015+Math.sin(t*0.5+b+bw+bh2)*0.008)+')';
          X.fillRect(bx-12*s+bw*7*s,gy-bh+bh2*8*s+3*s,4*s,5*s);
        }
      }
    }
  }

  // Streetlight
  streetlight(cx-60*s,gy,80*s,s);

  // === STAGE 0: Coming on shift ===
  if(stage>=0){
    // Plate of food (sup)
    var plX=cx+40*s,plY=gy-30*s;
    X.fillStyle='rgba(120,80,40,0.04)';X.beginPath();X.arc(plX,plY,8*s,0,Math.PI*2);X.fill();
    X.strokeStyle='rgba(140,100,50,0.06)';X.lineWidth=0.4;X.beginPath();X.arc(plX,plY,8*s,0,Math.PI*2);X.stroke();
    // Steam
    for(var st2=0;st2<3;st2++){
      X.strokeStyle='rgba(200,200,220,'+(0.02+Math.sin(t+st2)*0.01)+')';X.lineWidth=0.3;
      X.beginPath();X.moveTo(plX-3*s+st2*3*s,plY-8*s);X.quadraticCurveTo(plX-2*s+st2*3*s+Math.sin(t*2+st2)*2,plY-14*s,plX-1*s+st2*3*s,plY-18*s);X.stroke();
    }
    // Empty street
    X.strokeStyle='rgba(255,255,255,0.01)';X.lineWidth=0.2;
    X.beginPath();X.moveTo(0,gy);X.lineTo(W,gy);X.stroke();
    lbl('00:00 — выход на смену · суп · пустая улица · тишина',cx,gy+20*s,'rgba(200,200,220,0.5)',6);
  }

  // === STAGE 1: Setting up ===
  if(stage>=1){
    cop(cx-60*s,gy-20*s,s,Math.PI*1.75+Math.sin(t*0.5)*0.1);
    // Traffic light
    X.fillStyle='rgba(40,40,50,0.05)';X.fillRect(cx+10*s,gy-60*s,8*s,20*s);
    X.strokeStyle='rgba(60,60,70,0.08)';X.lineWidth=0.4;X.strokeRect(cx+10*s,gy-60*s,8*s,20*s);
    var lightColors=['rgba(255,50,50,0.06)','rgba(255,200,50,0.04)','rgba(50,255,100,0.05)'];
    var activeLight=Math.floor(t*0.5)%3;
    for(var lc=0;lc<3;lc++){
      X.fillStyle=lc===activeLight?lightColors[lc]:'rgba(40,40,50,0.04)';
      X.beginPath();X.arc(cx+14*s,gy-55*s+lc*6*s,2*s,0,Math.PI*2);X.fill();
    }
    lbl('00:03 — перекрёсток · фонарь · жест «стоп»',cx,gy+20*s,'rgba(200,200,220,0.5)',6);
  }

  // === STAGE 2: First traffic ===
  if(stage>=2){
    cop(cx-60*s,gy-20*s,s,Math.PI*1.5+Math.sin(t*2)*0.3);
    // Taxi
    var taxiX=((t*40)%W);
    car(taxiX,gy-5*s,1,1);
    // Taxi roof light
    X.fillStyle='rgba(255,200,50,'+(0.04+Math.sin(t*3)*0.02)+')';
    X.beginPath();X.arc(taxiX+12*s,gy-12*s,2*s,0,Math.PI*2);X.fill();
    // Reflections on wet road
    X.globalAlpha=0.01;X.fillStyle='rgba(255,240,200,1)';
    X.beginPath();X.ellipse(taxiX+12*s,gy+3*s,8*s,2*s,0,0,Math.PI*2);X.fill();
    X.globalAlpha=1;
    lbl('00:05 — такси · фары · скользят по мокрому',cx,gy+20*s,'rgba(200,200,220,0.5)',6);
  }

  // === STAGE 3: Pharmacy ===
  if(stage>=3){
    pharmacyCross(cx+60*s,gy-80*s,s);
    // Lone pedestrian
    var pedX=cx+40*s+Math.sin(t*0.3)*5*s;
    X.strokeStyle='rgba(200,200,220,0.05)';X.lineWidth=1.5*s;
    X.beginPath();X.moveTo(pedX,gy-15*s);X.lineTo(pedX,gy);X.stroke();
    X.beginPath();X.moveTo(pedX,gy-15*s);X.lineTo(pedX+Math.sin(t)*2*s,gy-20*s);X.stroke();
    X.fillStyle='rgba(200,200,220,0.05)';X.beginPath();X.arc(pedX+Math.sin(t)*2*s,gy-22*s,3*s,0,Math.PI*2);X.fill();
    // Umbrella
    X.strokeStyle='rgba(150,100,150,0.04)';X.lineWidth=0.5;
    X.beginPath();X.arc(pedX+Math.sin(t)*2*s,gy-25*s,8*s,Math.PI,0);X.stroke();
    rain(W,H,s);
    lbl('00:07 — аптека · зелёный крест · прохожий · дождь',cx,gy+20*s,'rgba(200,200,220,0.5)',6);
  }

  // === STAGE 4: Argument ===
  if(stage>=4){
    cop(cx-60*s,gy-20*s,s,Math.PI*1.25+Math.sin(t*4)*0.2);
    // Two cars stopped
    car(cx-20*s,gy-5*s,-1,0);car(cx+30*s,gy-5*s,1,0);
    // Angry gestures
    X.strokeStyle='rgba(255,200,100,0.04)';X.lineWidth=0.3;
    X.beginPath();X.moveTo(cx-10*s,gy-10*s);X.lineTo(cx-5*s,gy-15*s);X.stroke();
    X.beginPath();X.moveTo(cx+35*s,gy-10*s);X.lineTo(cx+40*s,gy-15*s);X.stroke();
    // Cop separating
    X.strokeStyle='rgba(255,255,255,0.04)';X.lineWidth=0.5;
    X.beginPath();X.moveTo(cx-55*s,gy-15*s);X.lineTo(cx-45*s,gy-12*s);X.stroke();
    lbl('00:09 — спор · два водителя · регулировщик разводит',cx,gy+20*s,'rgba(200,200,220,0.5)',6);
  }

  // === STAGE 5: Ambulance ===
  if(stage>=5){
    cop(cx-60*s,gy-20*s,s,Math.PI*1.75);
    // Ambulance
    var ambX=cx+((t*30)%W);
    car(ambX,gy-5*s,-1,1);
    // Red cross on ambulance
    X.fillStyle='rgba(255,50,50,'+(0.05+Math.sin(t*5)*0.03)+')';
    X.fillRect(ambX-8*s,gy-10*s,3*s,6*s);X.fillRect(ambX-10*s,gy-8*s,7*s,2*s);
    // Siren light
    X.fillStyle='rgba(255,50,50,'+(0.06+Math.sin(t*8)*0.04)+')';
    X.beginPath();X.arc(ambX,gy-14*s,3*s,0,Math.PI*2);X.fill();
    // Siren glow
    X.globalAlpha=0.01;X.fillStyle='rgba(255,50,50,1)';
    X.beginPath();X.arc(ambX,gy-14*s,20*s,0,Math.PI*2);X.fill();
    X.globalAlpha=1;
    // Cop bowing
    cop(cx-60*s,gy-20*s,s,Math.PI*1.5);
    lbl('00:10 — сирена · скорая · расступается · кивок',cx,gy+20*s,'rgba(200,200,220,0.5)',6);
  }

  // === STAGE 6: Birds ===
  if(stage>=6){
    // Pigeons on wire
    var wireY=gy-90*s;
    X.strokeStyle='rgba(120,120,130,0.04)';X.lineWidth=0.3;
    X.beginPath();X.moveTo(0,wireY);X.lineTo(W,wireY);X.stroke();
    for(var pg=0;pg<5;pg++){
      var pgX=W*0.3+pg*15*s;
      X.fillStyle='rgba(150,150,160,0.04)';X.beginPath();X.arc(pgX,wireY-2*s,2.5*s,0,Math.PI*2);X.fill();
      // Head
      X.beginPath();X.arc(pgX+2*s,wireY-4*s,1.5*s,0,Math.PI*2);X.fill();
    }
    // City falling asleep
    for(var wd2=0;wd2<8;wd2++){
      var wdx=W*0.1+wd2*W*0.11;
      var wdy=gy-80*s-Math.sin(wd2*1.7)*30*s;
      X.fillStyle='rgba(255,200,100,'+(0.005+Math.sin(t*0.3+wd2)*0.003)+')';
      X.beginPath();X.arc(wdx,wdy,1,0,Math.PI*2);X.fill();
    }
    lbl('00:11 — голуби на проводе · город засыпает',cx,gy+20*s,'rgba(200,200,220,0.5)',6);
  }

  // === STAGE 7: Rain intensifies ===
  if(stage>=7){
    rain(W,H,s);
    // More puddles
    puddle(cx-30*s,gy+5*s,15,s);puddle(cx+40*s,gy+8*s,10,s);puddle(cx-60*s,gy+3*s,8,s);
    // Reflections of pharmacy
    X.globalAlpha=0.008;X.fillStyle='rgba(50,220,100,1)';
    X.beginPath();X.ellipse(cx+60*s,gy+15*s,20*s,4*s,0,0,Math.PI*2);X.fill();
    X.globalAlpha=1;
    // Cop standing in rain
    cop(cx-60*s,gy-20*s,s,Math.PI*1.75+Math.sin(t)*0.05);
    // Rain on cop
    for(var rc=0;rc<5;rc++){
      X.strokeStyle='rgba(150,180,220,0.03)';X.lineWidth=0.2;
      var rcx=cx-60*s+Math.sin(rc*3)*5*s;
      X.beginPath();X.moveTo(rcx,gy-35*s);X.lineTo(rcx-1,gy-30*s);X.stroke();
    }
    lbl('00:12 — дождь усиливается · лужи · отражения фар',cx,gy+20*s,'rgba(200,200,220,0.5)',6);
  }

  // === STAGE 8: Midnight ===
  if(stage>=8){
    // Clock tower
    var clX=cx+70*s,clY=gy-60*s;
    X.fillStyle='rgba(60,60,70,0.04)';X.fillRect(clX-12*s,clY,24*s,40*s);
    X.strokeStyle='rgba(80,80,90,0.06)';X.lineWidth=0.4;X.strokeRect(clX-12*s,clY,24*s,40*s);
    // Clock face
    X.strokeStyle='rgba(200,200,220,0.06)';X.lineWidth=0.5;
    X.beginPath();X.arc(clX,clY+8*s,8*s,0,Math.PI*2);X.stroke();
    // Hands at midnight
    X.beginPath();X.moveTo(clX,clY+8*s);X.lineTo(clX,clY+1*s);X.stroke();
    X.beginPath();X.moveTo(clX,clY+8*s);X.lineTo(clX+6*s,clY+8*s);X.stroke();
    // Chimes
    for(var ch=0;ch<3;ch++){
      X.strokeStyle='rgba(200,200,220,'+(0.03-ch*0.008)+')';X.lineWidth=0.3;
      X.beginPath();X.arc(clX,clY+8*s,10*s+ch*5*s,0,Math.PI*2);X.stroke();
    }
    // Cop standing still
    cop(cx-60*s,gy-20*s,s,Math.PI*1.75);
    lbl('00:13 — полночь · часы · куранты · регулировщик стоит',cx,gy+20*s,'rgba(200,200,220,0.5)',6);
  }

  // === STAGE 9: Dawn approaching ===
  if(stage>=9){
    // Sky getting lighter
    var dawnGrad=X.createLinearGradient(0,0,0,gy);
    dawnGrad.addColorStop(0,'rgba(15,12,25,0.06)');dawnGrad.addColorStop(0.7,'rgba(20,15,30,0.04)');dawnGrad.addColorStop(1,'rgba(40,25,35,0.03)');
    X.fillStyle=dawnGrad;X.fillRect(0,0,W,gy);
    // First light on horizon
    X.fillStyle='rgba(255,150,80,0.015)';X.fillRect(0,gy-5*s,W,5*s);
    // Streetlight flickering
    var flicker=Math.sin(t*10)>0.8?0.02:0.06;
    X.fillStyle='rgba(255,220,150,'+flicker+')';X.beginPath();X.arc(cx-60*s+12*s,gy-80*s-4*s,4*s,0,Math.PI*2);X.fill();
    cop(cx-60*s,gy-20*s,s,Math.PI*1.75+Math.sin(t*0.5)*0.05);
    lbl('00:14 — утро близко · первые лучи · фонарь гаснет',cx,gy+20*s,'rgba(200,200,220,0.5)',6);
  }

  // === STAGE 10: Shift change ===
  if(stage>=10){
    // Second cop approaching
    var newCopX=cx-80*s+Math.min(t*5,20)*s;
    cop(newCopX,gy-20*s,s,Math.PI*1.75);
    // First cop leaving
    var oldCopX=cx-60*s+Math.min(t*3,15)*s;
    cop(oldCopX,gy-20*s,s,Math.PI*1.5);
    // Dawn light
    X.fillStyle='rgba(255,180,100,0.01)';X.fillRect(0,gy-3*s,W,3*s);
    // Headlights of early cars
    for(var ec=0;ec<2;ec++){
      var ecX=W*0.2+ec*W*0.6+((t*20)%(W*0.3));
      car(ecX,gy-5*s,1,0.5);
    }
    lbl('00:15 — смена · кивок · уходит',cx,gy+20*s,'rgba(200,200,220,0.5)',6);
  }

  document.getElementById('part-label').textContent=pts[stage]||'';
  X.fillStyle='rgba(200,200,220,0.03)';X.fillRect(W*0.1,H-8,W*0.8,3);
  X.fillStyle='rgba(200,200,220,0.1)';X.fillRect(W*0.1,H-8,W*0.8*(stage/maxStage),3);
  for(var sd=0;sd<=maxStage;sd++){X.fillStyle=sd<=stage?'rgba(200,200,220,0.2)':'rgba(200,200,220,0.05)';X.beginPath();X.arc(W*0.1+W*0.8*(sd/maxStage),H-6.5,2,0,Math.PI*2);X.fill()}
  requestAnimationFrame(draw);
}
draw();
</script></body></html>
